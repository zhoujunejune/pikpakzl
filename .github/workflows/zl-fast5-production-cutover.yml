name: FAST5 no-DeepSeek production signal cutover
on:
  push:
    branches: [feat/deepseek40-45s-ai-only-prod-20261025]
    paths: [.github/workflows/zl-fast5-production-cutover.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: zl-alibaba-prediction-singlehost
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Validate fast market calculator, service and exact cutover script
        run: |
          python -m py_compile prediction-bot-v1/fast5_production_cutover.py
          node --check prediction-bot-v1/fast5-real-market-calculator.mjs
          node --check prediction-bot-v1/fast5-real-market-service.mjs
          node --test prediction-bot-v1/fast5-real-market-calculator.test.mjs prediction-bot-v1/fast5-real-market-service.test.mjs
  deploy:
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Guarded no-LLM producer and original trading-router signal source switch
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          python - <<'OUTER'
          import base64,os,time
          from alibabacloud_swas_open20200601.client import Client
          from alibabacloud_swas_open20200601 import models as sw
          from alibabacloud_tea_openapi import models as api
          sha=os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_REF_NAME']=='feat/deepseek40-45s-ai-only-prod-20261025'
          script="""#!/bin/bash
          set -Eeuo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL --retry 2 --max-time 35 "https://raw.githubusercontent.com/zhoujunejune/pikpakzl/COMMIT_SHA/prediction-bot-v1/fast5_production_cutover.py" -o "$tmp/cutover.py"
          python3 -m py_compile "$tmp/cutover.py"
          python3 "$tmp/cutover.py" COMMIT_SHA
          """.replace('COMMIT_SHA',sha)
          c=Client(api.Config(access_key_id=os.environ['ALIBABA_CLOUD_ACCESS_KEY_ID'],access_key_secret=os.environ['ALIBABA_CLOUD_ACCESS_KEY_SECRET'],region_id='ap-southeast-1',endpoint='swas.ap-southeast-1.aliyuncs.com'))
          ident=c.run_command(sw.RunCommandRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',name='zl-fast5-real-tick-deepseek-free-production-cutover',type='RunShellScript',working_user='root',command_content=script,timeout=245)).body.invoke_id
          for _ in range(130):
           time.sleep(2)
           x=c.describe_invocation_result(sw.DescribeInvocationResultRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',invoke_id=ident)).body.invocation_result
           if x and str(x.invocation_status) in ('Success','Failed','Aborted','ExecutionTimeout','ExitCodeNonzero'):
            out=base64.b64decode(x.output or '',validate=True).decode('utf8','replace')
            print('FAST5_PRODUCTION_RUN',x.invocation_status,'EXIT',x.exit_code)
            print(out[-13000:])
            if x.invocation_status!='Success' or int(x.exit_code)!=0:raise RuntimeError('FAST5_CUTOVER_FAILED')
            break
          else:raise RuntimeError('FAST5_CUTOVER_TIMEOUT')
          OUTER
