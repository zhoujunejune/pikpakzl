name: Inspect Alibaba live prediction UI for AI40/45 migration (read only)
on:
  push:
    branches: [feat/deepseek40-45s-ai-only-prod-20261025]
    paths: [.github/workflows/zl-deepseek40-panel-readonly.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Inspect current running production dashboard rendering without editing it
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          python - <<'OUTER'
          import base64,os,time
          from alibabacloud_swas_open20200601.client import Client
          from alibabacloud_swas_open20200601 import models as sw
          from alibabacloud_tea_openapi import models as api
          script=r"""#!/bin/bash
          set -eu
          python3 - <<'INNER'
          from pathlib import Path
          import urllib.request,json,re,hashlib
          f=Path('/opt/zl-prediction-live/src/railway-diagnostic/panel-stats-shell.mjs')
          src=f.read_text()
          print('PANEL_SHA',hashlib.sha256(src.encode()).hexdigest())
          print('PANEL_SOURCE_BYTES',len(src))
          queries=['DeepSeek','rsMeta','renderDeepSeekRoundStats','statsCard','statsScript','/deepseek/api/status','/deepseek/api/history','roundDecision','decisionWindowEndMs','signalPolicyCard','本轮','秒','预分析','学习','胜率','锁定','待结算','每轮']
          for i,l in enumerate(src.splitlines(),1):
           if any(q in l for q in queries):
            cleaned=l[:650].replace('password','[pw]') if len(l)>650 else l.replace('password','[pw]')
            print('PANEL_SOURCE',i,cleaned)
          url='http://127.0.0.1:13001/'
          with urllib.request.urlopen(url,timeout=8) as x:page=x.read().decode('utf8','replace')
          print('PANEL_LIVE_HTTP=200')
          for k in ['DeepSeek','renderDeepSeekRoundStats','/deepseek/api/history','/deepseek/api/status','rsMeta','ai40','45秒','40秒','25秒','15秒','5秒']:
           print('PANEL_HTML_MARKER',k,page.count(k))
          print('PANEL_LIVE_HTML_BYTES',len(page))
          for k in ['DeepSeek','5秒','锁定','预测','统计','开始跟随']:
           found=list(re.finditer(re.escape(k),page))
           for m in found[:3]:
            print('PANEL_HTML_SNIPPET',k,repr(page[max(0,m.start()-260):m.end()+250].replace('\\n',' ')[:540]))
          print('PANEL_HTML_IDS',re.findall(r'id=[\\\"\\\']([a-zA-Z0-9_-]+)[\\\"\\\']',page)[:90])
          print('PANEL_SCRIPT_SRCS',re.findall(r'<script[^>]+src=[\\\"\\\']([^\\\"\\\']+)',page)[:35])
          for i,line in enumerate(src.splitlines(),1):
           if i<=250: print('PANEL_CODE',i,line[:250])
          
          for port,route in [(13029,'/api/status'),(13029,'/api/history?limit=1'),(13001,'/api/status')]:
           with urllib.request.urlopen(f'http://127.0.0.1:{port}{route}',timeout=8) as x:data=json.load(x)
           if port==13029 and route=='/api/status':
            print('PANEL_CURRENT_AI',json.dumps({k:data.get(k) for k in ['model','prewarmStartMs','decisionWindowEndMs','maxCallsPerRound','learning','reasoning']},ensure_ascii=False)[:1000])
           elif port==13001:print('PANEL_FOLLOW',data.get('enabled'))
           else:print('PANEL_HISTORY_OK',data.get('ok'),len(data.get('records',[])))
          print('PANEL_INSPECTION_DONE=true')
          INNER
          """
          c=Client(api.Config(access_key_id=os.environ['ALIBABA_CLOUD_ACCESS_KEY_ID'],
          access_key_secret=os.environ['ALIBABA_CLOUD_ACCESS_KEY_SECRET'],
          endpoint='swas.ap-southeast-1.aliyuncs.com',region_id='ap-southeast-1'))
          inv=c.run_command(sw.RunCommandRequest(region_id='ap-southeast-1',
          instance_id='b67374069bb3457ba6a3a2ede9305d3f',name='zl-ai40-live-ui-readonly',
          type='RunShellScript',working_user='root',command_content=script,timeout=90)).body.invoke_id
          for _ in range(48):
           time.sleep(2)
           r=c.describe_invocation_result(sw.DescribeInvocationResultRequest(region_id='ap-southeast-1',
           instance_id='b67374069bb3457ba6a3a2ede9305d3f',invoke_id=inv)).body.invocation_result
           if r and str(r.invocation_status) in ('Success','Failed','Aborted','ExecutionTimeout','ExitCodeNonzero'):
            raw=base64.b64decode(r.output or '',validate=True).decode('utf8','replace')
            print('PANEL_REMOTE_STATUS',r.invocation_status,'EXIT',r.exit_code)
            print(raw[-26000:])
            if int(r.exit_code)!=0:raise RuntimeError('PANEL_INSPECTION_FAILED')
            break
          else:raise RuntimeError('PANEL_INSPECTION_TIMEOUT')
          OUTER
