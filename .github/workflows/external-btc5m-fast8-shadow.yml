name: Single FAST8 external model production regression
on:
  pull_request:
    paths:
      - 'round-tracker/**'
      - 'railway-diagnostic/panel-stats-shell.mjs'
      - 'railway-diagnostic/control-quick-inputs.test.mjs'
      - 'railway-diagnostic/order-direction-policy.mjs'
      - 'railway-diagnostic/order-direction-policy.test.mjs'
      - 'railway-diagnostic/index.mjs'
      - 'railway-diagnostic/wrapper.mjs'
      - 'railway-diagnostic/egress-ip-diagnostic.mjs'
      - 'railway-diagnostic/egress-ip-diagnostic.test.mjs'
      - '.github/workflows/external-btc5m-fast8-shadow.yml'
  push:
    branches: [main]
    paths:
      - 'round-tracker/**'
      - 'railway-diagnostic/panel-stats-shell.mjs'
      - 'railway-diagnostic/control-quick-inputs.test.mjs'
      - 'railway-diagnostic/order-direction-policy.mjs'
      - 'railway-diagnostic/order-direction-policy.test.mjs'
      - 'railway-diagnostic/index.mjs'
      - 'railway-diagnostic/wrapper.mjs'
      - 'railway-diagnostic/egress-ip-diagnostic.mjs'
      - 'railway-diagnostic/egress-ip-diagnostic.test.mjs'
jobs:
  fast8-production-single-model:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check round-tracker/fast8-engine.mjs
          node --check round-tracker/fast8-production-gate.mjs
          node --check round-tracker/external-btc5m-fast8-shadow.mjs
          node --check round-tracker/external-fast8-primary.mjs
          node --check round-tracker/index-rest.mjs
          node --check railway-diagnostic/panel-stats-shell.mjs
          node --check railway-diagnostic/order-direction-policy.mjs
          node --check railway-diagnostic/index.mjs
          node --check railway-diagnostic/wrapper.mjs
          node --check railway-diagnostic/egress-ip-diagnostic.mjs
      - name: Install diagnostic test dependencies
        run: npm --prefix railway-diagnostic install --no-audit --no-fund
      - name: Offline single-model regression without orders
        run: |
          node --test round-tracker/fast8-current-round-only.test.mjs round-tracker/external-btc5m-fast8-shadow.test.mjs round-tracker/external-fast8-primary.test.mjs round-tracker/fast8.test.mjs round-tracker/fast8-production-gate.test.mjs railway-diagnostic/control-quick-inputs.test.mjs railway-diagnostic/order-direction-policy.test.mjs railway-diagnostic/egress-ip-diagnostic.test.mjs
