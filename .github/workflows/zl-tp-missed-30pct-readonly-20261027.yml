name: Production TP SL trigger and missed-profit read-only audit
on:
  push:
    branches: [feat/deepseek40-45s-ai-only-prod-20261025]
    paths:
      - .github/workflows/zl-tp-missed-30pct-readonly-20261027.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Read live TP settings, worker process state and recent risk logs without modifying trading
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          python - <<'OUTER'
          import os,time,base64
          from alibabacloud_swas_open20200601.client import Client
          from alibabacloud_swas_open20200601 import models as sw
          from alibabacloud_tea_openapi import models as api
          script=r"""#!/bin/bash
          set -euo pipefail
          python3 - <<'INNER'
          import os,json,pathlib,subprocess,urllib.request,datetime,collections
          def safe(obj):
           allow={'enabled','takeProfitEnabled','takeProfitPercent','stopLossEnabled','stopLossPercent',
             'ready','workerRunning','configApplied','source','configurationSource','configUpdatedAt',
             'updatedAt','at','lastWorkerStartedAt','lastSuccessfulPositionsAt','positionsSeen',
             'lastQuoteAt','lastQuoteAmount','quoteChecks','quoteErrors','lastErrorAt','lastError',
             'lastSellEventAt','lastSellEvent','persistenceReady','persistenceHealthy',
             'persistedConfigFound','execution','persistenceError','workerPid','transitioning'}
           if isinstance(obj,dict):return {k:safe(v) for k,v in obj.items() if k in allow}
           if isinstance(obj,list):return [safe(v) for v in obj[:20]]
           return obj
          def emit(tag,payload):
           print(tag,json.dumps(payload,ensure_ascii=False,default=str)[:6200],flush=True)
          def q(port,route):
           try:
            with urllib.request.urlopen('http://127.0.0.1:%d%s'%(port,route),timeout=8) as r:
             return r.status,json.load(r)
           except Exception as e:return getattr(e,'code',0),{'error':type(e).__name__}
          for port,route in [(13001,'/api/risk-control'),(13001,'/api/status'),(13001,'/api/risk-runtime-status')]:
           status,body=q(port,route)
           emit('TP_AUDIT_CONFIG',{'port':port,'route':route,'http':status,'data':safe(body)})
          for path in ['/tmp/risk-control.json','/tmp/risk-runtime-status.json','/tmp/risk-worker-health.json','/tmp/tp50-control.json']:
           p=pathlib.Path(path)
           try:emit('TP_AUDIT_LOCAL',{'path':path,'mtime':datetime.datetime.fromtimestamp(p.stat().st_mtime,datetime.timezone.utc).isoformat(),'data':safe(json.loads(p.read_text()))})
           except Exception as e:emit('TP_AUDIT_LOCAL',{'path':path,'error':type(e).__name__})
          cmd=['systemctl','list-units','--type=service','--all','--no-pager','--plain','--no-legend']
          proc=subprocess.run(cmd,capture_output=True,text=True,timeout=9)
          units=[line.split()[0] for line in proc.stdout.splitlines() if any(k in line.lower() for k in ['prediction','risk','tp50'])]
          for unit in units:
           meta=subprocess.run(['systemctl','show',unit,'-p','ActiveState,SubState,MainPID,NRestarts,ExecMainStatus,ActiveEnterTimestamp'],capture_output=True,text=True,timeout=8)
           emit('TP_AUDIT_UNIT',{'unit':unit,'meta':meta.stdout[:450]})
          proc=subprocess.run(['ps','-eo','pid,etimes,comm,args'],capture_output=True,text=True,timeout=6)
          for line in proc.stdout.splitlines():
           if any(x in line for x in ['risk-runner.mjs','risk-worker.mjs','tp50-runner.mjs','tp50-worker.mjs']):
            pieces=line.split()
            emit('TP_AUDIT_PROCESS',{'pid':pieces[0] if pieces else None,'ageSec':pieces[1] if len(pieces)>1 else None,'name':pieces[2] if len(pieces)>2 else None,'script':next((x for x in ['risk-runner.mjs','risk-worker.mjs','tp50-runner.mjs','tp50-worker.mjs'] if x in line),None)})
          # Read journal only. Never print credentials, account ids, wallet or full token identifiers.
          for unit in units:
           if 'risk' not in unit and 'trade' not in unit and 'tp' not in unit:continue
           p=subprocess.run(['journalctl','--no-pager','-u',unit,'--since','45 min ago','-o','cat','-n','1700'],capture_output=True,text=True,timeout=18)
           events=[];counts=collections.Counter()
           for line in p.stdout.splitlines():
            ix=line.find('{')
            if ix<0:continue
            try:v=json.loads(line[ix:])
            except Exception:continue
            kind=v.get('event')
            if not isinstance(kind,str) or not (kind.startswith('risk_') or kind.startswith('tp50_') or kind.startswith('tp_')):continue
            counts[kind]+=1
            if kind not in ('risk_check','risk_sell_submitted','risk_triggered','risk_sell_failed','risk_sell_unknown','risk_sell_quote_failed','risk_invalid_position','risk_worker_started','risk_runtime_worker_started','risk_positions_error','risk_wallet_error','risk_tick_exception','risk_sell_exception','risk_runtime_config_updated'):
             continue
            small={k:v.get(k) for k in ('at','event','reason','error','code','httpStatus','tpTriggered','slTriggered',
              'takeProfitEnabled','takeProfitPercent','stopLossEnabled','stopLossPercent','pollMs','retryMs',
              'totalCost','currentSellAmount','tpTarget','slTarget','targetAmount','positionsSeen') if k in v}
            if isinstance(small.get('totalCost'),(int,float)) and small['totalCost']>0 and isinstance(small.get('currentSellAmount'),(int,float)):
             small['sellRoiPct']=round(100*(small['currentSellAmount']/small['totalCost']-1),3)
            if kind=='risk_check':events.append(small)
            elif kind=='risk_worker_started' or kind=='risk_runtime_worker_started':events.append(small)
            else:events.append(small)
           checks=[x for x in events if x.get('event')=='risk_check']
           nonchecks=[x for x in events if x.get('event')!='risk_check']
           top=sorted(checks,key=lambda x:x.get('sellRoiPct',-1e5),reverse=True)[:7]
           emit('TP_AUDIT_JOURNAL',{'unit':unit,'counts':dict(counts),'highestSellRoi':top,
              'recentChecks':checks[-7:],'recentNonChecks':nonchecks[-35:]})
          INNER
          """
          c=Client(api.Config(access_key_id=os.environ['ALIBABA_CLOUD_ACCESS_KEY_ID'],access_key_secret=os.environ['ALIBABA_CLOUD_ACCESS_KEY_SECRET'],region_id='ap-southeast-1',endpoint='swas.ap-southeast-1.aliyuncs.com'))
          ident=c.run_command(sw.RunCommandRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',name='zl-prediction-tp-missed-30-percent-readonly',type='RunShellScript',working_user='root',command_content=script,timeout=175)).body.invoke_id
          for _ in range(90):
           time.sleep(2)
           x=c.describe_invocation_result(sw.DescribeInvocationResultRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',invoke_id=ident)).body.invocation_result
           if x and str(x.invocation_status) in ('Success','Failed','Aborted','ExecutionTimeout','ExitCodeNonzero'):
            print('TP_AUDIT_REMOTE',x.invocation_status,'EXIT',x.exit_code)
            try:print(base64.b64decode(x.output or '',validate=True).decode('utf8','replace')[-23000:])
            except Exception:print('TP_AUDIT_OUTPUT_DECODE_FAILED')
            if x.invocation_status!='Success' or int(x.exit_code)!=0:raise RuntimeError('TP_AUDIT_COMMAND_FAILED')
            break
          else:raise RuntimeError('TP_AUDIT_COMMAND_TIMEOUT')
          OUTER
