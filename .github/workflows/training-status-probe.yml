name: Training Status Probe
on:
  pull_request:
    paths:
      - '.github/workflows/training-status-probe.yml'
      - 'scripts/audit_strict_forward.py'
      - 'scripts/test_audit_strict_forward.py'
      - 'scripts/independent_binance_settlement.py'
      - '.github/workflows/independent-binance-settlement.yml'
      - 'round-tracker/index-rest.mjs'
      - 'fast-signal-engine/index.mjs'
  push:
    paths:
      - '.github/workflows/training-status-probe.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate settlement provenance code syntax
        run: |
          node --check round-tracker/index-rest.mjs
          node --check fast-signal-engine/index.mjs
      - name: Test independent settlement reconciler
        run: python3 -m unittest discover -s scripts -p 'test_audit_strict_forward.py' -v
      - name: Validate independent audit script syntax (no secrets)
        run: python3 -m py_compile scripts/independent_binance_settlement.py
      - name: Test independent signed Binance audit on trusted branch push only
        if: github.event_name == 'push' && github.ref == 'refs/heads/audit/independent-binance-official-20261009'
        env:
          BINANCE_PREDICTION_API_KEY: ${{ secrets.BINANCE_PREDICTION_API_KEY }}
          BINANCE_PREDICTION_API_SECRET: ${{ secrets.BINANCE_PREDICTION_API_SECRET }}
        run: python3 scripts/independent_binance_settlement.py
      - name: Upload independent audit report
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/audit/independent-binance-official-20261009'
        uses: actions/upload-artifact@v4
        with:
          name: independent-audit-branch-test
          path: audit-output/independent-settlement.json
          if-no-files-found: warn
          retention-days: 7
      - name: Fetch training status
        shell: bash
        run: |
          set -euo pipefail

          echo "===OFFICIAL_V2_STATUS_BEGIN==="
          curl -fsS --retry 2 --retry-delay 2 --max-time 25 \
            'https://trade-control-panel-production.up.railway.app/api/training-status' \
            -o /tmp/official-v2-training-status.json
          jq -e '
            .ok == true and
            (.generatedAt | type == "string") and
            (.production | type == "object") and
            (.models.edgeRescueTier1 | type == "object") and
            (.models.edgeRescueExpansion | type == "object") and
            (.models.noBaseSpecialist | type == "object")
          ' /tmp/official-v2-training-status.json >/dev/null
          # Reject stale/future snapshots and inconsistent official aggregate counts.
          now_s=$(date -u +%s)
          generated_at=$(jq -er '.generatedAt' /tmp/official-v2-training-status.json)
          generated_s=$(date -u -d "$generated_at" +%s)
          age_s=$((now_s - generated_s))
          if (( age_s < -120 || age_s > 900 )); then
            echo "::error::Training snapshot stale or future-dated: age=${age_s}s"
            exit 1
          fi
          validation_filter=$(cat <<'JQ'
          def nonnegInt: type == "number" and . >= 0 and floor == .;
          def validCounts:
            (.samples | nonnegInt) and (.hits | nonnegInt) and
            (.misses | nonnegInt) and
            (.samples == (.hits + .misses)) and
            (if .samples > 0 then
              (.accuracy | type == "number") and
              ((.accuracy - (.hits / .samples)) | fabs < 0.0002)
            else (.accuracy == null or .accuracy == 0) end);
          (.production.recent10 | validCounts) and
          (.production.recent20 | validCounts) and
          (.production.selectiveV2 | validCounts) and
          (.models.edgeRescueTier1.eligibleStrictForward | validCounts) and
          (.models.edgeRescueTier1.production | validCounts) and
          (.models.edgeRescueExpansion.candidates | type == "array" and length > 0) and
          all(.models.edgeRescueExpansion.candidates[];
            (.strictForwardSamples | nonnegInt) and
            (.hits | nonnegInt) and
            (.misses | nonnegInt) and
            (.strictForwardSamples == .hits + .misses) and
            (if .strictForwardSamples > 0 then
              (.forwardAccuracy | type == "number") and
              ((.forwardAccuracy - (.hits / .strictForwardSamples)) | fabs < 0.0002)
            else (.forwardAccuracy == null) end))
          
          JQ
          )
          jq -e "$validation_filter" /tmp/official-v2-training-status.json >/dev/null
          # Run negative tests against the SAME validation filter as the live snapshot.
          for mutation in \
            '.models.edgeRescueExpansion.candidates[0].hits = -1' \
            '.models.edgeRescueExpansion.candidates[0].strictForwardSamples = 1.5' \
            '.models.edgeRescueExpansion.candidates = []' \
            '.production.recent20.hits = -1' \
            '.production.recent20.samples = 1.5' \
            'del(.production.recent20.hits)' \
            '.production.recent20.accuracy = 0.123'; do
            if jq "$mutation" /tmp/official-v2-training-status.json | jq -e "$validation_filter" >/dev/null 2>&1; then
              echo "::error::Negative validation test unexpectedly passed: $mutation"
              exit 1
            fi
          done
          # A wrong candidate accuracy must also fail, including nonzero samples.
          if jq '.models.edgeRescueExpansion.candidates[0] |= (.strictForwardSamples = 2 | .hits = 2 | .misses = 0 | .forwardAccuracy = 0.25)' /tmp/official-v2-training-status.json | jq -e "$validation_filter" >/dev/null 2>&1; then
            echo "::error::Candidate accuracy mismatch was accepted"
            exit 1
          fi
          echo "Negative validation tests passed (8 cases)"
          echo "Official aggregate count and freshness checks passed (age=${age_s}s)"
          jq -c '{
            generatedAt,scope,
            production:{recent10:.production.recent10,recent20:.production.recent20,selectiveV2:.production.selectiveV2},
            models:{
              edgeRescueTier1:.models.edgeRescueTier1,
              edgeRescueExpansion:.models.edgeRescueExpansion,
              noBaseSpecialist:.models.noBaseSpecialist,
              baseDirectionRescueV2:.models.baseDirectionRescueV2
            },
            note:"Official server-reported metrics; UP tightening replay elsewhere in this log is retrospective only."
          }' /tmp/official-v2-training-status.json
          echo "===OFFICIAL_V2_STATUS_END==="
          echo "===TRAINING_STATUS_BEGIN==="
          curl -fsS --max-time 20 'https://trade-control-panel-production.up.railway.app/api/training-status'
          echo
          echo "===TRAINING_STATUS_END==="
          echo "===BASE_DIRECTION_RESCUE_V2_BEGIN==="
          curl -fsS --max-time 20 'https://trade-control-panel-production.up.railway.app/api/training-status' | jq -c '.models.baseDirectionRescueV2'
          echo "===BASE_DIRECTION_RESCUE_V2_END==="
          curl -fsS --max-time 20 'https://trade-control-panel-production.up.railway.app/api/round-stats' -o /tmp/round-stats.json
          echo "===RECENT20_DECISIONS_BEGIN==="
          jq -c '[.records[] | select((.productionActual=="UP" or .productionActual=="DOWN") and (.productionPrediction=="UP" or .productionPrediction=="DOWN"))][0:20] | .[] | {roundStartMs,productionSource,productionPrediction,productionActual,productionResult,productionConfidence,productionDelayMs}' /tmp/round-stats.json
          echo "===RECENT20_DECISIONS_END==="
          echo "===RECENT20_BREAKDOWN_BEGIN==="
          jq -c '
            [.records[] | select((.productionActual=="UP" or .productionActual=="DOWN") and (.productionPrediction=="UP" or .productionPrediction=="DOWN"))][0:20]
            | {
                total:length,
                hits:map(select(.productionResult=="HIT"))|length,
                misses:map(select(.productionResult=="MISS"))|length,
                up:{n:map(select(.productionPrediction=="UP"))|length,hits:map(select(.productionPrediction=="UP" and .productionResult=="HIT"))|length},
                down:{n:map(select(.productionPrediction=="DOWN"))|length,hits:map(select(.productionPrediction=="DOWN" and .productionResult=="HIT"))|length},
                bySource:(group_by(.productionSource)|map({source:.[0].productionSource,n:length,hits:map(select(.productionResult=="HIT"))|length,misses:map(select(.productionResult=="MISS"))|length}))
              }' /tmp/round-stats.json
          echo "===RECENT20_BREAKDOWN_END==="
          echo "===RECENT_DIRECTION_AUDIT_BEGIN==="
          jq -c '
            def decided: [.records[] | select((.productionActual=="UP" or .productionActual=="DOWN") and (.productionPrediction=="UP" or .productionPrediction=="DOWN"))];
            def stat(xs):
              {n:(xs|length),hits:(xs|map(select(.productionResult=="HIT"))|length),misses:(xs|map(select(.productionResult=="MISS"))|length),
               accuracy:(if (xs|length)>0 then ((xs|map(select(.productionResult=="HIT"))|length)/(xs|length)) else null end)};
            decided as $d |
            {
              all:{
                up:stat([$d[]|select(.productionPrediction=="UP")]),
                down:stat([$d[]|select(.productionPrediction=="DOWN")])
              },
              recent10:{
                up:stat([($d[0:10])[]|select(.productionPrediction=="UP")]),
                down:stat([($d[0:10])[]|select(.productionPrediction=="DOWN")])
              },
              recent20:{
                up:stat([($d[0:20])[]|select(.productionPrediction=="UP")]),
                down:stat([($d[0:20])[]|select(.productionPrediction=="DOWN")])
              },
              recent50:{
                up:stat([($d[0:50])[]|select(.productionPrediction=="UP")]),
                down:stat([($d[0:50])[]|select(.productionPrediction=="DOWN")])
              },
              bySource:{
                selectiveV2:{
                  up:stat([$d[]|select((.productionSource|tostring|startswith("LOCK_QUALITY_SELECTIVE_V2")) and .productionPrediction=="UP")]),
                  down:stat([$d[]|select((.productionSource|tostring|startswith("LOCK_QUALITY_SELECTIVE_V2")) and .productionPrediction=="DOWN")])
                },
                edgeRescue:{
                  up:stat([$d[]|select(.productionSource=="SELECTIVE_V2_EDGE_RESCUE_PRIMARY" and .productionPrediction=="UP")]),
                  down:stat([$d[]|select(.productionSource=="SELECTIVE_V2_EDGE_RESCUE_PRIMARY" and .productionPrediction=="DOWN")])
                }
              }
            }' /tmp/round-stats.json
          echo "===RECENT_DIRECTION_AUDIT_END==="
          # Read-only alerts; do not modify production gates or issue trading signals.
          echo "===DIRECTION_DRIFT_WATCH_BEGIN==="
          direction_drift=$(jq -c '
            [.records[] | select((.productionPrediction=="UP" or .productionPrediction=="DOWN") and (.productionResult=="HIT" or .productionResult=="MISS"))][0:20] as $recent |
            ["UP","DOWN"] | map(. as $direction |
              [$recent[] | select(.productionPrediction==$direction)] as $rows |
              {direction:$direction,samples:($rows|length),hits:($rows|map(select(.productionResult=="HIT"))|length),
               accuracy:(if ($rows|length)>0 then (($rows|map(select(.productionResult=="HIT"))|length)/($rows|length)) else null end),
               driftAlert:(if ($rows|length)>=8 then ((($rows|map(select(.productionResult=="HIT"))|length)/($rows|length))<0.65) else false end)}
            )' /tmp/round-stats.json)
          echo "$direction_drift"
          if echo "$direction_drift" | jq -e 'any(.[]; .driftAlert == true)' >/dev/null; then
            echo "::warning::Recent directional accuracy under 65% with at least 8 samples; manual review only, trading gates unchanged."
          fi
          echo "===DIRECTION_DRIFT_WATCH_END==="
          echo "===UP_TIGHTEN_REPLAY_BEGIN==="
          jq -c '
            [.records[]
              | select(.productionSource=="LOCK_QUALITY_SELECTIVE_V2_PRIMARY" and .productionPrediction=="UP" and (.productionResult=="HIT" or .productionResult=="MISS"))
              | {r:.productionResult,s:(.lockQualitySelectiveV2.predictionSupport // null),c:(.lockQualitySelectiveV2.currentScoreAbs // null),d:(.productionDelayMs // .lockQualitySelectiveV2.lockDelayMs // null)}
            ] as $u |
            def stat($xs): {n:($xs|length),hits:($xs|map(select(.r=="HIT"))|length),accuracy:(if ($xs|length)>0 then (($xs|map(select(.r=="HIT"))|length)/($xs|length)) else null end)};
            {
              base:stat($u),
              s15_c65_d20:stat([$u[]|select(.s!=null and .c!=null and .d!=null and .s>=0.15 and .c>=0.65 and .d<20000)]),
              s16_c67_d19:stat([$u[]|select(.s!=null and .c!=null and .d!=null and .s>=0.16 and .c>=0.67 and .d<19000)]),
              s18_c70_d18:stat([$u[]|select(.s!=null and .c!=null and .d!=null and .s>=0.18 and .c>=0.70 and .d<18000)]),
              s18_c65_d18:stat([$u[]|select(.s!=null and .c!=null and .d!=null and .s>=0.18 and .c>=0.65 and .d<18000)]),
              rows:$u
            }' /tmp/round-stats.json
          echo "===UP_TIGHTEN_REPLAY_END==="

          echo "===UP_SHADOW_CANDIDATES_BEGIN==="
          jq -c '
            [.records[] | select(.productionSource=="LOCK_QUALITY_SELECTIVE_V2_PRIMARY" and .productionPrediction=="UP" and (.productionResult=="HIT" or .productionResult=="MISS"))] as $u |
            def metric($xs): {n:($xs|length),hits:($xs|map(select(.productionResult=="HIT"))|length),misses:($xs|map(select(.productionResult=="MISS"))|length),accuracy:(if ($xs|length)>0 then (($xs|map(select(.productionResult=="HIT"))|length)/($xs|length)) else null end)};
            def pass($s;$c;$d): [.[] | select((.lockQualitySelectiveV2.predictionSupport // -1)>=$s and (.lockQualitySelectiveV2.currentScoreAbs // -1)>=$c and (.productionDelayMs // 999999)<$d)];
            {baseline:metric($u),candidateA:metric($u|pass(0.15;0.65;20000)),candidateB:metric($u|pass(0.16;0.67;19000)),note:"Retrospective audit only; not strict-forward evidence or promotion authorization"}
          ' /tmp/round-stats.json
          echo "===UP_SHADOW_CANDIDATES_END==="
          # Cross-service canary: query frozen V2 round/topic IDs from settled history.
          # This confirms propagation only; it is NOT independent exchange verification.
          echo "===V3_PROVENANCE_CANARY_BEGIN==="
          observed_resolved=0
          while IFS=$'\t' read -r target_round topic_id archived_sha archived_direction; do
            if [[ -z "$target_round" || -z "$topic_id" || "$topic_id" == "null" ]]; then
              continue
            fi
            if ! curl -fsS --retry 0 --max-time 7 --get \
              --data-urlencode "round=$target_round" \
              --data-urlencode "marketTopicId=$topic_id" \
              'https://signal-diagnostic-v3-production.up.railway.app/api/prediction-resolution' \
              -o /tmp/v3-provenance-canary.json; then
              echo "::warning::V3 resolution probe failed for round $target_round"
              continue
            fi
            if ! jq -e '.ok == true and .resolved == true' /tmp/v3-provenance-canary.json >/dev/null; then
              continue
            fi
            observed_resolved=1
            if ! jq -e '
              . as $r |
              (($r.direction=="UP") or ($r.direction=="DOWN")) and
              ($r.marketTopicId != null) and
              ($r.auditEvidence | type=="object") and
              ($r.auditEvidence.evidenceSchemaVersion==1) and
              ($r.auditEvidence.sourceEndpoint=="/sapi/v1/w3w/wallet/prediction/market/detail") and
              ($r.auditEvidence.marketTopicId==$r.marketTopicId) and
              ($r.auditEvidence.detailPayloadSha256 | type=="string" and test("^[0-9a-f]{64}$")) and
              ($r.auditEvidence.observedAt | type=="string")
            ' /tmp/v3-provenance-canary.json >/dev/null; then
              echo "::error::Resolved V3 round $target_round lacks valid official settlement provenance."
              exit 1
            fi
            received_topic=$(jq -r '.auditEvidence.marketTopicId' /tmp/v3-provenance-canary.json)
            if [[ "$received_topic" != "$topic_id" ]]; then
              echo "::error::V3 settlement topic mismatch for round $target_round: V2=$topic_id V3=$received_topic."
              exit 1
            fi
            received_direction=$(jq -r '.direction' /tmp/v3-provenance-canary.json)
            if [[ "$received_direction" != "$archived_direction" ]]; then
              echo "::error::Frozen V2 vs independently re-fetched V3 direction mismatch at round $target_round: V2=$archived_direction V3=$received_direction."
              exit 1
            fi
            current_sha=$(jq -r '.auditEvidence.detailPayloadSha256' /tmp/v3-provenance-canary.json)
            if [[ "$current_sha" != "$archived_sha" ]]; then
              echo "::warning::V3 market payload differs from archived V2 hash for round $target_round; review immutable settlement source."
            fi
            jq -c '{round:'"$target_round"',direction,marketTopicId,
              auditEvidence:{evidenceSchemaVersion:.auditEvidence.evidenceSchemaVersion,
              detailPayloadSha256:.auditEvidence.detailPayloadSha256,observedAt:.auditEvidence.observedAt},
              independentVerified:false}' /tmp/v3-provenance-canary.json
            break
          done < <(jq -r '
            [.records[] |
              select((.productionActual=="UP" or .productionActual=="DOWN") and
              .officialSettlementAudit != null and
              .officialSettlementAudit.marketTopicId != null and
              (.roundStartMs|type=="number"))] |
            sort_by(.roundStartMs) | reverse | .[0:4][] |
            [.roundStartMs,.officialSettlementAudit.marketTopicId,.officialSettlementAudit.detailPayloadSha256,.productionActual] | @tsv
          ' /tmp/round-stats.json)
          if (( observed_resolved == 0 )); then
            echo "::warning::No post-upgrade resolved topic observed in the cross-service canary; cannot claim live provenance verification."
          fi
          echo "===V3_PROVENANCE_CANARY_END==="
