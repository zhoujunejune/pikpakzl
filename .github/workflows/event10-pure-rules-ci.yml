name: EVENT10 pure-rule isolated tests (never deploy)
on:
  push:
    branches: [feature/zl-futures-bot-v1]
    paths:
      - "event10-bot/pure-signal.mjs"
      - "event10-bot/pure-signal.test.mjs"
      - "event10-bot/manual-engine.mjs"
      - "event10-bot/panel.html"
      - ".github/workflows/event10-pure-rules-ci.yml"
permissions:
  contents: read
jobs:
  pure-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Syntax, five mandatory gates and NO_SIGNAL
        run: |
          node --check event10-bot/pure-signal.mjs
          node --check event10-bot/manual-engine.mjs
          node --check event10-bot/server.mjs
          node --test event10-bot/pure-signal.test.mjs
      - name: Ensure no event-contract trading calls or AI in signal path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('event10-bot/manual-engine.mjs').read_text()
          rule=Path('event10-bot/pure-signal.mjs').read_text()
          for forbidden in ['DEEPSEEK_API_KEY','DEEPSEEK_API_URL','/fapi/v1/order',
                            '/api/v3/order','/papi/v1/order']:
            assert forbidden not in s+rule,forbidden
          assert 'if(!rule.direction)return lastCheck' in s
          assert 'nowMs-cycle<180000' in s
          assert 'autoTradingEnabled:false' in s
          assert 'const all=x=>Object.values(x).every(v=>v===true)' in rule
          print('EVENT10_PURE_SIGNAL_NO_AI_OR_TRADE_GATE=true')
          PY
