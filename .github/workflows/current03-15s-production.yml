name: Option B 15s backup production safety
on:
  pull_request:
    paths:
      - "round-tracker/current03-pm-agree-production.mjs"
      - "round-tracker/pm-current25-support08-production.mjs"
      - "round-tracker/pm-current25-support08-production.test.mjs"
      - "round-tracker/unified-15s-candidate-router.mjs"
      - "round-tracker/unified-15s-candidate-router.test.mjs"
      - "round-tracker/last-resort-15s-backups.mjs"
      - "round-tracker/last-resort-15s-backups.test.mjs"
      - "round-tracker/current03-pm-agree-production.test.mjs"
      - "round-tracker/index-rest.mjs"
      - "round-tracker/edge-rescue-timed-fuse.mjs"
      - ".github/workflows/current03-15s-production.yml"
  push:
    branches: [main]
    paths:
      - "round-tracker/current03-pm-agree-production.mjs"
      - "round-tracker/pm-current25-support08-production.mjs"
      - "round-tracker/pm-current25-support08-production.test.mjs"
      - "round-tracker/unified-15s-candidate-router.mjs"
      - "round-tracker/unified-15s-candidate-router.test.mjs"
      - "round-tracker/last-resort-15s-backups.mjs"
      - "round-tracker/last-resort-15s-backups.test.mjs"
      - "round-tracker/current03-pm-agree-production.test.mjs"
      - "round-tracker/index-rest.mjs"
      - "round-tracker/edge-rescue-timed-fuse.mjs"
      - ".github/workflows/current03-15s-production.yml"
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: |
          node --check round-tracker/index-rest.mjs
          node --check round-tracker/current03-pm-agree-production.mjs
          node --check round-tracker/pm-current25-support08-production.mjs
          node --check round-tracker/unified-15s-candidate-router.mjs
          node --check round-tracker/last-resort-15s-backups.mjs
      - name: Frozen 15s direction and circuit tests
        run: |
          node --test round-tracker/current03-pm-agree-production.test.mjs round-tracker/pm-current25-support08-production.test.mjs round-tracker/unified-15s-candidate-router.test.mjs round-tracker/last-resort-15s-backups.test.mjs round-tracker/v3-no-base-15s-audit.test.mjs round-tracker/edge-rescue-timed-fuse.test.mjs
      - name: Verify exact-model live route and immutability
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const source=fs.readFileSync("round-tracker/index-rest.mjs","utf8");
            const code=source.slice(source.indexOf("function productionSignalPayload("));
            assert(code.includes("selectLastResort15sBackups(row, now)"));
            assert(code.includes("lastResort15sFuses[chosen.id]"));
            assert(code.includes("current03PmAgreeProductionFuseSummary(rounds, chosen.source)"));
            assert(code.includes("fuse.recordLock(chosen.direction,row.roundStartMs)"));
            assert(code.includes("selectCurrent03PmAgree15s(row, now)"));
            assert(code.includes("selectPmCurrent25Support0815s(row, now)"));
            assert(code.indexOf("selectPmCurrent25Support0815s(row, now)") < code.indexOf("evaluateSelectiveQualityV2(baseDirection"));
            assert(code.indexOf("selectCurrent03PmAgree15s(row, now)") < code.indexOf("evaluateSelectiveQualityV2(baseDirection"));
            assert(code.indexOf("selectiveV2EdgeRescueFuseState(baseDirection)") < code.indexOf("selectLastResort15sBackups(row, now)"));
            assert(code.indexOf("selectLastResort15sBackups(row, now)") < code.indexOf("const reasons = !baseDirection"));
            assert(!code.includes("selectForwardGated15sCandidates(row, forwardStatus, now)"));
            assert(code.indexOf("selectPmCurrent25Support0815s(row, now)") < code.indexOf("selectCurrent03PmAgree15s(row, now)"));
            assert(code.includes("PM_CURRENT25_SUPPORT08_SOURCE"));
            assert(code.includes("timedPmCurrent25Fuse.check("));
            assert(code.includes("CURRENT03_PM_AGREE_SOURCE"));
            assert(code.indexOf("selectCurrent03PmAgree15s(row, now)") < code.indexOf("evaluateSelectiveQualityV2(baseDirection"));
            assert(code.includes("timedCurrent03PmFuse.check("));
            assert(code.includes("freezeProductionLock(row, live)"));
            assert(code.includes("selectiveV2EdgeRescueFuseState(baseDirection)"));
            assert(!code.includes("selectVerifiedNoBase15s("));
          '
