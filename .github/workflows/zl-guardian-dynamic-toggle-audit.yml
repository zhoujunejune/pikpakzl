name: GUARDIAN dynamic risk switch production read-only code inventory
on:
  push:
    branches: [feature/guardian-dynamic-risk-ui-toggle]
    paths:
      - prediction-bot-v1/aliyun_guardian_toggle_audit.py
      - .github/workflows/zl-guardian-dynamic-toggle-audit.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m py_compile prediction-bot-v1/aliyun_guardian_toggle_audit.py
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Inspect live files and risk status without mutation
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python prediction-bot-v1/aliyun_guardian_toggle_audit.py
