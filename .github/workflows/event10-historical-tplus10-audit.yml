name: EVENT10 historical full-T+600s read-only recalculation
on:
  push:
    branches: [feature/zl-futures-bot-v1]
    paths: ['.github/workflows/event10-historical-tplus10-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: event10-historical-tplus10-readonly
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Recalculate legacy signal outcomes from read-only local files and public Binance index bars
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          python - <<'PY'
          import base64,os,re,time
          from alibabacloud_swas_open20200601.client import Client
          from alibabacloud_swas_open20200601 import models as sw
          from alibabacloud_tea_openapi import models as api
          sha=os.environ['GITHUB_SHA']
          if os.environ['GITHUB_REF_NAME']!='feature/zl-futures-bot-v1' or not re.fullmatch(r'[a-f0-9]{40}',sha):
              raise RuntimeError('INVALID_SOURCE_REVISION')
          ak=os.getenv('ALIBABA_CLOUD_ACCESS_KEY_ID');sk=os.getenv('ALIBABA_CLOUD_ACCESS_KEY_SECRET')
          if not ak or not sk:raise RuntimeError('ALIBABA_CREDENTIALS_UNAVAILABLE')
          script=f"""#!/bin/bash
          set -Eeuo pipefail
          temp=$(mktemp -d /tmp/zl-event10-readonly-audit.XXXXXXXX)
          trap 'rm -rf "$temp"' EXIT
          curl -fsSL --retry 2 --max-time 30 'https://raw.githubusercontent.com/zhoujunejune/pikpakzl/{sha}/event10-bot/readonly_old_10min_recalc.py' -o "$temp/audit.py"
          python3 -m py_compile "$temp/audit.py"
          python3 "$temp/audit.py"
          """
          client=Client(api.Config(access_key_id=ak,access_key_secret=sk,
             region_id='ap-southeast-1',endpoint='swas.ap-southeast-1.aliyuncs.com'))
          instance='b67374069bb3457ba6a3a2ede9305d3f'
          call=client.run_command(sw.RunCommandRequest(region_id='ap-southeast-1',
             instance_id=instance,name='event10-historical-read-only-tplus600',
             type='RunShellScript',working_user='root',command_content=script,timeout=260))
          invocation=call.body.invoke_id
          if not invocation:raise RuntimeError('NO_RUN_COMMAND_INVOCATION')
          done=False
          for _ in range(150):
              time.sleep(2)
              result=client.describe_invocation_result(sw.DescribeInvocationResultRequest(
                region_id='ap-southeast-1',instance_id=instance,invoke_id=invocation)).body.invocation_result
              if not result or str(result.invocation_status) not in (
                 'Success','Failed','Aborted','ExecutionTimeout','ExitCodeNonzero',
                 'ClientNotRunning','InstanceNotRunning'):continue
              output=base64.b64decode(result.output or '').decode('utf8','replace')
              for line in output.splitlines():
                  if line.startswith('EVENT10_RECALC_AGGREGATE=') or line.startswith('INDEX_HISTORY_FETCH_ERROR='):
                      print(line,flush=True)
              if str(result.invocation_status)!='Success' or int(result.exit_code)!=0:
                  raise RuntimeError('READONLY_RECALC_FAILED_'+str(result.invocation_status)+'_'+output[-700:])
              if 'EVENT10_RECALC_AGGREGATE=' not in output:
                  raise RuntimeError('MISSING_RECALC_AGGREGATE')
              done=True
              break
          if not done:raise RuntimeError('READONLY_RECALC_TIMEOUT')
          PY
