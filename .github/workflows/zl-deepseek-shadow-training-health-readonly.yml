name: Independent DeepSeek shadow learner status (read-only)
on:
  push:
    branches: [feat/deepseek-decision-audit-20261021]
    paths: [.github/workflows/zl-deepseek-shadow-training-health-readonly.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shadow-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install existing Alibaba lightweight server client
        run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Query existing LOCAL shadow service over loopback GET only
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          python - <<'PY'
          import os,base64,time,json
          from alibabacloud_swas_open20200601.client import Client
          from alibabacloud_swas_open20200601 import models as sw
          from alibabacloud_tea_openapi import models as api
          script="""#!/bin/bash
          set -eu
          python3 - <<'INNER'
          import json,urllib.request,subprocess
          state=subprocess.run(['systemctl','is-active','zl-deepseek-shadow-online.service'],capture_output=True,text=True,timeout=5).stdout.strip()
          result={'unit':state}
          try:
              with urllib.request.urlopen('http://127.0.0.1:13041/api/status',timeout=5) as r:
                  status=json.load(r)
              keys=('model','mode','orders','productionModelUnchanged','trainableWeights','settledTrained','observations','unsettled','updatedAt','lastMarketAt','lastOfficialAt','lastError','readyForEvaluation')
              result.update({k:status.get(k) for k in keys})
              result['recent50']=status.get('recent50')
          except Exception as error:
              result['fetchFailureType']=type(error).__name__
          print('SHADOW_READONLY_HEALTH='+json.dumps(result,separators=(',',':')))
          INNER
          """
          client=Client(api.Config(access_key_id=os.environ['ALIBABA_CLOUD_ACCESS_KEY_ID'],
            access_key_secret=os.environ['ALIBABA_CLOUD_ACCESS_KEY_SECRET'],
            region_id='ap-southeast-1',endpoint='swas.ap-southeast-1.aliyuncs.com'))
          inv=client.run_command(sw.RunCommandRequest(region_id='ap-southeast-1',
             instance_id='b67374069bb3457ba6a3a2ede9305d3f',name='zl-shadow-loopback-readonly-health',
             type='RunShellScript',working_user='root',command_content=script,timeout=70)).body.invoke_id
          for _ in range(27):
             time.sleep(2)
             q=client.describe_invocation_result(sw.DescribeInvocationResultRequest(
               region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',
               invoke_id=inv)).body.invocation_result
             if q and str(q.invocation_status) in ('Success','Failed','Aborted','ExecutionTimeout','ExitCodeNonzero'):
                s=base64.b64decode(q.output or '',validate=True).decode('utf8','replace')
                for line in s.splitlines():
                   if line.startswith('SHADOW_READONLY_HEALTH='): print(line)
                if int(q.exit_code)!=0:raise RuntimeError('SHADOW_READONLY_REMOTE_FAILED')
                break
          else:raise RuntimeError('SHADOW_READONLY_TIMEOUT')
          PY
