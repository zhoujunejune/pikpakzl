name: Breakout20 shadow dashboard read-only checks
on:
  push:
    branches:
      - feat/breakout20-shadow-dashboard-20261015
  pull_request:
    paths:
      - railway-diagnostic/panel-stats-shell.mjs
      - railway-diagnostic/shadow-breakout20-dashboard.mjs
      - railway-diagnostic/shadow-breakout20-dashboard.test.mjs
      - railway-diagnostic/novice-mix-core.mjs
      - railway-diagnostic/novice-mix-core.test.mjs
      - railway-diagnostic/novice-mix-shadow.mjs
      - .github/workflows/breakout20-shadow-dashboard-checks.yml
permissions:
  contents: read
jobs:
  test-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check panel module syntax
        run: |
          node --check railway-diagnostic/panel-stats-shell.mjs
          node --check railway-diagnostic/shadow-breakout20-dashboard.mjs
          node --check railway-diagnostic/shadow-breakout20-dashboard.test.mjs
          node --check railway-diagnostic/novice-mix-core.mjs
          node --check railway-diagnostic/novice-mix-shadow.mjs
          node --check railway-diagnostic/novice-mix-core.test.mjs
      - name: Test shadow panel read-only isolation
        run: node --test railway-diagnostic/shadow-breakout20-dashboard.test.mjs railway-diagnostic/novice-mix-core.test.mjs
