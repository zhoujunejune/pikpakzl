name: EVENT10 V7 research-only tests
on:
  push:
    branches: [feature/event10-v7-research]
    paths:
      - "event10-bot/v7-reversal-review.mjs"
      - "event10-bot/v7-reversal-review.test.mjs"
      - "event10-bot/V7_RESEARCH_VALIDATION.md"
      - ".github/workflows/event10-v7-research-ci.yml"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  test-only:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: |
          node --check event10-bot/v7-reversal-review.mjs
          node --test event10-bot/v7-reversal-review.test.mjs
          node --test event10-bot/selective-trend.test.mjs
          echo 'EVENT10_V7_RESEARCH_ONLY_TEST_OK=true'
