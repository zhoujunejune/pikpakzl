name: Test training-free quantitative second opinion with DeepSeek (offline only)
on:
  push:
    branches: [feat/deepseek40-45s-ai-only-prod-20261025]
    paths: [.github/workflows/zl-quant-companion-offline-validation.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify new second opinion and unchanged causal DeepSeek 40-second gates
        run: |
          node --check prediction-bot-v1/zero-train-quant-companion.mjs
          node --check prediction-bot-v1/deepseek-adaptive15-runner.mjs
          node --check prediction-bot-v1/deepseek-adaptive15-core.mjs
          node --check prediction-bot-v1/deepseek-adaptive15-production-adapter.mjs
          node --test prediction-bot-v1/zero-train-quant-companion.test.mjs prediction-bot-v1/deepseek-ai-only40.test.mjs prediction-bot-v1/official-prediction-reference.test.mjs
