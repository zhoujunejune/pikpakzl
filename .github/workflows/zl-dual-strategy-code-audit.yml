name: Dual bot code and runtime read-only inspection
on:
  push:
    branches: [feature/zl-futures-bot-v1]
    paths: ['.github/workflows/zl-dual-strategy-code-audit.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Inspect dual files and safe code context only
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          python - <<'PY'
          import base64,os,time
          from alibabacloud_swas_open20200601.client import Client
          from alibabacloud_swas_open20200601 import models as sw
          from alibabacloud_tea_openapi import models as api
          script=r"""#!/bin/bash
set -Eeuo pipefail
python3 - <<'SCAN'
from pathlib import Path
import re,json,urllib.request
p=Path('/opt/zl-prediction-dual5/binance_dual5_pairs.mjs')
lines=p.read_text().splitlines()
print('DUAL_LINES',len(lines))
for i,s in enumerate(lines):
 if re.search(r'^(?:async )?function |^(?:const|let) [\w_]+\s*=\s*(?:async\s*)?\([^)]*\)\s*=>|createServer|\.listen\(|url\.pathname|pathname===|pathname ==|/api/dual5-|^setInterval',s):
  if re.search(r'secret|password|api.?key|signature|privateKey|Authorization|process\.env',s,re.I):continue
  print('STRUCT',i+1,s[:130])
for i in list(range(52,91))+list(range(100,142))+list(range(145,174)):
 if 1<=i<=len(lines):
  s=lines[i-1]
  if re.search(r'secret|password|api.?key|signature|privateKey|Authorization|process\.env|walletAddress|walletId',s,re.I):s='[REDACTED]'
  print('CODE',i,s[:165])
for port in (13044,13045,13046,13048):
 try:
  with urllib.request.urlopen('http://127.0.0.1:%d/api/dual5-status'%port,timeout=2) as r:d=json.load(r)
  print('STATUS_PORT',port,{'ok':d.get('ok'),'active':d.get('active'),'blocked':d.get('blocked'),'health':d.get('health'),'round':d.get('round'),'funding':d.get('fundingSource'),'lastOrderPhase':(d.get('lastOrder')or{}).get('phase'),'lastOpportunity':(d.get('lastOpportunity')or{}).get('status')})
 except Exception as e:print('STATUS_PORT_ERR',port,type(e).__name__)
print('DUAL_AUDIT_END')
SCAN"""
          c=Client(api.Config(access_key_id=os.environ['ALIBABA_CLOUD_ACCESS_KEY_ID'],access_key_secret=os.environ['ALIBABA_CLOUD_ACCESS_KEY_SECRET'],endpoint='swas.ap-southeast-1.aliyuncs.com',region_id='ap-southeast-1'))
          r=c.run_command(sw.RunCommandRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',name='zl-dual-code-readonly',type='RunShellScript',command_content=script,working_user='root',timeout=95))
          for _ in range(38):
              time.sleep(2)
              x=c.describe_invocation_result(sw.DescribeInvocationResultRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',invoke_id=r.body.invoke_id)).body.invocation_result
              if x and str(x.invocation_status) in ('Success','Failed','Aborted','ExecutionTimeout','ClientNotRunning'):
                  try:out=base64.b64decode(x.output or '',validate=True).decode('utf8','replace')
                  except:out='NO_OUTPUT'
                  print('REMOTE_STATUS',x.invocation_status,'EXIT',x.exit_code)
                  print(out[-56000:])
                  raise SystemExit(0 if str(x.invocation_status)=='Success' and int(x.exit_code)==0 else 3)
          raise SystemExit('REMOTE_PENDING')
          PY
