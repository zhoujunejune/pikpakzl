name: Postflip reset production read-only verification
on:
  push:
    paths:
      - .github/workflows/postflip-live-readonly-verify.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployed postflip stats without submitting any orders
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const origin='https://trade-control-panel-production.up.railway.app';
          const resetAt=Date.parse('2026-10-17T03:40:00.000Z');
          const models=['BREAKOUT20_RSI_MACD_RANGE_V1','NOVICE_MIX_LOW_V1'];
          let error='';
          for(let attempt=1;attempt<=10;attempt++){
            try{
              for(const model of models){
                const url=origin+'/api/postflip-official-stats?model='+model+'&ts='+Date.now();
                const res=await fetch(url,{signal:AbortSignal.timeout(10000),cache:'no-store'});
                const j=await res.json();
                assert.equal(res.status,200,model+' HTTP '+res.status+' '+JSON.stringify(j).slice(0,300));
                assert.equal(j.ok,true);
                assert.equal(j.model,model);
                assert.equal(j.resetAt,resetAt);
                assert.equal(j.statsScope,'POSTFLIP_EMITTED_SIGNAL_ONLY');
                assert.equal(j.statsVersion,'POSTFLIP_OUTPUT_OFFICIAL_V1_20261017');
                assert.equal(j.health?.storage,'REDIS_SEPARATE_REPORTING_KEY');
                assert.ok(Array.isArray(j.recent));
                assert.ok(j.recent.every(x=>x.round>=resetAt));
                assert.ok(j.recent.every(x=>x.direction===x.emitted));
                assert.ok(j.results?.overall?.samples>=0);
                assert.ok(j.results?.overall?.hits<=j.results?.overall?.samples);
                console.log(JSON.stringify({model,settled:j.results.overall,rounds:j.results.rounds,
                  latest:j.latest,storage:j.health.storage}));
              }
              const html=await (await fetch(origin+'/',{signal:AbortSignal.timeout(10000)})).text();
              assert.ok(html.includes('id="activeFast8EmittedDirection"'));
              assert.ok(html.includes('/api/postflip-official-stats'));
              console.log('PASS POSTFLIP LIVE READONLY: no order endpoints called');
              process.exit(0);
            }catch(e){
              error=String(e?.message||e);
              console.log('attempt '+attempt+' pending: '+error);
              await new Promise(r=>setTimeout(r,7000));
            }
          }
          throw Error('POSTFLIP_READONLY_VERIFY_FAILED: '+error);
          NODE
