name: Alibaba single-only retirement read-only inventory
on:
  push:
    branches: [feature/zl-futures-bot-v1]
    paths:
      - '.github/workflows/zl-aliyun-single-only-audit.yml'
      - 'prediction-bot-v1/aliyun_single_only_audit.py'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: zl-aliyun-single-only-retirement
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m py_compile prediction-bot-v1/aliyun_single_only_audit.py
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Read Alibaba services and routes without mutation
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python prediction-bot-v1/aliyun_single_only_audit.py
