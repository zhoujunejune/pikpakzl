plugins {
    id 'com.android.application'
}
android {
    namespace 'com.zlcontrol.android'
    compileSdk 35
    defaultConfig {
        applicationId 'com.zlcontrol.android'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '1.1.3'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
