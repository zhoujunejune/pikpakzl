name: Alibaba three-menu navigation isolated UI deploy
on:
  push:
    branches: [feature/zl-futures-bot-v1]
    paths:
      - "futures-research-panel/nav_bridge.py"
      - "futures-research-panel/install_nav_bridge.sh"
      - "futures-research-panel/aliyun_nav_deploy.py"
      - "futures-research-panel/test_nav_bridge.py"
      - ".github/workflows/zl-aliyun-three-menu-nav-deploy.yml"
permissions:
  contents: read
concurrency:
  group: zl-three-menu-isolated-ui-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Unit tests and static non-trading audit
        run: |
          bash -n futures-research-panel/install_nav_bridge.sh
          bash -n event10-bot/install_aliyun.sh event10-bot/restore_frontend.sh event10-bot/install_current_routes.sh event10-bot/install_rules_signal.sh
          python - <<'PYDEPLOY'
          from pathlib import Path
          text=Path('event10-bot/install_rules_signal.sh').read_text()
          assert 'for filename in manual-engine.mjs server.mjs pure-signal.mjs panel.html;do' in text
          assert 'curl -fsS --max-time 5 "$base/api/signals?limit=25&offset=0"' in text
          assert 'for f in manual-engine.mjs server.mjs panel.html;do' in text
          assert "<<'PYSIGNALS'" in text and '\\nPYSIGNALS\\n' in text
          PYDEPLOY
          python -m py_compile event10-bot/frontend_nav.py
          node --check event10-bot/server.mjs
          node --test event10-bot/pure-signal.test.mjs event10-bot/panel-state.test.mjs event10-bot/signal-ledger.test.mjs
          python - <<'PYTEST'
          import importlib.util
          spec=importlib.util.spec_from_file_location('event10_nav','event10-bot/frontend_nav.py')
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          original='<html><body><h1>5分钟 API 实盘确认控制台</h1></body></html>'
          actual=mod.decorate(original)
          assert actual.count('id="zl-event10-restored-nav"')==1
          assert 'href="/event10/"' in actual
          assert mod.decorate(actual)==actual
          PYTEST
          python -m py_compile futures-research-panel/nav_bridge.py futures-research-panel/aliyun_nav_deploy.py
          python -m unittest discover -v -s futures-research-panel -p test_nav_bridge.py
          python - <<'PY'
          from pathlib import Path
          s=Path('futures-research-panel/install_nav_bridge.sh').read_text()
          assert 'systemctl restart zl-futures-bot-paper' not in s
          assert 'systemctl restart zl-prediction-trade' not in s
          assert 'systemctl restart zl-futures-shadow-research' not in s
          assert "['systemctl','reload','caddy']" in s
          assert 'basic_auth {' in s
          assert 'zl-frontend-nav-bridge' in s
          PY
      - name: Install preexisting Alibaba SWAS SDK
        run: pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Add third-menu navigation only, no trading process restart
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python futures-research-panel/aliyun_nav_deploy.py
      - name: Verify strict EVENT10 pure-rule signal production without orders
        if: contains(github.event.head_commit.message, '[EVENT10-RULE-SWITCH]')
        env:
          ZL_PANEL_PASSWORD: ${{ secrets.ZL_PANEL_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request,urllib.error
          host='https://prediction.47-237-188-69.sslip.io'
          auth='Basic '+base64.b64encode(('zl:'+os.environ['ZL_PANEL_PASSWORD']).encode()).decode()
          def query(path,authenticated=True):
              headers={'Cache-Control':'no-store'}
              if authenticated:headers['Authorization']=auth
              return urllib.request.urlopen(urllib.request.Request(host+path,headers=headers),timeout=18)
          try:
              query('/event10/',False)
              raise AssertionError('EVENT10_ANONYMOUS_ALLOWED')
          except urllib.error.HTTPError as exc:assert exc.code==401
          with query('/event10/api/status') as r: state=json.load(r)
          assert state['bot']=='EVENT10' and state['ok']
          assert state['providerModel']=='PURE_RULES_V1'
          assert state['decisionReviewVersion']=='EVENT10_PURE_EMA_VOLUME_DEPTH_RSI_V1_20261029'
          assert state['thinkingMode']=='disabled' and state['modelCalls']==0
          assert state['autoSignalEnabled'] is True
          assert state['autoTradingEnabled'] is False and state['executionAvailable'] is False
          assert state['strategyStats']['proxySettled']>=0
          with query('/event10/api/signals?limit=25&offset=0') as r: signals=json.load(r)
          assert signals['ok'] is True
          assert signals['version']=='EVENT10_PURE_EMA_VOLUME_DEPTH_RSI_V1_20261029'
          assert signals['total']==state['strategyStats']['total']
          assert signals['stats']['proxySettled']==state['strategyStats']['proxySettled']
          assert signals['autoTradingEnabled'] is False
          assert len(signals['records'])<=25
          if signals['total']>25:
              with query('/event10/api/signals?limit=25&offset=25') as r: older=json.load(r)
              assert older['ok'] and older['offset']==25 and older['records']
          print('EVENT10_ALL_SIGNAL_HISTORY_PAGE_VERIFIED=true')
          print('EVENT10_ALL_SAVED_SIGNALS='+str(signals['total']))
          with query('/event10/') as r:page=r.read().decode('utf8')
          assert 'BTC 10分钟事件合约 · 纯信号' in page
          assert '立即检测五项条件' in page
          assert 'EVENT10_PURE_EMA_VOLUME_DEPTH_RSI_V1_20261029' in page
          assert 'id="olderSignals"' in page and 'id="newerSignals"' in page
          assert '所有有效信号记录' in page
          with query('/event10/api/history') as r:history=json.load(r)
          assert history['ok'] and isinstance(history['records'],list)
          with query('/') as r:home=r.read().decode('utf8')
          assert '5分钟 API 实盘确认控制台' in home
          assert '十分钟事件合约' in home
          print('EVENT10_PURE_RULES_VERIFIED=true')
          print('EVENT10_FIVE_MINUTE_PANEL_PRESERVED=true')
          print('EVENT10_HISTORY_RECORDS_VISIBLE='+str(len(history['records'])))
          print('EVENT10_LIVE_AUTOTRADING_DISABLED=true')
          PY
      - name: Verify restored EVENT10 route, existing five-minute dashboard, and login
        if: contains(github.event.head_commit.message, '[EVENT10-FRONTEND-RESTORE]')
        env:
          ZL_PANEL_PASSWORD: ${{ secrets.ZL_PANEL_PASSWORD }}
        run: |
          python - <<'PY'
          import os,base64,json,urllib.request,urllib.error
          origin='https://prediction.47-237-188-69.sslip.io'
          token='Basic '+base64.b64encode(('zl:'+os.environ['ZL_PANEL_PASSWORD']).encode()).decode()
          def get(path,authorize):
              headers={'Cache-Control':'no-cache'}
              if authorize:headers['Authorization']=token
              return urllib.request.urlopen(urllib.request.Request(origin+path,headers=headers),timeout=20)
          for path in ('/','/event10/','/event10/api/status'):
              try:
                  get(path,False)
                  raise AssertionError('EVENT10_UNAUTHENTICATED_ACCESS_'+path)
              except urllib.error.HTTPError as exc:
                  assert exc.code==401,(path,exc.code)
          with get('/',True) as r:
              html=r.read().decode('utf8')
              assert r.status==200 and 'zl-event10-restored-nav' in html
              assert '5分钟 API 实盘确认控制台' in html
          with get('/event10/',True) as r:
              html=r.read().decode('utf8')
              assert r.status==200
              for key in ('id="start"','id="quickDirection"','id="quickConfidence"','id="records"'):
                  assert key in html,'EVENT10_PAGE_MISSING_'+key
          with get('/event10/api/status',True) as r: state=json.load(r)
          assert state.get('ok') is True and state.get('bot')=='EVENT10'
          assert state.get('configured') is True
          assert state.get('autoTradingEnabled') is False and state.get('executionAvailable') is False
          with get('/event10/api/history',True) as r: history=json.load(r)
          assert history.get('ok') is True and isinstance(history.get('records'),list)
          print('EVENT10_FRONTEND_AUTHENTICATED_ROUTE_VERIFIED=true')
          print('EVENT10_MANUAL_ANALYSIS_API_READY=true')
          print('EVENT10_HISTORY_RECORDS='+str(len(history['records'])))
          print('EVENT10_PREDICTION_PANEL_STILL_VISIBLE=true')
          print('EVENT10_NO_REAL_ORDERS=true')
          PY
      - name: Check both actual authenticated UIs, three-way navigation and original controls
        if: ${{ !contains(github.event.head_commit.message, '[EVENT10-FRONTEND-RESTORE]') && !contains(github.event.head_commit.message, '[EVENT10-RULE-SWITCH]') }}
        env:
          ZL_PANEL_PASSWORD: ${{ secrets.ZL_PANEL_PASSWORD }}
        run: |
          python - <<'PY'
          import base64,json,os,time,urllib.request,urllib.error
          main='https://47-237-188-69.sslip.io'
          pred='https://prediction.47-237-188-69.sslip.io'
          auth='Basic '+base64.b64encode(('zl:'+os.environ['ZL_PANEL_PASSWORD']).encode()).decode()
          def page(url,authorized=True):
              headers={'Cache-Control':'no-store'}
              if authorized:headers['Authorization']=auth
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=16) as r:
                  return r.status,r.read()
          for url in (main+'/dashboard/',pred+'/'):
              try:
                  page(url,False)
                  raise AssertionError('BASIC_AUTH_MUST_BE_PRESERVED')
              except urllib.error.HTTPError as err:
                  assert err.code==401,('invalid anonymous status',url,err.code)
          a,html=page(main+'/dashboard/?navtest='+str(int(time.time())))
          assert a==200
          assert b'href="/futures-lab/"' in html,'FUTURES_LAB_MENU_MISSING_ON_LIVE_FUTURES_DASHBOARD'
          assert b'href="/prediction/"' in html
          assert b'href="/api-keys/"' in html
          print('NAV_FUTURES_REAL_PAGE_HAS_THIRD_MENU=true')
          a,html=page(pred+'/?navtest='+str(int(time.time())))
          assert a==200
          assert (main+'/futures-lab/').encode() in html
          assert (main+'/dashboard/').encode() in html
          assert '开始跟随'.encode() in html
          print('NAV_PREDICTION_REAL_PAGE_HAS_THIRD_MENU=true')
          a,html=page(main+'/futures-lab/')
          assert a==200 and b'forwardStatus' in html
          assert b'href="/dashboard/"' in html and b'href="/prediction/"' in html
          print('NAV_SHADOW_PAGE_HAS_RETURN_LINKS=true')
          status=json.loads(page(main+'/status')[1])
          assert status.get('mode')=='live'
          print('NAV_FUTURES_ENGINE_MODE_UNCHANGED=true')
          stats=json.loads(page(main+'/futures-lab/live.json?t='+str(int(time.time()*1000)))[1])
          assert stats.get('realOrders') is False and len(stats.get('streams',[]))==9
          print('NAV_SHADOW_9_PAPER_ACCOUNTS_UNCHANGED=true')
          print('NAV_NO_REAL_ORDERS_SUBMITTED=true')
          PY
