name: Analyze whether 35 percent stop losses prematurely exit winning prediction rounds (read-only)
on:
  push:
    branches: [audit/stop35-reversal-20261025]
    paths:
      - .github/workflows/zl-stop35-reversal.yml
      - prediction-bot-v1/stop35_reversal_readonly_20261025.py
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Validate read-only inspection
        run: |
          python - <<'PY'
          import ast,subprocess
          from pathlib import Path
          tree=ast.parse(Path('prediction-bot-v1/stop35_reversal_readonly_20261025.py').read_text())
          remote=next(n.value.value for n in tree.body if isinstance(n,ast.Assign)
            for t in n.targets if isinstance(t,ast.Name) and t.id=='REMOTE')
          assert subprocess.run(['bash','-n'],input=remote,text=True,capture_output=True).returncode==0
          assert 'systemctl restart' not in remote and 'place-order-bundle' not in remote
          inner=remote.split("python3 - <<'PY'",1)[1].split('\nPY',1)[0]
          compile(inner,'stop35 audit','exec')
          print('STOP35_READONLY_SCRIPT_VALID=true')
          PY
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Inspect historical stopped positions and original round direction
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python prediction-bot-v1/stop35_reversal_readonly_20261025.py
