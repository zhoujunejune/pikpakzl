name: DeepSeek production code fingerprint read-only
on:
  push:
    branches: [feat/deepseek-decision-audit-20261021]
    paths: [.github/workflows/zl-deepseek-production-code-fingerprint.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Compare branch source with active Alibaba engine using hashes only
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          python -m pip install -q alibabacloud_swas_open20200601==4.0.0
          python - <<'PY'
          import os,time,base64,subprocess
          from alibabacloud_swas_open20200601.client import Client
          from alibabacloud_swas_open20200601 import models as sw
          from alibabacloud_tea_openapi import models as api
          root='/opt/zl-prediction-live/deepseek5/'
          shell='set -eu; for name in deepseek-5m-engine.mjs deepseek-5m-learner.mjs deepseek-5m-features.mjs; do p='+root+'"$name"; if [ -f "$p" ]; then sha256sum "$p"; else echo MISSING "$name"; fi; done'
          cli=Client(api.Config(access_key_id=os.environ['ALIBABA_CLOUD_ACCESS_KEY_ID'],access_key_secret=os.environ['ALIBABA_CLOUD_ACCESS_KEY_SECRET'],region_id='ap-southeast-1',endpoint='swas.ap-southeast-1.aliyuncs.com'))
          inv=cli.run_command(sw.RunCommandRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',name='zl-deepseek-readonly-fingerprint',type='RunShellScript',working_user='root',command_content=shell,timeout=50)).body.invoke_id
          for i in range(24):
            time.sleep(2)
            result=cli.describe_invocation_result(sw.DescribeInvocationResultRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',invoke_id=inv)).body.invocation_result
            if result and str(result.invocation_status) in ('Success','Failed','Aborted','ExecutionTimeout','ExitCodeNonzero'):
              out=base64.b64decode(result.output or '',validate=True).decode('utf8','replace')
              print('REMOTE_SHA256_BEGIN')
              print(out[:2000])
              print('REMOTE_SHA256_END')
              if int(result.exit_code)!=0:raise SystemExit('REMOTE_FINGERPRINT_FAILED')
              break
          else:raise SystemExit('REMOTE_FINGERPRINT_TIMEOUT')
          for name in ('deepseek-5m-engine.mjs','deepseek-5m-learner.mjs','deepseek-5m-features.mjs'):
            local=subprocess.check_output(['sha256sum','prediction-bot-v1/'+name],text=True).strip()
            print('BRANCH_SHA256',local)
          PY
