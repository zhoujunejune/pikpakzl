name: Aliyun actual-route navigation probe readonly
on:
  push:
    branches: [feature/zl-futures-bot-v1]
    paths: ['.github/workflows/zl-aliyun-three-menu-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Read Caddy route patterns and source frontend HTTP only
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          python3 - <<'PY'
          import os,time,base64
          from alibabacloud_swas_open20200601.client import Client
          from alibabacloud_swas_open20200601 import models as m
          from alibabacloud_tea_openapi import models as a
          client=Client(a.Config(access_key_id=os.environ['ALIBABA_CLOUD_ACCESS_KEY_ID'],access_key_secret=os.environ['ALIBABA_CLOUD_ACCESS_KEY_SECRET'],region_id='ap-southeast-1',endpoint='swas.ap-southeast-1.aliyuncs.com'))
          sh="""#!/bin/bash
          set -eu
          python3 - <<'SUB'
          from pathlib import Path
          p=Path('/etc/caddy/Caddyfile')
          lines=p.read_text().splitlines()
          for i,line in enumerate(lines):
            v=line.strip()
            if any(s in v for s in ('sslip.io {','handle /','handle_path /','reverse_proxy','redir /prediction','redir https','file_server','basic_auth {')):
              print('ROUTE',i+1,v[:160])
          SUB
          for port in 10000 13001 11000;do
            for path in / /dashboard/;do
              code=$(curl -sS --max-time 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:$port$path || true)
              echo "LOCAL_SOURCE port=$port path=$path status=$code"
            done
          done
          systemctl show zl-futures-bot-paper.service -p MainPID --value | sed 's/^/PROD_FUTURES_PID /'
          systemctl show zl-prediction-trade.service -p MainPID --value | sed 's/^/PROD_PRED_PID /'
          """
          r=client.run_command(m.RunCommandRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',name='zl-navigation-readonly-probe',type='RunShellScript',command_content=sh,working_user='root',timeout=95))
          invoke=r.body.invoke_id
          for _ in range(35):
            time.sleep(3)
            t=client.describe_invocation_result(m.DescribeInvocationResultRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',invoke_id=invoke)).body.invocation_result
            if t and str(t.invocation_status) in ('Success','Failed','Aborted','ExecutionTimeout','ExitCodeNonzero'):
              raw=t.output or ''
              try:raw=base64.b64decode(raw,validate=True).decode('utf8','replace')
              except Exception:pass
              print('NAV_PROBE_STATUS',t.invocation_status,'EXIT',t.exit_code)
              print(raw[-4500:])
              raise SystemExit(0 if str(t.invocation_status)=='Success' and int(t.exit_code)==0 else 1)
          raise SystemExit('No Cloud Assistant probe result')
          PY
