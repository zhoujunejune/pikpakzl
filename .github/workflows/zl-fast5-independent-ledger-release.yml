name: Deploy independent FAST5 winrate ledger and official settlement stats
on:
  push:
    branches: [feat/deepseek40-45s-ai-only-prod-20261025]
    paths: [.github/workflows/zl-fast5-independent-ledger-release.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: zl-alibaba-prediction-singlehost
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate durable ledger, official-only joining, UI and deployment
        run: |
          python -m py_compile prediction-bot-v1/fast5_independent_stats_service.py prediction-bot-v1/aliyun_fast5_independent_stats_deploy.py
          python prediction-bot-v1/fast5_independent_stats_service_test.py
          node --check prediction-bot-v1/fast5-dashboard-inject.mjs
          node --test prediction-bot-v1/fast5-dashboard-inject.test.mjs
  deploy:
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Run guarded journal and statistics UI release via existing Alibaba Cloud Assistant
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          python - <<'OUTER'
          import os,base64,time
          from alibabacloud_swas_open20200601.client import Client
          from alibabacloud_swas_open20200601 import models as sw
          from alibabacloud_tea_openapi import models as api
          sha=os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_REF_NAME']=='feat/deepseek40-45s-ai-only-prod-20261025'
          script="""#!/bin/bash
          set -Eeuo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL --retry 2 --max-time 35 "https://raw.githubusercontent.com/zhoujunejune/pikpakzl/COMMIT_SHA/prediction-bot-v1/aliyun_fast5_independent_stats_deploy.py" -o "$tmp/deploy.py"
          python3 -m py_compile "$tmp/deploy.py"
          python3 "$tmp/deploy.py" COMMIT_SHA
          """.replace('COMMIT_SHA',sha)
          cli=Client(api.Config(access_key_id=os.environ['ALIBABA_CLOUD_ACCESS_KEY_ID'],access_key_secret=os.environ['ALIBABA_CLOUD_ACCESS_KEY_SECRET'],region_id='ap-southeast-1',endpoint='swas.ap-southeast-1.aliyuncs.com'))
          inv=cli.run_command(sw.RunCommandRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',name='zl-fast5-independent-winrate-ledger-deploy',type='RunShellScript',working_user='root',command_content=script,timeout=260)).body.invoke_id
          for _ in range(128):
           time.sleep(2)
           r=cli.describe_invocation_result(sw.DescribeInvocationResultRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',invoke_id=inv)).body.invocation_result
           if r and str(r.invocation_status) in ('Success','Failed','Aborted','ExecutionTimeout','ExitCodeNonzero'):
            print('FAST5_LEDGER_CLOUD_STATUS',r.invocation_status,'EXIT',r.exit_code)
            try:print(base64.b64decode(r.output or '',validate=True).decode('utf8','replace')[-18000:])
            except Exception:print('REMOTE_OUTPUT_UNAVAILABLE')
            if r.invocation_status!='Success' or int(r.exit_code)!=0:raise RuntimeError('FAST5_LEDGER_RELEASE_FAILED')
            break
          else:raise RuntimeError('FAST5_LEDGER_RELEASE_TIMEOUT')
          OUTER
  verify:
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Confirm authenticated public statistics backend and safe trade state
        env:
          ZL_PANEL_PASSWORD: ${{ secrets.ZL_PANEL_PASSWORD }}
        run: |
          python - <<'PY'
          import urllib.request,base64,os,json
          base='https://prediction.47-237-188-69.sslip.io'
          auth='Basic '+base64.b64encode(('zl:'+os.environ['ZL_PANEL_PASSWORD']).encode()).decode()
          def get(url):
           with urllib.request.urlopen(urllib.request.Request(base+url,headers={'Authorization':auth,'Cache-Control':'no-store'}),timeout=17) as r:
            return r.status,r.read(2000000)
          status,raw=get('/api/fast5-round-stats')
          d=json.loads(raw)
          assert status==200 and d.get('schema')=='FAST5_INDEPENDENT_OFFICIAL_ROUND_LEDGER_V1'
          assert d.get('model')=='FAST5_SPOT_MOMENTUM_V1' and d.get('persisted') is True
          assert isinstance(d.get('rows'),list) and isinstance(d.get('summary'),dict)
          assert d.get('health',{}).get('signalError') is None
          status,raw=get('/api/status')
          trade=json.loads(raw)
          assert status==200 and trade.get('enabled') is False and trade.get('orderSignalModel')=='FAST5_SPOT_MOMENTUM_V1'
          status,raw=get('/api/fast5-live-status')
          sig=json.loads(raw)
          assert sig.get('strategyVersion')=='FAST5_PREWARM120_5S_V4'
          status,raw=get('/')
          ui=raw.decode('utf8','replace')
          assert 'FAST5逐轮信号与官方结算' in ui
          assert '/api/fast5-round-stats' in ui
          assert 'id="zlF5OfficialRows"' in ui
          print('FAST5_LEDGER_PUBLIC_API_OK=true')
          print('FAST5_LEDGER_PUBLIC_PANEL_OK=true')
          print('FAST5_LEDGER_SOURCE_MODEL_SEPARATED=true')
          print('FAST5_LEDGER_AUTO_FOLLOW_UNCHANGED_OFF=true')
          print('FAST5_LEDGER_VERIFIED_SUMMARY',json.dumps(d['summary']))
          PY
