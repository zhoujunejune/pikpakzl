name: Deploy DeepSeek-only 15s to Alibaba production guarded
on:
  push:
    branches: [fix/deepseek15-ai-only-prod-20261022]
    paths:
      - .github/workflows/zl-deepseek15-ai-only-production.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: zl-alibaba-prediction-singlehost
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test prediction-bot-v1/deepseek-only15.test.mjs
      - run: node --check prediction-bot-v1/deepseek-single5-production.mjs
      - run: node --check railway-diagnostic/wrapper.mjs
      - name: Validate production shell and Python deploy safety
        run: |
          python - <<'PY'
          import ast,subprocess,pathlib
          p=pathlib.Path('prediction-bot-v1/deepseek15_ai_only_guarded_release.py')
          source=p.read_text();mod=ast.parse(source)
          remote=next(n.value.value for n in mod.body if isinstance(n,ast.Assign) and any(
            isinstance(z,ast.Name) and z.id=='REMOTE' for z in n.targets))
          r=subprocess.run(['bash','-n'],input=remote,text=True,capture_output=True)
          assert r.returncode==0,r.stderr
          assert 'FOLLOW_ACTIVE_ABORT_WITHOUT_TOUCHING_PRODUCTION' in remote
          assert 'AI15_RELEASE_ROLLBACK_TRIGGERED' in remote
          assert 'DEEPSEEK15_ORDER_SUBMIT_DEADLINE_MS = 30000' in remote
          assert 'cp -p "$backup/original-deepseek-model.mjs" "$model"' in remote
          print('AI15_GUARDED_RELEASE_SHELL_VALID=true')
          PY
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Install AI-only 15s model and scoped order window if follow OFF
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python prediction-bot-v1/deepseek15_ai_only_guarded_release.py
