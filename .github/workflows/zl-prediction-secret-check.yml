name: Alibaba prediction credential and collector availability check
on:
  push:
    branches: [feature/zl-futures-bot-v1]
    paths: ['.github/workflows/zl-prediction-secret-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read only secret presence, not secret values
        env:
          X_API_KEY: ${{ secrets.BINANCE_PREDICTION_API_KEY }}
          X_API_SECRET: ${{ secrets.BINANCE_PREDICTION_API_SECRET }}
          X_WALLET_ADDRESS: ${{ secrets.BINANCE_PREDICTION_WALLET_ADDRESS }}
          X_WALLET_ID: ${{ secrets.BINANCE_PREDICTION_WALLET_ID }}
          X_CONTROL_PIN: ${{ secrets.PREDICTION_CONTROL_PIN }}
          X_Z3_B64: ${{ secrets.Z3_COLLECTOR_CODE_BASE64 }}
          X_Z3_SHA: ${{ secrets.Z3_COLLECTOR_CODE_SHA256 }}
          X_RELAY_B64: ${{ secrets.EVENT10_RELAY_CODE_BASE64 }}
          X_RELAY_SHA: ${{ secrets.EVENT10_RELAY_CODE_SHA256 }}
          X_PANEL_PASSWORD: ${{ secrets.ZL_PANEL_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          for n in ("API_KEY","API_SECRET","WALLET_ADDRESS","WALLET_ID","CONTROL_PIN","Z3_B64","Z3_SHA","RELAY_B64","RELAY_SHA","PANEL_PASSWORD"):
            print("SOURCE_AVAILABLE",n, bool(os.getenv("X_"+n)))
          PY
