name: FAST5 production routing read-only preflight
on:
  push:
    branches: [feat/deepseek40-45s-ai-only-prod-20261025]
    paths: [.github/workflows/zl-fast5-prod-routing-preflight.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Inspect current running signal and model-selector gates read only
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          python - <<'OUTER'
          import os,time,base64
          from alibabacloud_swas_open20200601.client import Client
          from alibabacloud_swas_open20200601 import models as sw
          from alibabacloud_tea_openapi import models as api
          script=r"""#!/bin/bash
          set -e
          python3 - <<'INNER'
          import json,urllib.request,subprocess,pathlib,re,os
          def get(port,route):
           try:
            with urllib.request.urlopen(f'http://127.0.0.1:{port}{route}',timeout=6) as x:return json.load(x)
           except Exception as e:return {'error':type(e).__name__}
          for key,port,route in [('TRADE',13001,'/api/status'),('CHOICE',13001,'/api/order-signal-model'),('MODE',13001,'/api/direction-mode'),('DEEPSEEK',13029,'/api/status'),('FAST5',13045,'/healthz')]:
           j=get(port,route);safe={}
           fields=['ok','model','orderSignalModel','enabled','ready','revision','effectiveAfterRound','maxCallsPerRound','decisionRule','configured','error','service','mode']
           for k in fields:
            if k in j:safe[k]=j[k]
           if key=='CHOICE':safe['models']=[x.get('id') for x in j.get('models',[]) if isinstance(x,dict)]
           if key=='MODE':safe['sources']=list((j.get('modes') or {}).keys())
           print('FAST5_PREFLIGHT_STATUS',key,json.dumps(safe))
          root=pathlib.Path('/opt/zl-prediction-live/src/railway-diagnostic')
          needles={
           'production-signal-choice.mjs':['export const SELECTIVE8_MODEL','export const ORDER_SIGNAL_MODELS','export function validateDeepSeekProductionLive','export function validateSelective8','DEEPSEEK_PREWARM120_LIVE40_AI_ONLY','const initial=','effectiveAfterRound:null','if(saved.model','let raw=await redis.get'],
           'index.mjs':['const SELECTIVE8_LOCAL_URL','validateDeepSeekProductionLive','async function getSignal','if(choice.model!==SELECTIVE8_MODEL)return null','if(choice.model===SELECTIVE8_MODEL)','productionSignalSourceMode'],
           'wrapper.mjs':['const SELECTIVE30_ORDER_DEADLINE_MS','const DEEPSEEK15_ORDER_SUBMIT_DEADLINE_MS','function orderSubmitDeadlineForModel','const ORDER_SUBMIT_DEADLINE_MS'],
           'order-direction-policy.mjs':['ORDER_DIRECTION_POLICY','PRIMARY_SOURCE','ORDER_SOURCES='],
          }
          for f,marks in needles.items():
           src=(root/f).read_text();lines=src.splitlines()
           for mark in marks:
            matches=[i for i,line in enumerate(lines) if mark in line]
            print('FAST5_PREFLIGHT_CODE',f,mark,'hits',len(matches))
            for i in matches[:2]:
             for k in range(max(0,i-2),min(len(lines),i+5)):
              print('FAST5_PREFLIGHT_LINE',f,k+1,lines[k][:260])
          for svc in ['zl-prediction-trade','zl-prediction-deepseek5','zl-prediction-v2','zl-prediction-v3','zl-prediction-official-reference','zl-prediction-fast5']:
           o=subprocess.run(['systemctl','is-active',svc],capture_output=True,text=True).stdout.strip()
           print('FAST5_PREFLIGHT_SERVICE',svc,o)
          print('FAST5_PREFLIGHT_COMPLETE=true')
          INNER
          """
          cfg=api.Config(access_key_id=os.environ['ALIBABA_CLOUD_ACCESS_KEY_ID'],access_key_secret=os.environ['ALIBABA_CLOUD_ACCESS_KEY_SECRET'],region_id='ap-southeast-1',endpoint='swas.ap-southeast-1.aliyuncs.com')
          c=Client(cfg)
          ident=c.run_command(sw.RunCommandRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',name='zl-fast5-prod-routing-preflight',type='RunShellScript',working_user='root',command_content=script,timeout=95)).body.invoke_id
          for _ in range(60):
           time.sleep(2)
           x=c.describe_invocation_result(sw.DescribeInvocationResultRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',invoke_id=ident)).body.invocation_result
           if x and str(x.invocation_status) in ('Success','Failed','Aborted','ExecutionTimeout','ExitCodeNonzero'):
            print('FAST5_PREFLIGHT_REMOTE',x.invocation_status,x.exit_code)
            print(base64.b64decode(x.output or '',validate=True).decode('utf8','replace')[-26000:])
            if x.invocation_status!='Success' or int(x.exit_code)!=0:raise RuntimeError('PREFLIGHT_FAILED')
            break
          else:raise RuntimeError('PREFLIGHT_TIMEOUT')
          OUTER
