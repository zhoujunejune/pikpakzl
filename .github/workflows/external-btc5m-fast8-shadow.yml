name: External BTC5m FAST8 shadow research tests
on:
  pull_request:
    paths:
      - 'round-tracker/external-btc5m-fast8-shadow.mjs'
      - 'round-tracker/external-btc5m-fast8-shadow.test.mjs'
      - 'round-tracker/fast8-engine.mjs'
      - 'round-tracker/EXTERNAL_FAST8_RESEARCH.md'
      - '.github/workflows/external-btc5m-fast8-shadow.yml'
  push:
    branches: [main]
    paths:
      - 'round-tracker/external-btc5m-fast8-shadow.mjs'
      - 'round-tracker/external-btc5m-fast8-shadow.test.mjs'
      - 'round-tracker/fast8-engine.mjs'
jobs:
  shadow-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check round-tracker/external-btc5m-fast8-shadow.mjs
          node --check round-tracker/fast8-engine.mjs
      - name: Offline regression (no trades, no API)
        run: |
          node --test round-tracker/external-btc5m-fast8-shadow.test.mjs round-tracker/fast8.test.mjs round-tracker/fast8-production-gate.test.mjs
