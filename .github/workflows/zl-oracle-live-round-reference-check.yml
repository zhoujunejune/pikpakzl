name: Verify live 5m Chainlink start reference reached DeepSeek
on:
  push:
    branches: [feat/deepseek40-45s-ai-only-prod-20261025]
    paths: [.github/workflows/zl-oracle-live-round-reference-check.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Read-only confirm upcoming actual round official start and DeepSeek status
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          python - <<'OUTER'
          import os,base64,time
          from alibabacloud_swas_open20200601.client import Client
          from alibabacloud_swas_open20200601 import models as sw
          from alibabacloud_tea_openapi import models as api
          cmd=r"""#!/bin/bash
          set -eu
          python3 - <<'INNER'
          import time,json,urllib.request,collections,subprocess
          R=300000
          errs=collections.Counter()
          def get(port,route):
           try:
            with urllib.request.urlopen(f'http://127.0.0.1:{port}{route}',timeout=8) as z:return json.load(z)
           except Exception as e:return {'ok':False,'error':type(e).__name__}
          checks=0
          # Wait at most one 5m boundary; verify new round reference after model's first 15s.
          until=time.monotonic()+310
          while time.monotonic()<until:
           now=int(time.time()*1000);r=now//R*R;elapsed=now-r
           if 19000<=elapsed<250000:
            model=get(13029,'/api/status')
            ref=model.get('officialReference') or {}
            checks+=1
            if ref.get('available') is True and ref.get('priceFeedProvider')=='CHAINLINK' and ref.get('officialStartPrice',0)>0:
             source=get(13044,f'/api/reference?round={r}')
             if source.get('ok') is True and source.get('roundStartMs')==r and source.get('priceFeedProvider')=='CHAINLINK' and source.get('officialLivePrice') is None and abs(source['officialStartPrice']-ref['officialStartPrice'])<1e-8:
              print('ORACLE_LIVE_ROUND_EVIDENCE',json.dumps({'round':r,'analysisElapsedSeconds':round(elapsed/1000,1),'officialStart':ref['officialStartPrice'],'priceFeedProvider':ref['priceFeedProvider'],'statusReferenceAgeMs':now-ref['observedAt'],'freshMarket':model.get('featureReady'),'analysisModelCalls':model.get('analysisModelCalls'),'model':model.get('providerModel'),'decision':(model.get('roundDecision') or {}).get('direction'),'quoteNotFaked':source.get('officialLivePriceAvailable') is False},ensure_ascii=False))
              print('ORACLE_IN_DEEPSEEK_RUNNER_CONFIRMED=true')
              break
           elif elapsed<19000:errs['before_19s']+=1
           else:errs['after_250s']+=1
           if checks%8==1:
            s=get(13029,'/api/status')
            err=(s.get('officialReference') or {}).get('lastError')
            if err:errs[str(err)[:80]]+=1
           time.sleep(2)
          else:
           print('ORACLE_LIVE_REFERENCE_NOT_CONFIRMED',json.dumps({'checks':checks,'errors':dict(errs)}))
           raise SystemExit(3)
          trade=get(13001,'/api/status')
          print('ORACLE_FOLLOW_CURRENT',trade.get('enabled'))
          assert trade.get('orderSignalModel')=='DEEPSEEK_5M_V1'
          for svc in ['zl-prediction-deepseek5','zl-prediction-trade','zl-prediction-official-reference']:
           assert subprocess.run(['systemctl','is-active','--quiet',svc]).returncode==0
          print('ORACLE_LIVE_REFERENCE_ALL_SERVICES_OK=true')
          INNER
          """
          cli=Client(api.Config(access_key_id=os.environ['ALIBABA_CLOUD_ACCESS_KEY_ID'],access_key_secret=os.environ['ALIBABA_CLOUD_ACCESS_KEY_SECRET'],region_id='ap-southeast-1',endpoint='swas.ap-southeast-1.aliyuncs.com'))
          inv=cli.run_command(sw.RunCommandRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',name='zl-chainlink-live-round-proof-readonly',type='RunShellScript',working_user='root',command_content=cmd,timeout=345)).body.invoke_id
          for _ in range(185):
           time.sleep(2)
           r=cli.describe_invocation_result(sw.DescribeInvocationResultRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',invoke_id=inv)).body.invocation_result
           if r and str(r.invocation_status) in ('Success','Failed','Aborted','ExecutionTimeout','ExitCodeNonzero'):
            out=base64.b64decode(r.output or '',validate=True).decode('utf8','replace')
            print('ORACLE_LIVE_REMOTE',r.invocation_status,'EXIT',r.exit_code);print(out[-5000:])
            if int(r.exit_code)!=0:raise RuntimeError('ORACLE_LIVE_CHECK_FAILED')
            break
          else:raise RuntimeError('ORACLE_LIVE_CHECK_TIMED_OUT')
          OUTER
