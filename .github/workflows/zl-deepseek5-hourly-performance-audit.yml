name: Read-only latest DeepSeek5 hourly results from Alibaba production
on:
  push:
    branches: [audit/deepseek5-hourly-performance-20261022]
    paths:
      - .github/workflows/zl-deepseek5-hourly-performance-audit.yml
      - prediction-bot-v1/deepseek5_hourly_performance_readonly_20261022.py
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify read-only script syntax
        run: |
          python - <<'PY'
          import ast,subprocess,pathlib
          p=pathlib.Path('prediction-bot-v1/deepseek5_hourly_performance_readonly_20261022.py')
          src=p.read_text()
          mod=ast.parse(src)
          inner=next(n.value.value for n in mod.body if isinstance(n,ast.Assign) and
            any(isinstance(t,ast.Name) and t.id=='REMOTE' for t in n.targets))
          check=subprocess.run(['bash','-n'],input=inner,text=True,capture_output=True)
          assert check.returncode==0,check.stderr
          start=inner.index("python3 - <<'PY'")+len("python3 - <<'PY'")
          end=inner.index("\nPY",start)
          compile(inner[start:end],'<production read-only audit>','exec')
          PY
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Calculate actual recent 5-minute prediction outcomes by Beijing hour
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python prediction-bot-v1/deepseek5_hourly_performance_readonly_20261022.py
