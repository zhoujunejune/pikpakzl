name: Deploy visible dual5 robot link in main dashboard
on:
  push:
    branches: [feat/deepseek40-45s-ai-only-prod-20261025]
    paths: [.github/workflows/zl-dual5-home-menu-release.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: zl-alibaba-prediction-singlehost
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Test home robot switch without altering trade controls
        run: |
          node --check prediction-bot-v1/dual5-robot-navigation.mjs
          node --test prediction-bot-v1/dual5-robot-navigation.test.mjs
          python -m py_compile prediction-bot-v1/dual5_home_menu_deploy.py
  deploy:
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Apply guarded home navigation patch through existing Alibaba authorization
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          python - <<'OUTER'
          import os,time,base64
          from alibabacloud_swas_open20200601.client import Client
          from alibabacloud_swas_open20200601 import models as sw
          from alibabacloud_tea_openapi import models as api
          sha=os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_REF_NAME']=='feat/deepseek40-45s-ai-only-prod-20261025'
          script="""#!/bin/bash
          set -Eeuo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL --retry 2 --max-time 35 "https://raw.githubusercontent.com/zhoujunejune/pikpakzl/COMMIT_SHA/prediction-bot-v1/dual5_home_menu_deploy.py" -o "$tmp/dual5-menu.py"
          python3 -m py_compile "$tmp/dual5-menu.py"
          python3 "$tmp/dual5-menu.py" COMMIT_SHA
          """.replace('COMMIT_SHA',sha)
          c=Client(api.Config(access_key_id=os.environ['ALIBABA_CLOUD_ACCESS_KEY_ID'],access_key_secret=os.environ['ALIBABA_CLOUD_ACCESS_KEY_SECRET'],region_id='ap-southeast-1',endpoint='swas.ap-southeast-1.aliyuncs.com'))
          inv=c.run_command(sw.RunCommandRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',name='zl-dual5-home-third-robot-menu',type='RunShellScript',working_user='root',command_content=script,timeout=230)).body.invoke_id
          for _ in range(115):
           time.sleep(2)
           r=c.describe_invocation_result(sw.DescribeInvocationResultRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',invoke_id=inv)).body.invocation_result
           if r and str(r.invocation_status) in ('Success','Failed','Aborted','ExecutionTimeout','ExitCodeNonzero'):
            print('DUAL5_HOME_CLOUD',r.invocation_status,'EXIT',r.exit_code)
            try:print(base64.b64decode(r.output or '',validate=True).decode('utf8','replace')[-12000:])
            except Exception:print('DUAL5_HOME_OUTPUT_UNAVAILABLE')
            if r.invocation_status!='Success' or int(r.exit_code)!=0:
             raise RuntimeError('DUAL5_HOME_MENU_DEPLOY_FAILED')
            break
          else:raise RuntimeError('DUAL5_HOME_MENU_DEPLOY_TIMEOUT')
          OUTER
  verify:
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify authenticated home menu, dual5 destination and original follow off
        env:
          ZL_PANEL_PASSWORD: ${{ secrets.ZL_PANEL_PASSWORD }}
        run: |
          python - <<'PY'
          import json,os,base64,urllib.request
          base='https://prediction.47-237-188-69.sslip.io'
          auth='Basic '+base64.b64encode(('zl:'+os.environ['ZL_PANEL_PASSWORD']).encode()).decode()
          def get(route):
           with urllib.request.urlopen(urllib.request.Request(base+route,
             headers={'Authorization':auth,'Cache-Control':'no-store'}),timeout=18) as r:
            return r.status,r.read(2000000)
          status,body=get('/')
          html=body.decode('utf8','replace')
          assert status==200 and html.count('id="zlRobotMenu"')==1
          assert html.count('id="zlDual5RobotLink"')==1 and 'href="/dual5"' in html
          assert '5分钟UP+DOWN双边' in html and '机器人切换' in html
          status,body=get('/dual5')
          dual_html=body.decode('utf8','replace')
          assert status==200 and 'UP / DOWN 独立止盈止损' in dual_html
          assert 'id="riskSave"' in dual_html
          status,body=get('/api/dual5-status')
          pair=json.loads(body)
          assert status==200 and pair.get('model')=='BINANCE_DUAL5_PAIR_V1'
          assert pair.get('active') is False
          status,body=get('/api/status')
          old=json.loads(body)
          assert status==200 and old.get('enabled') is False
          print('DUAL5_HOME_PUBLIC_MENU_VISIBLE=true')
          print('DUAL5_HOME_PUBLIC_THIRD_BOT_LINK_VISIBLE=true')
          print('DUAL5_HOME_DUAL5_DESTINATION_OK=true')
          print('DUAL5_HOME_LEG_TPSL_CONTROLS_PRESENT=true')
          print('DUAL5_HOME_BOTH_REAL_TRADING_SWITCHES_OFF=true')
          PY
