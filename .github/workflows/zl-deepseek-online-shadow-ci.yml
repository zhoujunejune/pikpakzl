name: DeepSeek online shadow training safe tests
on:
  push:
    branches: [feature/zl-futures-bot-v1]
    paths:
      - prediction-bot-v1/deepseek_online_shadow.py
      - prediction-bot-v1/test_deepseek_online_shadow.py
      - .github/workflows/zl-deepseek-online-shadow-ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify pure Python source syntax
        run: python -m py_compile prediction-bot-v1/deepseek_online_shadow.py prediction-bot-v1/test_deepseek_online_shadow.py
      - name: Test causality, settlement gating, durable weight changes
        run: python -m unittest discover -s prediction-bot-v1 -p test_deepseek_online_shadow.py -v
