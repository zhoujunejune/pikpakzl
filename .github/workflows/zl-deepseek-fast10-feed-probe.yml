name: DeepSeek FAST10 live feed cadence - READ ONLY
on:
  push:
    branches: [feat/deepseek-prewarm-fast10-20261021]
    paths: [.github/workflows/zl-deepseek-fast10-feed-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Sample loopback market freshness for 15s with no code changes
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          python - <<'OUTER'
          import os,base64,time
          from alibabacloud_swas_open20200601.client import Client
          from alibabacloud_swas_open20200601 import models as sw
          from alibabacloud_tea_openapi import models as api
          script="""#!/bin/bash
          set -eu
          python3 - <<'INNER'
          import json,time,urllib.request,collections
          ids=[];fresh=[];errs=[];prices=[];starts=[];opens=[]
          for _ in range(17):
              now=int(time.time()*1000)
              try:
                  with urllib.request.urlopen('http://127.0.0.1:13003/api/shadow-market-data',timeout=3) as r:d=json.load(r)
                  a=d.get('latest') or {}
                  ids.append(int(a['eventMs']))
                  fresh.append(now-int(a['eventMs']))
                  starts.append(int(a['roundStartMs']))
                  opens.append(float(a['roundOpenPrice']))
                  prices.append(float(a['lastPrice']))
              except Exception as e:
                  errs.append(type(e).__name__)
              time.sleep(.85)
          from pathlib import Path
          import subprocess
          main=Path('/opt/zl-prediction-live/deepseek5/deepseek-5m-engine.mjs')
          txt=main.read_text() if main.exists() else ''
          anchors={
             'dynamic270':"SIGNAL_DEADLINE_MS=270000" in txt,
             'legacyPolling5s':'setInterval(()=>void eng.tick(),5000)' in txt,
             'usesOnlineMemory':'episodic' in txt.lower(),
             'hasTickLoop':'async function tick()' in txt,
             'hasLearner':'newLearner' in txt,
             'hasDeepSeekModel':'deepseek-flash' in txt
          }
          print('FAST10_FEED_READONLY='+json.dumps({
            'samples':len(ids),'uniqueTicks':len(set(ids)),
            'maxEventAgeMs':max(fresh) if fresh else None,
            'medianEventAgeMs':sorted(fresh)[len(fresh)//2] if fresh else None,
            'roundTransitions':max(0,len(set(starts))-1),
            'openChangesWithinSameRound':any(starts[i]==starts[i-1] and opens[i]!=opens[i-1] for i in range(1,len(starts))),
            'priceChangeSamples':sum(prices[i]!=prices[i-1] for i in range(1,len(prices))),
            'errors':errs[:5],'existingEngineAnchors':anchors,
            'productionDeepseekActive':subprocess.run(['systemctl','is-active','zl-prediction-deepseek5.service'],capture_output=True,text=True).stdout.strip(),
            'productionTradeActive':subprocess.run(['systemctl','is-active','zl-prediction-trade.service'],capture_output=True,text=True).stdout.strip()
          },separators=(',',':')))
          INNER
          """
          client=Client(api.Config(access_key_id=os.environ['ALIBABA_CLOUD_ACCESS_KEY_ID'],
             access_key_secret=os.environ['ALIBABA_CLOUD_ACCESS_KEY_SECRET'],
             region_id='ap-southeast-1',endpoint='swas.ap-southeast-1.aliyuncs.com'))
          inv=client.run_command(sw.RunCommandRequest(region_id='ap-southeast-1',
             instance_id='b67374069bb3457ba6a3a2ede9305d3f',name='zl-fast10-market-cadence-readonly',
             type='RunShellScript',working_user='root',command_content=script,timeout=65)).body.invoke_id
          for i in range(35):
             time.sleep(2)
             r=client.describe_invocation_result(sw.DescribeInvocationResultRequest(
               region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',invoke_id=inv)).body.invocation_result
             if r and str(r.invocation_status) in ('Success','Failed','Aborted','ExecutionTimeout','ExitCodeNonzero'):
                out=base64.b64decode(r.output or '',validate=True).decode('utf8','replace')
                for line in out.splitlines():
                    if line.startswith('FAST10_FEED_READONLY='):print(line)
                if int(r.exit_code)!=0:raise RuntimeError('FAST10_PROBE_REMOTE_FAILED')
                break
          else:raise RuntimeError('FAST10_PROBE_TIMED_OUT')
          OUTER
