name: Selective V2 hard fuse safety
on:
  pull_request:
    paths:
      - 'round-tracker/index-rest.mjs'
      - 'round-tracker/selective-v2-hard-fuse.mjs'
      - 'round-tracker/test/selective-v2-hard-fuse.test.mjs'
      - '.github/workflows/selective-v2-hard-fuse.yml'
  workflow_dispatch:
jobs:
  hard-fuse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production entrypoint syntax
        run: node --check round-tracker/index-rest.mjs
      - name: Verify fuse module syntax
        run: node --check round-tracker/selective-v2-hard-fuse.mjs
      - name: Run strict official paper and loss-streak tests
        run: node --test round-tracker/test/selective-v2-hard-fuse.test.mjs
