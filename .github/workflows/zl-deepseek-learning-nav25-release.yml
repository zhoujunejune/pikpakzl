name: Publish visible AI-learning anchor on prediction control page
on:
  push:
    branches: [feat/deepseek-learning-evidence25-20261021]
    paths:
      - .github/workflows/zl-deepseek-learning-nav25-release.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: zl-alibaba-prediction-singlehost
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify nav-only patch syntax and 25s protection
        run: |
          bash -n prediction-bot-v1/learning_effect_nav_apply.sh
          python -m py_compile prediction-bot-v1/learning_effect_nav_patch.py
          python -m py_compile prediction-bot-v1/learning_effect_nav_launch.py
          grep -q 'LEARNING_NAV_FOLLOW_OFF=true' prediction-bot-v1/learning_effect_nav_apply.sh
          grep -q 'currentRound+25000;' prediction-bot-v1/learning_effect_nav_patch.py
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install existing Alibaba SWAS SDK
        run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Show learning audit nav link after guarded 25s production validation
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python prediction-bot-v1/learning_effect_nav_launch.py
