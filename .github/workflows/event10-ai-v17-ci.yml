name: EVENT10 V17 AI direction and independent market feed tests
on:
  push:
    branches: [feature/zl-futures-bot-v1]
    paths:
      - 'event10-bot/ai-direction-review.mjs'
      - 'event10-bot/ai-direction-review.test.mjs'
      - 'event10-bot/readonly-candles.mjs'
      - 'event10-bot/manual-engine.mjs'
      - 'event10-bot/pure-signal.mjs'
      - 'event10-bot/selective-trend.test.mjs'
      - '.github/workflows/event10-ai-v17-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check directional AI syntax and unchanged pacing
        run: |
          node --check event10-bot/ai-direction-review.mjs
          node --check event10-bot/readonly-candles.mjs
          node --check event10-bot/manual-engine.mjs
          node --check event10-bot/pure-signal.mjs
          node --test event10-bot/selective-trend.test.mjs event10-bot/ai-direction-review.test.mjs
          grep -F 'MIN_SIGNAL_GAP_MS = 600_000' event10-bot/manual-engine.mjs
          grep -F 'EVENT10_AI_FEEDBACK_V17_20261106' event10-bot/pure-signal.mjs
  report:
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - name: Publish isolated AI test result
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.check.result }}
        run: |
          if [ "$RESULT" = success ];then state=success;else state=failure;fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="event10-v17-ai-ci" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="EVENT10 V17 AI direction and independent candle CI: $RESULT" >/dev/null
