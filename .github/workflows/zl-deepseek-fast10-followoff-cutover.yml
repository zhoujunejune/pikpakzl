name: DeepSeek FAST10 production provider cutover (follow MUST be OFF)
on:
  push:
    branches: [feat/deepseek-prewarm-fast10-20261021]
    paths: [.github/workflows/zl-deepseek-fast10-followoff-cutover.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zl-alibaba-prediction-singlehost
  cancel-in-progress: false
jobs:
  controlled-provider-switch:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Offline regression, including existing core integration and no-order assertions
        run: |
          python -m py_compile prediction-bot-v1/aliyun_fast10_followoff_cutover.py
          node --check prediction-bot-v1/deepseek-fast10-production-adapter.mjs
          node --test prediction-bot-v1/deepseek-fast10-shadow-core.test.mjs
          node --test prediction-bot-v1/deepseek-fast10-shadow-runner.test.mjs
          node --test prediction-bot-v1/deepseek-fast10-production-adapter.test.mjs
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Fail closed if auto-follow is ON, back up and switch provider only
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python prediction-bot-v1/aliyun_fast10_followoff_cutover.py
