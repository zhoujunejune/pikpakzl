name: Publish original DeepSeek 25s UP DOWN normal Binance orders
on:
  push:
    branches: [fix/deepseek25-direction-only-normal-orders-20261022]
    paths:
      - .github/workflows/zl-restore-deepseek25-direction-production.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: zl-alibaba-prediction-singlehost
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Check safely restored UP DOWN-only order flow
        run: |
          bash -n prediction-bot-v1/apply_restore_direction_only25.sh
          python3 -m py_compile prediction-bot-v1/launch_restore_direction_only25.py
          python3 prediction-bot-v1/patch_deepseek_quote_cognition.py prediction-bot-v1 /tmp/ai-model
          python3 prediction-bot-v1/patch_live_trade_value.py railway-diagnostic/wrapper.mjs /tmp/math-wrapper.mjs
          python3 prediction-bot-v1/patch_trade_quote_preview.py /tmp/math-wrapper.mjs /tmp/quoted-wrapper.mjs
          python3 prediction-bot-v1/patch_deepseek_direct_trade.py /tmp/ai-model /tmp/quoted-wrapper.mjs /tmp/ai-wrapper.mjs
          python3 prediction-bot-v1/patch_restore_25s_direction_orders.py /tmp/ai-wrapper.mjs /tmp/normal-wrapper.mjs
          node --check /tmp/normal-wrapper.mjs
          ! grep -q 'deepseek_direct_trade_choice' /tmp/normal-wrapper.mjs
          ! grep -q 'decideLiveTradeValue' /tmp/normal-wrapper.mjs
          grep -q 'submitPendingOrder(pendingAction' /tmp/normal-wrapper.mjs
          grep -q 'getFreshQuote(p._internal)' /tmp/normal-wrapper.mjs
          grep -q 'MAX_AI_CALLS_PER_ROUND=6' prediction-bot-v1/deepseek-adaptive15-runner.mjs
          grep -q 'DEADLINE_MS=25000' prediction-bot-v1/deepseek-adaptive15-core.mjs
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Guarded production rollback of AI trade veto; no restart if owner still follows
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python prediction-bot-v1/launch_restore_direction_only25.py
