name: Validate local FAST5 BTC calculation without DeepSeek
on:
  push:
    branches: [feat/deepseek40-45s-ai-only-prod-20261025]
    paths: [.github/workflows/zl-fast5-local-calculator-ci.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Local-only regression and causal checks
        run: |
          node --check prediction-bot-v1/fast5-real-market-calculator.mjs
          node --check prediction-bot-v1/fast5-real-market-service.mjs
          node --check prediction-bot-v1/fast5-dashboard-inject.mjs
          node --test prediction-bot-v1/fast5-real-market-calculator.test.mjs prediction-bot-v1/fast5-real-market-service.test.mjs prediction-bot-v1/fast5-dashboard-inject.test.mjs
          python3 -m py_compile prediction-bot-v1/fast5_ui_repair.py
