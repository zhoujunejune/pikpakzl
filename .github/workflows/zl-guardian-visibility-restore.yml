name: Restore GUARDIAN read-only homepage visibility
on:
  push:
    branches: [feature/zl-futures-bot-v1]
    paths:
      - prediction-bot-v1/aliyun_guardian_restore_visibility.py
      - .github/workflows/zl-guardian-visibility-restore.yml
  workflow_dispatch:
permissions: {contents: read, statuses: write}
concurrency:
  group: guardian5-visibility-repair-only
  cancel-in-progress: false
jobs:
  ui-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Python, embedded JS and remote shell before touching Alibaba
        id: validate
        run: |
          python -m py_compile prediction-bot-v1/aliyun_guardian_restore_visibility.py
          node --check prediction-bot-v1/guardian-visibility-sidecar.mjs
          python - <<'PY'
          import ast, pathlib, subprocess
          p=pathlib.Path('prediction-bot-v1/aliyun_guardian_restore_visibility.py')
          tree=ast.parse(p.read_text())
          strs={x.targets[0].id:x.value.value for x in tree.body if isinstance(x,ast.Assign) and len(x.targets)==1 and isinstance(x.targets[0],ast.Name) and isinstance(x.value,ast.Constant) and isinstance(x.value.value,str)}
          fragment=strs['VIS']
          assert '<script>' in fragment and '</script>' in fragment
          js=fragment.split('<script>',1)[1].split('</script>',1)[0]
          test=subprocess.run(['node','--check'],input=js,text=True,capture_output=True)
          print(test.stderr)
          assert test.returncode==0,'READONLY_WIDGET_JS_SYNTAX_FAILURE'
          shell=subprocess.run(['bash','-n'],input=strs['REMOTE'],text=True,capture_output=True)
          print(shell.stderr)
          assert shell.returncode==0,'REMOTE_SHELL_INVALID'
          assert 'ZGV_RESTART_SKIPPED_TO_PROTECT_ACTIVE_TRADES=true' in strs['REMOTE']
          print('GUARDIAN_READONLY_VISIBILITY_PATCH_VALID=true')
          PY
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Deploy read-only overlay through Caddy, no trading-process restart
        id: deploy
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          test -n "$ALIBABA_CLOUD_ACCESS_KEY_ID"
          test -n "$ALIBABA_CLOUD_ACCESS_KEY_SECRET"
          set -o pipefail
          python prediction-bot-v1/aliyun_guardian_restore_visibility.py 2>&1 | tee /tmp/zgv-deploy.log
      - name: Publish auditable deployment result
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ZGV_JOB_STATUS: ${{ job.status }}
          ZGV_VALIDATE: ${{ steps.validate.outcome }}
          ZGV_DEPLOY: ${{ steps.deploy.outcome }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,re
          state='success' if os.getenv('ZGV_JOB_STATUS')=='success' else 'failure'
          phase='verify' if state=='success' else ('validation' if os.getenv('ZGV_VALIDATE')!='success' else 'aliyun-deploy')
          diagnostic=''
          try:
            lines=open('/tmp/zgv-deploy.log',encoding='utf-8',errors='replace').read().splitlines()
            pats=['PREDICTION_CADDY_HOST_MISSING','PREDICTION_FALLBACK_NOT_MATCHED','EXISTING_ROOT_PROXY_DRIFT','AUTH_MUST_BE_PRESERVED','STALE_OR_INVALID_MARKET','GUARDIAN_INJECTION_ANCHOR_CHANGED','ZGV_ROLLBACK_DONE','REMOTE_TIMEOUT','NODE_MODULE_NOT_FOUND','HTTP_404','ERR_UNKNOWN_FILE_EXTENSION','SECRET_MISSING']
            diagnostic=next((p for p in pats if any(p in x for x in lines)), '')
            if not diagnostic:
              last=next((x for x in reversed(lines) if 'ZGV_REMOTE_RESULT ' in x),'')
              m=re.search(r'ZGV_REMOTE_RESULT\s+(\w+)\s+(\d+)',last)
              diagnostic=('REMOTE_'+m.group(1)+'_'+m.group(2)) if m else ''
            if not diagnostic:
              last=next((x for x in reversed(lines) if re.match(r'^(?:RuntimeError|AssertionError|SyntaxError|TypeError|FileNotFoundError):',x)), '')
              diagnostic=re.sub('[^A-Z0-9_]+','_',last.upper())[:45]
          except (OSError,ValueError): pass
          context='guardian-ui-'+phase+('-'+diagnostic if state=='failure' and diagnostic else '')
          body=json.dumps({
            'state':state,
            'context':context[:100],
            'description':'Read-only visibility deploy '+state+'; trading engine not restarted'
          }).encode()
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/statuses/'+os.environ['GITHUB_SHA']
          request=urllib.request.Request(url,data=body,method='POST',headers={
            'Authorization':'Bearer '+os.environ['GH_TOKEN'],
            'Accept':'application/vnd.github+json',
            'Content-Type':'application/json'
          })
          with urllib.request.urlopen(request,timeout=20) as response:
            print('ZGV_COMMIT_STATUS_POSTED',response.status,state)
          PY

