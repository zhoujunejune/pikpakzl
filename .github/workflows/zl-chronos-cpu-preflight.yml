name: Check Alibaba zero-shot Chronos tiny CPU and model feasibility read only
on:
  push:
    branches: [feat/deepseek40-45s-ai-only-prod-20261025]
    paths: [.github/workflows/zl-chronos-cpu-preflight.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Read-only production machine CPU RAM disk outbound inference deps and trading flags
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          python - <<'OUTER'
          import os,time,base64
          from alibabacloud_swas_open20200601.client import Client
          from alibabacloud_swas_open20200601 import models as sw
          from alibabacloud_tea_openapi import models as api
          sh=r"""#!/bin/bash
          set -eu
          python3 - <<'INNER'
          import os,json,platform,shutil,urllib.request,urllib.error,importlib.util,subprocess
          def get(port,route):
           try:
            with urllib.request.urlopen(f'http://127.0.0.1:{port}{route}',timeout=7) as r:return json.load(r)
           except Exception as e:return {'error':type(e).__name__}
          m={}
          for line in open('/proc/meminfo'):
           if ':' in line:
            k,v=line.split(':',1)
            try:m[k]=int(v.split()[0])//1024
            except:pass
          print('CHRONOS_MACHINE',json.dumps({'arch':platform.machine(),'cpuCount':os.cpu_count(),'memTotalMB':m.get('MemTotal'),'memAvailableMB':m.get('MemAvailable'),'swapFreeMB':m.get('SwapFree'),'diskFreeMB':shutil.disk_usage('/opt').free//1048576,'python':platform.python_version()}))
          for mod in ['torch','numpy','chronos','transformers','huggingface_hub','safetensors']:
           spec=importlib.util.find_spec(mod)
           print('CHRONOS_DEP',mod,bool(spec))
          for host in ['https://huggingface.co/amazon/chronos-bolt-tiny/resolve/main/config.json','https://pypi.org/simple/chronos-forecasting/']:
           try:
            req=urllib.request.Request(host,method='HEAD')
            with urllib.request.urlopen(req,timeout=8) as response:print('CHRONOS_OUTBOUND',urllib.parse.urlparse(host).hostname,response.status)
           except Exception as e:print('CHRONOS_OUTBOUND',urllib.parse.urlparse(host).hostname,type(e).__name__,getattr(e,'code',None))
          tr=get(13001,'/api/status');ai=get(13029,'/api/status');feed=get(13003,'/api/shadow-market-data')
          candles=(feed.get('candles') or {})
          print('CHRONOS_STATUS',json.dumps({'follow':tr.get('enabled'),'model':tr.get('orderSignalModel'),'deepseekActive':ai.get('configured'),'aiModel':ai.get('providerModel'),'oneMinuteBars':len((candles.get('1m') or {}).get('rows') or []),'fiveMinuteBars':len((candles.get('5m') or {}).get('rows') or []),'feedOK':feed.get('ok')}))
          print('CHRONOS_PREFLIGHT_COMPLETE=true')
          INNER
          """
          c=Client(api.Config(access_key_id=os.environ['ALIBABA_CLOUD_ACCESS_KEY_ID'],access_key_secret=os.environ['ALIBABA_CLOUD_ACCESS_KEY_SECRET'],region_id='ap-southeast-1',endpoint='swas.ap-southeast-1.aliyuncs.com'))
          inv=c.run_command(sw.RunCommandRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',name='zl-chronos-tiny-cpu-readonly-preflight',type='RunShellScript',working_user='root',command_content=sh,timeout=115)).body.invoke_id
          for _ in range(64):
           time.sleep(2)
           r=c.describe_invocation_result(sw.DescribeInvocationResultRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',invoke_id=inv)).body.invocation_result
           if r and str(r.invocation_status) in ('Success','Failed','Aborted','ExecutionTimeout','ExitCodeNonzero'):
            out=base64.b64decode(r.output or '',validate=True).decode('utf8','replace')
            print('CHRONOS_CHECK_REMOTE',r.invocation_status,'EXIT',r.exit_code)
            print(out[-7000:])
            if int(r.exit_code)!=0:raise RuntimeError('CHRONOS_CHECK_FAILED')
            break
          else:raise RuntimeError('CHRONOS_CHECK_TIMEOUT')
          OUTER
