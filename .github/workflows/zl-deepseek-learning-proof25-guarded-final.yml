name: Deploy preserved-counter DeepSeek memory audit on Alibaba 25s
on:
  push:
    branches: [feat/deepseek-learning-evidence25-20261021]
    paths:
      - .github/workflows/zl-deepseek-learning-proof25-guarded-final.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: zl-alibaba-prediction-singlehost
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate current six-call AI and zero-cost learning evidence
        run: |
          bash -n prediction-bot-v1/learning_evidence25_apply.sh
          python3 -m py_compile prediction-bot-v1/learner_lifetime_compatible_patch.py
          python3 -m py_compile prediction-bot-v1/learning_evidence25_launch.py
          node --test prediction-bot-v1/deepseek-learning-evidence25.test.mjs
          node --test prediction-bot-v1/deepseek-wait-reconsider25.test.mjs
          node --test prediction-bot-v1/deepseek-free-analysis25.test.mjs
          node --test prediction-bot-v1/deepseek-5m-episodic-memory.test.mjs
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Existing Alibaba SWAS API SDK
        run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Safely merge current production lifetime counters with learning evidence
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python prediction-bot-v1/learning_evidence25_launch.py
