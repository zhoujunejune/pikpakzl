name: Deploy read-only DeepSeek learning dashboard on Alibaba 25s
on:
  push:
    branches: [feat/deepseek-learning-evidence25-20261021]
    paths:
      - .github/workflows/zl-deepseek-learning-ui25-guarded-release.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: zl-alibaba-prediction-singlehost
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify UI-only patch syntax and safe production deadline
        run: |
          bash -n prediction-bot-v1/learning_effect_ui_apply.sh
          python -m py_compile prediction-bot-v1/learning_effect_ui_patch.py
          python -m py_compile prediction-bot-v1/learning_effect_ui_launch.py
          grep -q 'LEARNING_UI_FOLLOW_STILL_OFF=true' prediction-bot-v1/learning_effect_ui_apply.sh
          grep -q 'currentRound+25000;' prediction-bot-v1/learning_effect_ui_patch.py
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install existing Alibaba SWAS SDK
        run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Deploy read-only learning metrics to existing dashboard with rollback
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python prediction-bot-v1/learning_effect_ui_launch.py
