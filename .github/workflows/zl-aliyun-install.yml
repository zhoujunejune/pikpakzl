name: Alibaba SWAS futures paper-only install
# Deploy live BTC/ETH price snapshots and readable stop/take-profit position panel.
# Install the tested phone control UI locally; external HTTPS disabled until password is configured.
on:
  push:
    branches: [feature/zl-futures-bot-v1]
    paths:
      - '.github/workflows/zl-aliyun-install.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zl-aliyun-futures-paper-install
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Alibaba Cloud SDK
        run: python -m pip install --disable-pip-version-check alibabacloud_swas_open20200601==4.0.0
      - name: Install paper-only bot on confirmed Alibaba SWAS instance
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python futures-bot-v1/aliyun_deploy.py
