name: Audit live BTC features and official settlement inputs (read-only)
on:
  push:
    branches: [feature/zl-futures-bot-v1]
    paths: [.github/workflows/zl-deepseek-feature-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip -q install alibabacloud_swas_open20200601==4.0.0
      - name: Get redacted structure of feature feed and official settlements
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python prediction-bot-v1/aliyun_deepseek_feature_source_audit.py
