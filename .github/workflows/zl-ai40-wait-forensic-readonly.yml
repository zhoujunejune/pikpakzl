name: DeepSeek40 live WAIT forensic + new-version settlement audit
on:
  push:
    branches: [feat/deepseek40-45s-ai-only-prod-20261025]
    paths: [.github/workflows/zl-ai40-wait-forensic-readonly.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Read-only actual AI round, WAIT reason, official stats, recent logs
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          python - <<'OUTER'
          import base64,os,time
          from alibabacloud_swas_open20200601.client import Client
          from alibabacloud_swas_open20200601 import models as sw
          from alibabacloud_tea_openapi import models as api
          script=r"""#!/bin/bash
          set -eu
          python3 - <<'INNER'
          from pathlib import Path
          import json,urllib.request,subprocess,datetime,collections,time
          CUT=1792902300000
          now=int(time.time()*1000)
          def safeget(port,route):
           try:
            with urllib.request.urlopen('http://127.0.0.1:%s%s'%(port,route),timeout=9) as u:return json.load(u)
           except Exception as e:return {'fetchError':type(e).__name__}
          s=safeget(13029,'/api/status')
          print('AI40_STATUS',json.dumps({k:s.get(k) for k in ['round','roundDecision','lastDecision','lastSignal','tries','maxCallsPerRound','busy','error','waitReason','skippedRounds','missedRounds','prewarmStatus','reviewStatus','analysisFirstDirection','analysisReviewDirection','analysisCurrentDirection','analysisModelCalls','analysisPreviousRoundSnapshots','analysisEarlySnapshots','analysisLastSkip','reasoning','featureReady','lastApiLatencyMs','learning','strategyQuality','qualityError']},ensure_ascii=False,default=str)[:3500])
          raw=safeget(13029,'/api/history?limit=100')
          rows=raw.get('records') or []
          recent=[x for x in rows if (x.get('round') or 0)>=CUT]
          print('AI40_HISTORY_TOTAL_RECENT',len(rows),'since_cutover',len(recent))
          for x in recent[-35:]:
           print('AI40_HISTORY_ROW',json.dumps({k:x.get(k) for k in ['round','direction','status','reason','detail','signalLatencyMs','actual','hit','attemptCount','provider']},ensure_ascii=False))
          wf=Path('/var/lib/zl-prediction/deepseek5/wait-rounds.json')
          if wf.exists():
           w=json.loads(wf.read_text())
           allwait=w.get('records') or []
           new=[x for x in allwait if x.get('round',0)>=CUT]
           print('AI40_WAIT_COUNT',len(new),'by_reason',dict(collections.Counter(x.get('reason') for x in new)),'by_detail',dict(collections.Counter(x.get('detail') for x in new)))
           for x in new[-35:]:
            print('AI40_WAIT_ROW',json.dumps({k:x.get(k) for k in ['round','at','reason','detail']},ensure_ascii=False))
          else:print('AI40_WAIT_FILE_MISSING=true')
          q=safeget(13029,'/api/quality')
          print('AI40_QUALITY',json.dumps(q,ensure_ascii=False,default=str)[:2200])
          official=safeget(13002,'/api/round-stats')
          print('AI40_OFFICIAL',json.dumps({k:official.get(k) for k in ['ok','settlementSource','productionSignalSourceMode','generatedAt']},ensure_ascii=False),'records',len(official.get('records') or []))
          for x in (official.get('records') or [])[-8:]:
           print('AI40_OFFICIAL_ROW',json.dumps({k:x.get(k) for k in ['roundStartMs','productionPrediction','productionActual','productionSettledAt']},ensure_ascii=False))
          market=safeget(13003,'/api/shadow-market-data')
          at=(market.get('latest') or {}).get('eventMs')
          print('AI40_MARKET',json.dumps({'ok':market.get('ok'),'feedConnected':(market.get('latest') or {}).get('marketFeedConnected'),'ageMs':now-at if isinstance(at,(float,int)) else None}))
          j=subprocess.run(['journalctl','-u','zl-prediction-deepseek5.service','--since','2026-10-25 04:23:00 UTC','--no-pager','-o','cat','-n','85'],capture_output=True,text=True,timeout=6)
          filt=[]
          for line in j.stdout.splitlines():
           line=line.strip()
           if any(x in line.upper() for x in ['TOKEN','SECRET','PASSWORD','AUTHORIZATION','BEARER','API_KEY']):continue
           filt.append(line[:280])
          print('AI40_JOURNAL',json.dumps(filt[-45:],ensure_ascii=False)[:3500])
          print('AI40_READONLY_FORENSIC_DONE=true')
          INNER
          """
          cli=Client(api.Config(access_key_id=os.environ['ALIBABA_CLOUD_ACCESS_KEY_ID'],access_key_secret=os.environ['ALIBABA_CLOUD_ACCESS_KEY_SECRET'],region_id='ap-southeast-1',endpoint='swas.ap-southeast-1.aliyuncs.com'))
          inv=cli.run_command(sw.RunCommandRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',name='zl-ai40-wait-reasons-readonly',type='RunShellScript',working_user='root',command_content=script,timeout=115)).body.invoke_id
          for _ in range(52):
           time.sleep(2)
           r=cli.describe_invocation_result(sw.DescribeInvocationResultRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',invoke_id=inv)).body.invocation_result
           if r and str(r.invocation_status) in ('Success','Failed','Aborted','ExecutionTimeout','ExitCodeNonzero'):
            out=base64.b64decode(r.output or '',validate=True).decode('utf8','replace')
            print('AI40_FORENSIC_REMOTE',r.invocation_status,r.exit_code);print(out[-19000:])
            if int(r.exit_code)!=0:raise RuntimeError('AI40_FORENSIC_FAILED')
            break
          else:raise RuntimeError('AI40_FORENSIC_TIMEOUT')
          OUTER
