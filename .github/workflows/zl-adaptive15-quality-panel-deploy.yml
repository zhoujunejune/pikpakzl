name: Patch live DeepSeek quality and realized PnL disclaimer in dashboard, follow OFF
on:
  push:
    branches: [feat/adaptive15-deferred-wait-learning-pnl-20261021]
    paths:
      - .github/workflows/zl-adaptive15-quality-panel-deploy.yml
      - prediction-bot-v1/aliyun_adaptive15_quality_dashboard_patch.py
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: zl-alibaba-prediction-singlehost
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Validate the dashboard patch program
        run: python -m py_compile prediction-bot-v1/aliyun_adaptive15_quality_dashboard_patch.py
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Update only panel text under owner follow OFF guard
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python prediction-bot-v1/aliyun_adaptive15_quality_dashboard_patch.py
