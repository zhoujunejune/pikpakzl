name: Prediction source diagnostic syntax
on:
  push:
    branches: [fix/prediction-official-source-diagnostic-20261016]
  pull_request:
    paths:
      - fast-signal-engine/index.mjs
      - .github/workflows/prediction-source-diagnostic-checks.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check fast-signal-engine/index.mjs
      - run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const src=fs.readFileSync('fast-signal-engine/index.mjs','utf8');
          assert.match(src,/\/api\/official-settlement-source-diagnostic/);
          assert.match(src,/credentialsConfigured:Boolean/);
          assert.match(src,/signedPredictionGet\('\/sapi\/v1\/w3w\/wallet\/prediction\/market\/list'/);
          assert.match(src,/predictionMarketTopicId/);
          console.log('Read-only diagnostics parser and routing verified');
          NODE
