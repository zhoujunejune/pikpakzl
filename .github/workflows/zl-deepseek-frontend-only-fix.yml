name: Fix production DeepSeek frontend stats only (no trade logic changes)
on:
  push:
    branches: [feature/zl-futures-bot-v1]
    paths: [.github/workflows/zl-deepseek-frontend-only-fix.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zl-alibaba-prediction-singlehost
  cancel-in-progress: false
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Check only frontend patch syntax
        run: python -m py_compile prediction-bot-v1/aliyun_deepseek_frontend_fix.py
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Inspect installed UI, service, and DeepSeek history without edits
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          DEEPSEEK_UI_PREVIEW: '1'
        run: python prediction-bot-v1/aliyun_deepseek_frontend_fix.py
      - name: Deploy corrected DeepSeek frontend module (back up first)
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          DEEPSEEK_UI_PREVIEW: '0'
        run: python prediction-bot-v1/aliyun_deepseek_frontend_fix.py
      - name: Verify live password-protected production frontend not old stats
        env:
          ZL_PANEL_PASSWORD: ${{ secrets.ZL_PANEL_PASSWORD }}
        run: |
          python - <<'PY'
          import urllib.request,base64,json,os,time,re
          base='https://prediction.47-237-188-69.sslip.io'
          key=base64.b64encode(('zl:'+os.environ['ZL_PANEL_PASSWORD']).encode()).decode()
          def get(p):
           req=urllib.request.Request(base+p,headers={'Authorization':'Basic '+key,'Cache-Control':'no-store'})
           for attempt in range(12):
            try:
             with urllib.request.urlopen(req,timeout=15) as r:return r.read(320000).decode('utf-8','replace')
            except Exception:
             if attempt==11:raise
             time.sleep(3)
          html=get('/')
          assert 'DeepSeek 每轮预测与官方结算 · 独立统计' in html
          assert "async function renderDeepSeekRoundStats()" in html
          assert '/deepseek/api/history' in html
          match=re.search(r'<div class="c" id="roundStatsCard">(.+?)</div>;?',html,re.S)
          assert match and 'Selective V2（30秒）' not in match.group(1)
          chooser=json.loads(get('/api/order-signal-model'))
          assert chooser.get('model')=='DEEPSEEK_5M_V1'
          ledger=json.loads(get('/deepseek/api/history?limit=5'))
          assert ledger.get('ok') is True and ledger.get('model')=='DEEPSEEK_5M_V1'
          print('FRONTEND_LIVE_DEEPSEEK_ONLY_RENDERER=true')
          print('FRONTEND_LIVE_LEGACY_STATS_HIDDEN=true')
          print('FRONTEND_LIVE_PRODUCTION_MODEL',chooser['model'])
          print('FRONTEND_LIVE_DEEPSEEK_HISTORY_RECORDS',len(ledger.get('records',[])))
          print('FRONTEND_LIVE_BINANCE_ORDER_LOGIC_UNCHANGED=true')
          PY
