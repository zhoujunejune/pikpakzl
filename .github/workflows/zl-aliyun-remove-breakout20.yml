name: Remove Breakout20 standalone dashboard and backend
on:
  push:
    branches: [feature/zl-futures-bot-v1]
    paths:
      - 'prediction-bot-v1/aliyun_remove_breakout20.py'
      - '.github/workflows/zl-aliyun-remove-breakout20.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zl-alibaba-prediction-singlehost
  cancel-in-progress: false
jobs:
  remove-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify deployment syntax
        run: python -m py_compile prediction-bot-v1/aliyun_remove_breakout20.py
      - name: Install Alibaba SDK
        run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Delete UI module and retired API, preserve other live systems
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python prediction-bot-v1/aliyun_remove_breakout20.py
      - name: Verify authenticated public page and retired backend route
        env:
          ZL_PANEL_PASSWORD: ${{ secrets.ZL_PANEL_PASSWORD }}
        run: |
          python - <<'PY'
          import base64,os,urllib.request,urllib.error,json
          base='https://prediction.47-237-188-69.sslip.io'
          authorization='Basic '+base64.b64encode(('zl:'+os.environ['ZL_PANEL_PASSWORD']).encode()).decode()
          def get(path):
              req=urllib.request.Request(base+path,headers={'Authorization':authorization,'Cache-Control':'no-cache'})
              try:
                  with urllib.request.urlopen(req,timeout=22) as r:return r.status,r.read(300000)
              except urllib.error.HTTPError as e:return e.code,e.read(3000)
          code,data=get('/')
          print('BREAKOUT_REMOVAL_HTTPS_HOME',code,'bytes',len(data))
          assert code==200 and b'<html' in data.lower()
          assert b'breakout20ShadowCard' not in data
          assert b'b20SelectedModel' not in data
          obsolete,_=get('/api/shadow-breakout20/status')
          print('BREAKOUT_REMOVAL_OLD_BACKEND',obsolete)
          assert obsolete in (404,410)
          for path in ('/api/round-stats',
                       '/api/postflip-official-stats?model=BREAKOUT20_RSI_MACD_RANGE_V1',
                       '/api/shadow-breakout20/edge-5m',
                       '/api/shadow-breakout20/dynamic-entry',
                       '/api-keys/'):
              status,payload=get(path)
              print('BREAKOUT_REMOVAL_PRESERVED',path.split('?')[0],status)
              assert status==200
          print('BREAKOUT_REMOVAL_PUBLIC_VERIFIED=true')
          PY
