name: Dual bot code and runtime read-only inspection
on:
  push:
    branches: [feature/zl-futures-bot-v1]
    paths: ['.github/workflows/zl-dual-strategy-code-audit.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Inspect dual files and safe code context only
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          python - <<'PY'
          import base64,os,time
          from alibabacloud_swas_open20200601.client import Client
          from alibabacloud_swas_open20200601 import models as sw
          from alibabacloud_tea_openapi import models as api
          script=r"""#!/bin/bash
          set -Eeuo pipefail
          python3 - <<'SCAN'
          from pathlib import Path
          from urllib.request import urlopen
          import re,json,datetime,subprocess
          root=Path('/opt/zl-prediction-dual5')
          print('ROOT_EXISTS',root.is_dir())
          for p in sorted(root.iterdir()):
              if p.is_file():print('FILE',p.name,p.stat().st_size)
          print('SERVICE_STATE',subprocess.run(['systemctl','is-active','zl-prediction-dual5'],capture_output=True,text=True).stdout.strip())
          print('SERVICE_PORTS_BEGIN')
          try:
              z=subprocess.check_output(['ss','-ltnp'],text=True)
              for x in z.splitlines():
                  if any(v in x for v in ['node','python']) and '127.0.0.1:' in x:print('PORT',re.sub(r'pid=\d+','pid=?',x[:180]))
          except Exception as e:print('PORT_ERROR',type(e).__name__)
          print('SERVICE_PORTS_END')
          for filename in ('binance_dual5_pairs.mjs','binance_dual5_dashboard.html'):
              p=root/filename
              if not p.is_file():continue
              lines=p.read_text(encoding='utf8',errors='replace').splitlines()
              print('CODE_BEGIN',filename,'LINES',len(lines))
              tokens=r'function |async |class |app\.|createServer|listen\(|/api/|fetch\(|signedPost|place-order|order-book|orderbook|cancel|openOrders|maker|taker|market|limit|timeInForce|quote|pair|risk|stop|profit|position|inventory|balance|payout|PRICE|fee|source|settle|client|retry|lock|cooldown|module.exports|export '
              marked=[i for i,s in enumerate(lines) if re.search(tokens,s,re.I)]
              selection=set()
              for i in marked[:160]:
                  for j in range(max(0,i-2),min(len(lines),i+4)):selection.add(j)
              # beginning of each file for imports and high-level architecture
              selection.update(range(min(100,len(lines))))
              # Avoid secrets and personal auth material in public CI logs
              for j in sorted(selection)[:530]:
                  s=lines[j]
                  if re.search(r'api.?key|secret|password|private.?key|Authorization|Bearer|signature|process\.env|mnemonic|seedPhrase|walletAddress|walletId',s,re.I):s='[CONFIG_OR_AUTH_LINE_REDACTED]'
                  s=re.sub(r'(["\x27])[A-Za-z0-9_+/=\-]{40,}\1','[LONG_STRING_REDACTED]',s)
                  print('CODE',filename,j+1,s[:215])
              print('CODE_END',filename)
          for port in (13044,13045,13046,13047,13048):
              for urlpath in ('/healthz','/api/status'):
                  try:
                      with urlopen(f'http://127.0.0.1:{port}{urlpath}',timeout=2) as r:
                          value=json.load(r)
                      if isinstance(value,dict):
                          safe={k:value.get(k) for k in ('ok','mode','enabled','state','engineStatus','isTrading','engineRunning','tradingEnabled','version','error','lastError') if k in value}
                          print('HTTP',port,urlpath,json.dumps(safe,ensure_ascii=False)[:330])
                  except Exception as exc:print('HTTP_UNAVAILABLE',port,urlpath,type(exc).__name__)
          print('READ_ONLY_AUDIT_END')
          SCAN
          """
          c=Client(api.Config(access_key_id=os.environ['ALIBABA_CLOUD_ACCESS_KEY_ID'],access_key_secret=os.environ['ALIBABA_CLOUD_ACCESS_KEY_SECRET'],endpoint='swas.ap-southeast-1.aliyuncs.com',region_id='ap-southeast-1'))
          r=c.run_command(sw.RunCommandRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',name='zl-dual-code-readonly',type='RunShellScript',command_content=script,working_user='root',timeout=95))
          for _ in range(38):
              time.sleep(2)
              x=c.describe_invocation_result(sw.DescribeInvocationResultRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',invoke_id=r.body.invoke_id)).body.invocation_result
              if x and str(x.invocation_status) in ('Success','Failed','Aborted','ExecutionTimeout','ClientNotRunning'):
                  try:out=base64.b64decode(x.output or '',validate=True).decode('utf8','replace')
                  except:out='NO_OUTPUT'
                  print('REMOTE_STATUS',x.invocation_status,'EXIT',x.exit_code)
                  print(out[-56000:])
                  raise SystemExit(0 if str(x.invocation_status)=='Success' and int(x.exit_code)==0 else 3)
          raise SystemExit('REMOTE_PENDING')
          PY
