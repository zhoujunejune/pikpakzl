name: Deploy DeepSeek 15s two-pass adaptive learning provider - FOLLOW OFF ONLY
on:
  push:
    branches: [feat/deepseek-adaptive15-experience-20261021]
    paths:
      - .github/workflows/zl-deepseek-adaptive15-deploy.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zl-alibaba-prediction-singlehost
  cancel-in-progress: false
jobs:
  guarded-cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Check syntax, model review, WAIT, learning and production compatibility first
        run: |
          python -m py_compile prediction-bot-v1/aliyun_adaptive15_followoff_cutover.py
          node --check prediction-bot-v1/deepseek-adaptive15-core.mjs
          node --check prediction-bot-v1/deepseek-adaptive15-runner.mjs
          node --check prediction-bot-v1/deepseek-adaptive15-production-adapter.mjs
          node --test prediction-bot-v1/deepseek-adaptive15-core.test.mjs
          node --test prediction-bot-v1/deepseek-adaptive15-runner.test.mjs
          node --test prediction-bot-v1/deepseek-adaptive15-production-adapter.test.mjs
      - name: Install ephemeral Alibaba client
        run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Switch ONLY DeepSeek provider, guarded by OFF follow, with backup and rollback
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python prediction-bot-v1/aliyun_adaptive15_followoff_cutover.py
