name: Read-only current prediction win rate and TP SL pricing audit
on:
  push:
    branches: [audit/current-tpsl-winrate-20261023]
    paths:
      - .github/workflows/zl-current-tpsl-winrate.yml
      - prediction-bot-v1/audit_current_tpsl_winrate_20261023.py
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Validate audit is read-only and syntax correct
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast,subprocess
          m=ast.parse(Path('prediction-bot-v1/audit_current_tpsl_winrate_20261023.py').read_text())
          sh=next(x.value.value for x in m.body if isinstance(x,ast.Assign)
            and any(isinstance(t,ast.Name) and t.id=='REMOTE' for t in x.targets))
          assert subprocess.run(['bash','-n'],input=sh,text=True).returncode==0
          start=sh.index("python3 - <<'PY'")+len("python3 - <<'PY'")
          end=sh.index("\nPY",start)
          compile(sh[start:end],'<read only audit>','exec')
          assert 'systemctl restart ' not in sh
          assert 'place-order-bundle' not in sh
          print('TPWIN_READ_ONLY_VALID=true')
          PY
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Read official predictions and aggregate recent risk exits on Alibaba
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python prediction-bot-v1/audit_current_tpsl_winrate_20261023.py
