name: Inspect true Alibaba prediction frontend service (read only)
on:
  push:
    branches: [feature/zl-futures-bot-v1]
    paths: [.github/workflows/zl-deepseek-frontend-process-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Read-only live frontend processes and port rendering
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          DEEPSEEK_UI_PREVIEW: '1'
        run: python prediction-bot-v1/aliyun_deepseek_frontend_fix.py
