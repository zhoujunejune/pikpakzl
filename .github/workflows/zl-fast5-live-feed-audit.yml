name: Inspect fastest prediction signal production schema read only
on:
  push:
    branches: [feat/deepseek40-45s-ai-only-prod-20261025]
    paths: [.github/workflows/zl-fast5-live-feed-audit.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Read-only exact Binance BTC feed schema, current model and service health
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          python - <<'OUTER'
          import os,time,base64
          from alibabacloud_swas_open20200601.client import Client
          from alibabacloud_swas_open20200601 import models as sw
          from alibabacloud_tea_openapi import models as api
          sh=r"""#!/bin/bash
          set -eu
          python3 - <<'INNER'
          import json,time,urllib.request,subprocess
          def read(port,route):
           try:
            with urllib.request.urlopen(f'http://127.0.0.1:{port}{route}',timeout=6) as r:return json.load(r)
           except Exception as e:return {'error':type(e).__name__}
          n=int(time.time()*1000);r=n//300000*300000
          x=read(13003,'/api/shadow-market-data')
          tr=read(13001,'/api/status')
          sel=read(13001,'/api/order-signal-model')
          d=read(13029,'/api/status')
          prod=read(13002,'/api/production-signal')
          print('FAST5_LIVE_NOW',json.dumps({'elapsedMs':n-r,'marketOK':x.get('ok'),'marketAgeMs':x.get('ageMs'),'feedConnected':x.get('feedConnected'),'selectedModel':tr.get('orderSignalModel'),'follow':tr.get('enabled'),'selector':sel.get('model'),'selectorReady':sel.get('ready'),'selectorModelIds':[z.get('id') for z in sel.get('models',[]) if isinstance(z,dict)],'deepseekConfigured':d.get('configured'),'productionV2Model':prod.get('model')}))
          print('FAST5_FEED_KEYS',sorted(x.keys()))
          for k,v in x.items():
           if isinstance(v,dict):
            print('FAST5_FIELD',k,'dict',sorted(v.keys())[:30])
            if k.lower() in ('latest','market','ticker'):
             for sk,sv in v.items():
              if isinstance(sv,(str,int,float,bool,type(None))) and not any(t in sk.lower() for t in ('token','key','secret','auth')):print('FAST5_SCALAR',k,sk,str(sv)[:70])
           elif isinstance(v,list):
            print('FAST5_FIELD',k,'list length',len(v),'first_type',type(v[0]).__name__ if v else None,'first_keys',sorted(v[0].keys())[:30] if v and isinstance(v[0],dict) else [])
           elif isinstance(v,(str,int,float,bool,type(None))) and not any(t in k.lower() for t in ('token','key','secret','auth')):print('FAST5_TOP',k,str(v)[:80])
          for k in ('candles','klines','bars','features','marketFeatures'):
           a=x.get(k)
           if isinstance(a,dict):
            for timeframe,series in a.items():
             print('FAST5_CANDLES',k,timeframe,'type',type(series).__name__,'keys',list(series.keys())[:12] if isinstance(series,dict) else [],'rows_len',len(series.get('rows') or []) if isinstance(series,dict) else len(series) if isinstance(series,list) else 0)
             rows=series.get('rows') if isinstance(series,dict) else series
             if isinstance(rows,list) and rows and isinstance(rows[-1],dict):
              print('FAST5_CANDLE_SAMPLE',timeframe,json.dumps(rows[-1],ensure_ascii=False)[:800])
          for u in ['zl-prediction-trade','zl-prediction-v2','zl-prediction-v3','zl-prediction-deepseek5','zl-prediction-official-reference']:
           print('FAST5_UNIT',u,subprocess.run(['systemctl','is-active',u],capture_output=True,text=True).stdout.strip())
          print('FAST5_READ_ONLY_AUDIT_DONE=true')
          INNER
          """
          c=Client(api.Config(access_key_id=os.environ['ALIBABA_CLOUD_ACCESS_KEY_ID'],access_key_secret=os.environ['ALIBABA_CLOUD_ACCESS_KEY_SECRET'],region_id='ap-southeast-1',endpoint='swas.ap-southeast-1.aliyuncs.com'))
          id=c.run_command(sw.RunCommandRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',name='fast5-production-readonly-structure-audit',type='RunShellScript',working_user='root',command_content=sh,timeout=95)).body.invoke_id
          for _ in range(60):
           time.sleep(2)
           result=c.describe_invocation_result(sw.DescribeInvocationResultRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',invoke_id=id)).body.invocation_result
           if result and str(result.invocation_status) in ('Success','Failed','Aborted','ExecutionTimeout','ExitCodeNonzero'):
            print('FAST5_REMOTE_STATUS',result.invocation_status,'EXIT',result.exit_code)
            print(base64.b64decode(result.output or '',validate=True).decode('utf8','replace')[-11000:])
            if int(result.exit_code)!=0:raise RuntimeError('FAST5_AUDIT_FAILED')
            break
          else:raise RuntimeError('FAST5_AUDIT_TIMEOUT')
          OUTER
