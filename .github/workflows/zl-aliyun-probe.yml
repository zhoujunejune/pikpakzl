name: Alibaba SWAS safe command probe
# Verify read-only USDT/USDC wallet cards without logging any account amounts.
on:
  push:
    branches: [feature/zl-futures-bot-v1]
    paths:
      - '.github/workflows/zl-aliyun-probe.yml'
      - 'futures-bot-v1/aliyun_probe.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zl-aliyun-cloudassistant-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official Alibaba SWAS API client
        run: python -m pip install --disable-pip-version-check alibabacloud_swas_open20200601==4.0.0
      - name: Safe OS and Cloud Assistant probe (no trading)
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python futures-bot-v1/aliyun_probe.py
