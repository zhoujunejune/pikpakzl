name: EDGE5 live read-only smoke
on:
  pull_request:
    branches: [cloudflare-edge5m-20261017]
    paths: ['.github/workflows/edge5-live-readonly-smoke.yml']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify deployed Cloudflare Worker and record visible status
        run: |
          node --input-type=module <<'NODE'
          const base='https://edge-5m-v1.zl528094-3ba.workers.dev';
          const workerCode=await fetch('https://api.cloudflare.com/client/v4/accounts/3ba148af3f98117d6b299158e20bf687/workers/scripts/edge-5m-v1',{
            headers:{Authorization:'Bearer '+process.env.CF_TOKEN},
            signal:AbortSignal.timeout(12000)});
          const current=await workerCode.text();
          const bybitFresh=current.includes('BYBIT_FRESH_TRADES_UNAVAILABLE_');
          const hasRender2=current.includes('zl-signal-v2-migration.onrender.com/api/round-stats');
          const hasRender3=current.includes('zl-signal-v3-migration.onrender.com/api/shadow-market-data');
          console.log('CLOUDFLARE_DIRECT_API_AUDIT',JSON.stringify({status:workerCode.status,
            bybitFresh,hasRender2,hasRender3,codeLength:current.length}));
          if(workerCode.status!==200||!bybitFresh||!hasRender2||!hasRender3)
            throw Error('CLOUDFLARE_DEPLOYED_WORKER_SOURCE_NOT_UPDATED');
          let checked=null;
          for(let i=0;i<8;i++){
            try{
              const r=await fetch(base+'/status',{signal:AbortSignal.timeout(10000),cache:'no-store'});
              const d=await r.json();
              checked={status:r.status,model:d.model,training:d.training,
                health:d.health,timed:d.timed,results:d.results,
                latest:d.latest?{round:d.latest.round,direction:d.latest.direction,
                  executionEligible:d.latest.executionEligible}:null};
              console.log('EDGE5 status probe:',JSON.stringify(checked).slice(0,4200));
              if(r.status===200&&d.training?.signalIndependentOfCalibration===true&&
                d.health?.officialOrigin==='https://zl-signal-v2-migration.onrender.com/api/round-stats'&&
                d.health?.marketOrigin==='https://zl-signal-v3-migration.onrender.com/api/shadow-market-data'){
                const m=await fetch(base+'/market-check',{signal:AbortSignal.timeout(13000)});
                console.log('EDGE5 market-check:',m.status,(await m.text()).slice(0,1200));
                process.exit(0);
              }
            }catch(e){console.log('EDGE5 error:',String(e).slice(0,200))}
            await new Promise(r=>setTimeout(r,8000));
          }
          throw Error('DEPLOYED_EDGE5_NEW_VERSION_NOT_VERIFIED');
          NODE
