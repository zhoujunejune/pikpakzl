name: Apply strict 15-second WAIT to DeepSeek production, trader and dashboard
on:
  push:
    branches: [fix/adaptive15-hard-deadline-wait-20261021]
    paths: [.github/workflows/zl-adaptive15-hardwait-production-fix.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: zl-alibaba-prediction-singlehost
  cancel-in-progress: false
jobs:
  protected-update:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Strict 15-second lock/WAIT regression and patch syntax
        run: |
          python -m py_compile prediction-bot-v1/aliyun_adaptive15_hardwait_cutover.py
          node --test prediction-bot-v1/deepseek-adaptive15-core.test.mjs
          node --test prediction-bot-v1/deepseek-adaptive15-runner.test.mjs
          node --test prediction-bot-v1/deepseek-adaptive15-production-adapter.test.mjs
          node --test prediction-bot-v1/deepseek-adaptive15-hard-deadline.test.mjs
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Fail closed when follow ON, preserve history, modify only five files with rollback
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python prediction-bot-v1/aliyun_adaptive15_hardwait_cutover.py
