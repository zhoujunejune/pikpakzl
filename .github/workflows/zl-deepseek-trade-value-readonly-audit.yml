name: Inspect DeepSeek production order-value decision without modifying trades
on:
  push:
    branches: [feat/deepseek-live-trade-value-20261021]
    paths:
      - .github/workflows/zl-deepseek-trade-value-readonly-audit.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    # Verify effective production model-to-gate mapping after live release.
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Read production signal, quote and decision points
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python prediction-bot-v1/deepseek_live_ev_audit.py
