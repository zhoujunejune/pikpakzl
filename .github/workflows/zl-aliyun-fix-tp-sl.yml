name: Repair prediction TP and SL persistence and old PIN mode on Alibaba
on:
  push:
    branches: [feature/zl-futures-bot-v1]
    paths:
      - 'prediction-bot-v1/aliyun_fix_risk_controls.sh'
      - 'prediction-bot-v1/aliyun_fix_risk_controls.py'
      - '.github/workflows/zl-aliyun-fix-tp-sl.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zl-alibaba-prediction-singlehost
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify deployment script syntax
        run: |
          bash -n prediction-bot-v1/aliyun_fix_risk_controls.sh
          python -m py_compile prediction-bot-v1/aliyun_fix_risk_controls.py
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Deploy TP SL Redis restoration and isolated idle monitor
        env:
          ALIBABA_CLOUD_ACCESS${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}ID: _KEY_
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python prediction-bot-v1/aliyun_fix_risk_controls.py
      - name: Verify authenticated HTTPS save and open/close API with safe no-op settings
        env:
          ZL_PANEL_PASSWORD: ${{ secrets.ZL_PANEL_PASSWORD }}
        run: |
          python - <<'PY'
          import json,base64,os,urllib.request
          base='https://prediction.47-237-188-69.sslip.io'
          auth='Basic '+base64.b64encode(('zl:'+os.environ['ZL_PANEL_PASSWORD']).encode()).decode()
          def get(path):
           q=urllib.request.Request(base+path,headers={'Authorization':auth,'Cache-Control':'no-store'})
           with urllib.request.urlopen(q,timeout=20) as r:return json.load(r)
          def save(data):
           req=urllib.request.Request(base+'/api/risk-control',data=json.dumps(data).encode(),method='POST',
             headers={'Authorization':auth,'Origin':base,'Sec-Fetch-Site':'same-origin','Content-Type':'application/json'})
           with urllib.request.urlopen(req,timeout=20) as r:return json.load(r)
          initial=get('/api/risk-control')
          assert initial['ok'] and initial['persistenceReady'] and initial['persistenceHealthy']
          assert initial['source']=='redis'
          assert initial['execution']['ready'] is True
          assert initial['execution']['enabled'] is False
          assert initial['takeProfitEnabled'] is False and initial['stopLossEnabled'] is False
          print('RISK_PUBLIC_REDIS_RESTORED=true')
          for field in ('takeProfitPercent','stopLossPercent','takeProfitEnabled','stopLossEnabled'):
           value=initial[field]
           after=save({field:value})
           assert after.get('ok') is True
           assert after[field]==value
           assert after['takeProfitEnabled'] is False and after['stopLossEnabled'] is False
           print('RISK_PUBLIC_SAVE_IDEMPOTENT',field,'ok')
          current=get('/api/risk-control')
          assert current['persistenceHealthy'] and current['source']=='redis'
          assert current['takeProfitEnabled'] is False and current['stopLossEnabled'] is False
          assert current['execution']['ready'] is True
          print('RISK_PUBLIC_AUTH_SAVE_AND_RELOAD_OK=true')
          q=urllib.request.Request(base+'/',headers={'Authorization':auth,'Cache-Control':'no-cache'})
          with urllib.request.urlopen(q,timeout=20) as r:page=r.read(500000).decode('utf8','replace')
          assert 'PIN控制 · 自动跟随' not in page
          assert '网页登录 · 自动跟随' in page
          assert '自动止盈止损' in page
          assert 'id="riskControlsCard"' in page
          print('RISK_PUBLIC_LOGIN_MODE_AND_TP_SL_UI_FIXED=true')
          PY
