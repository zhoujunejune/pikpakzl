name: Deploy standalone five-second round timeline to Alibaba production
on:
  push:
    branches: [feat/deepseek5-round-results-panel-20261022]
    paths: [.github/workflows/zl-round-results-production.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: zl-alibaba-prediction-singlehost
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: node --test prediction-bot-v1/fast5-backend-smoke.test.mjs prediction-bot-v1/round-results-only.test.mjs
      - run: |
          python prediction-bot-v1/patch_fast5_panel.py railway-diagnostic/panel-stats-shell.mjs /tmp/fast5.mjs
          python prediction-bot-v1/patch_round_results_panel.py /tmp/fast5.mjs /tmp/display.mjs
          node --check /tmp/display.mjs
          node --check prediction-bot-v1/deepseek-single5-production.mjs
          node --check prediction-bot-v1/round-results-only-journal.mjs
          python -m py_compile prediction-bot-v1/round_results_aliyun_release.py
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Publish verified production round timeline without enabling follow
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python prediction-bot-v1/round_results_aliyun_release.py
