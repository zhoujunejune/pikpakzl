name: Audit legacy signal models and stored data on Alibaba
on:
  push:
    branches: [feature/zl-futures-bot-v1]
    paths: ['prediction-bot-v1/audit_model_cleanup.sh','prediction-bot-v1/audit_model_cleanup.py','.github/workflows/zl-audit-model-cleanup.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Inspect only statistical model storage (no API secrets)
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python prediction-bot-v1/audit_model_cleanup.py
