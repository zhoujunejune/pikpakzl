name: EVENT10 V19 non-trading alert watch and receipt CI
on:
  push:
    branches: [feature/zl-futures-bot-v1]
    paths: ['.github/workflows/event10-alert-v133-ci.yml','event10-bot/server.mjs','event10-bot/alert-watch.test.mjs','android-app/app/src/main/java/com/zlcontrol/android/SignalAlertService.java']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Verify 18s long-poll, real server receipt, zero trading side effects
        run: |
          node --check event10-bot/server.mjs
          node --check event10-bot/alert-watch.test.mjs
          node --test event10-bot/alert-watch.test.mjs
          node --test event10-bot/selective-trend.test.mjs
          mkdir -p "$RUNNER_TEMP/haipai-alert-test"
          javac -d "$RUNNER_TEMP/haipai-alert-test" \
            android-app/app/src/main/java/com/zlcontrol/android/AlertDirectionPolicy.java \
            android-app/app/src/main/java/com/zlcontrol/android/SignalAlarmPolicy.java \
            android-app/tests/AlertDirectionPolicySmoke.java \
            android-app/tests/SignalAlarmPolicySmoke.java
          java -cp "$RUNNER_TEMP/haipai-alert-test" com.zlcontrol.android.AlertDirectionPolicySmoke
          java -cp "$RUNNER_TEMP/haipai-alert-test" com.zlcontrol.android.SignalAlarmPolicySmoke
          python3 - <<'PY'
          from pathlib import Path
          server=Path('event10-bot/server.mjs').read_text()
          app=Path('android-app/app/src/main/java/com/zlcontrol/android/SignalAlertService.java').read_text()
          assert '"/api/watch"' in server and '"/api/alert-receipt"' in server
          assert 'RECEIPT_MAX_BYTES=2_000_000' in server
          assert 'SIGNAL_WATCH_URL' in app and 'SIGNAL_RECEIPT_URL' in app
          assert 'PREF_HANDLED_IDS,new HashSet<>(processed)' in app
          assert 'NOTIFICATION_POSTED_ALARM_STARTED' in app
          assert 'zl_event10_alarm_v3_silent_notice' in app
          assert 'NO_EVENT_CONTRACT_ORDER_API' in server
          assert 'EVENT10_PURE_RULE_V19_20261107' in Path('event10-bot/pure-signal.mjs').read_text()
          assert 'reviewAiDirection(' not in Path('event10-bot/manual-engine.mjs').read_text()
          print('ALERT_V133_NONDUPLICATE_LONGPOLL_ACK_PASS=true')
          PY
