name: Deploy autonomous DeepSeek Flash with 25s deadline on Alibaba, follow OFF
on:
  push:
    branches: [fix/deepseek25-autonomous-20261021]
    paths:
      - .github/workflows/zl-deepseek25-autonomous-production.yml
      - prediction-bot-v1/aliyun_deepseek25_autonomous_deploy.py
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: zl-alibaba-prediction-singlehost
  cancel-in-progress: false
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Preflight code syntax, model freedom, causal live review, settlement checks, deadline
        run: |
          python -m py_compile prediction-bot-v1/aliyun_deepseek25_autonomous_deploy.py
          node --check prediction-bot-v1/deepseek-adaptive15-core.mjs
          node --check prediction-bot-v1/deepseek-adaptive15-runner.mjs
          node --check prediction-bot-v1/deepseek-adaptive15-production-adapter.mjs
          node --check prediction-bot-v1/deepseek-adaptive15-quality-store.mjs
          node --check prediction-bot-v1/deepseek-adaptive15-error-attribution.mjs
          node --test prediction-bot-v1/deepseek-autonomous25.test.mjs
  cutover:
    needs: [safety]
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install Alibaba SDK
        run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Guarded Alibaba cutover only if follow OFF, with backup and verification
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python prediction-bot-v1/aliyun_deepseek25_autonomous_deploy.py
