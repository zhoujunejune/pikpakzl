name: Safely deploy DeepSeek provisional WAIT, official mistake learning and profit quality audit
on:
  push:
    branches: [feat/adaptive15-deferred-wait-learning-pnl-20261021]
    paths:
      - .github/workflows/zl-adaptive15-deferredwait-quality-deploy.yml
      - prediction-bot-v1/aliyun_adaptive15_deferredwait_quality_deploy.py
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: zl-alibaba-prediction-singlehost
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Test prior contracts, mutable WAIT, settlement mistake store and unknown profits
        run: |
          python -m py_compile prediction-bot-v1/aliyun_adaptive15_deferredwait_quality_deploy.py
          node --test prediction-bot-v1/deepseek-adaptive15-core.test.mjs
          node --test prediction-bot-v1/deepseek-adaptive15-runner.test.mjs
          node --test prediction-bot-v1/deepseek-adaptive15-production-adapter.test.mjs
          node --test prediction-bot-v1/deepseek-adaptive15-hard-deadline.test.mjs
          node --test prediction-bot-v1/deepseek-adaptive15-improvements.test.mjs
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Patch Alibaba DeepSeek source only when follow OFF and current hashes match
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python prediction-bot-v1/aliyun_adaptive15_deferredwait_quality_deploy.py
