name: Release FAST5 atomic forward/inverse order direction controls
on:
  push:
    branches: [feat/deepseek40-45s-ai-only-prod-20261025]
    paths: [.github/workflows/zl-fast5-direction-ui-release.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: zl-alibaba-prediction-singlehost
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Ensure frontend switch and guarded deploy are valid
        run: |
          node --check prediction-bot-v1/fast5-dashboard-inject.mjs
          node --test prediction-bot-v1/fast5-dashboard-inject.test.mjs prediction-bot-v1/fast5-direction-ui.test.mjs
          python -m py_compile prediction-bot-v1/aliyun_fast5_direction_toggle_deploy.py
  deploy:
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Install authenticated FAST5 atomic direction mode on Alibaba Cloud
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          python - <<'OUTER'
          import base64,os,time
          from alibabacloud_swas_open20200601.client import Client
          from alibabacloud_swas_open20200601 import models as sw
          from alibabacloud_tea_openapi import models as api
          sha=os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_REF_NAME']=='feat/deepseek40-45s-ai-only-prod-20261025'
          sh="""#!/bin/bash
          set -Eeuo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL --retry 2 --max-time 35 "https://raw.githubusercontent.com/zhoujunejune/pikpakzl/COMMIT_SHA/prediction-bot-v1/aliyun_fast5_direction_toggle_deploy.py" -o "$tmp/release.py"
          python3 -m py_compile "$tmp/release.py"
          python3 "$tmp/release.py" COMMIT_SHA
          """.replace('COMMIT_SHA',sha)
          c=Client(api.Config(access_key_id=os.environ['ALIBABA_CLOUD_ACCESS_KEY_ID'],access_key_secret=os.environ['ALIBABA_CLOUD_ACCESS_KEY_SECRET'],region_id='ap-southeast-1',endpoint='swas.ap-southeast-1.aliyuncs.com'))
          inv=c.run_command(sw.RunCommandRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',name='zl-fast5-forward-inverse-ui-switch',type='RunShellScript',working_user='root',command_content=sh,timeout=225)).body.invoke_id
          for _ in range(117):
           time.sleep(2)
           res=c.describe_invocation_result(sw.DescribeInvocationResultRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',invoke_id=inv)).body.invocation_result
           if res and str(res.invocation_status) in ('Success','Failed','Aborted','ExecutionTimeout','ExitCodeNonzero'):
            print('FAST5_DIRECTION_REMOTE',res.invocation_status,'EXIT',res.exit_code)
            try:print(base64.b64decode(res.output or '',validate=True).decode('utf8','replace')[-12500:])
            except Exception:print('REMOTE_OUTPUT_DECODE_FAILED')
            if res.invocation_status!='Success' or int(res.exit_code)!=0:raise RuntimeError('FAST5_DIRECTION_RELEASE_FAILED')
            break
          else:raise RuntimeError('FAST5_DIRECTION_RELEASE_TIMEOUT')
          OUTER
  verify:
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify public switch, live FAST5 direction settings and retained winrate ledger
        env:
          ZL_PANEL_PASSWORD: ${{ secrets.ZL_PANEL_PASSWORD }}
        run: |
          python - <<'PY'
          import os,json,base64,urllib.request
          url='https://prediction.47-237-188-69.sslip.io'
          auth='Basic '+base64.b64encode(('zl:'+os.environ['ZL_PANEL_PASSWORD']).encode()).decode()
          def get(p):
           req=urllib.request.Request(url+p,headers={'Authorization':auth,'Cache-Control':'no-store'})
           with urllib.request.urlopen(req,timeout=18) as r:return r.status,r.read(1000000)
          status,body=get('/')
          html=body.decode('utf8','replace')
          assert status==200 and 'id="zlF5Forward"' in html and 'id="zlF5Inverse"' in html
          assert '/api/fast5-direction-mode' in html and '/api/fast5-round-stats' in html
          status,body=get('/api/direction-mode')
          state=json.loads(body)
          assert status==200 and state.get('ready') is True
          modes=state.get('modes',{}).get('FAST5_SPOT_MOMENTUM_V1')
          assert modes is not None and modes.get('UP') in ('FORWARD','INVERSE','OFF')
          assert modes.get('DOWN') in ('FORWARD','INVERSE','OFF')
          status,body=get('/api/status')
          trade=json.loads(body)
          assert status==200 and trade.get('enabled') is False and trade.get('orderSignalModel')=='FAST5_SPOT_MOMENTUM_V1'
          status,body=get('/api/fast5-round-stats')
          ledger=json.loads(body)
          assert status==200 and ledger.get('schema')=='FAST5_INDEPENDENT_OFFICIAL_ROUND_LEDGER_V1'
          status,body=get('/api/fast5-live-status')
          s=json.loads(body)
          assert s.get('strategyVersion')=='FAST5_PREWARM120_5S_V4'
          print('FAST5_DIRECTION_FRONTEND_VERIFIED=true')
          print('FAST5_DIRECTION_REDIS_STATE_VERIFIED=true')
          print('FAST5_DIRECTION_CURRENT_MODES',json.dumps(modes))
          print('FAST5_DIRECTION_STATISTICS_PRESERVED=true')
          print('FAST5_DIRECTION_MODEL_V4_UNCHANGED=true')
          print('FAST5_DIRECTION_AUTOFOLLOW_OFF=true')
          PY
