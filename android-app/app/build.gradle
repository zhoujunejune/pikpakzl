plugins {
    id 'com.android.application'
}

// Native updates must reuse one long-lived signing key.
// All values are provided securely by CI; never commit a keystore or credentials.
def stableStore = System.getenv('ZL_SIGNING_STORE_FILE')
def stableStorePass = System.getenv('ZL_SIGNING_STORE_PASSWORD')
def stableAlias = System.getenv('ZL_SIGNING_KEY_ALIAS')
def stableKeyPass = System.getenv('ZL_SIGNING_KEY_PASSWORD')
def canSignRelease = [stableStore, stableStorePass, stableAlias, stableKeyPass].every { it != null && !it.isEmpty() }
android {
    namespace 'com.zlcontrol.android'
    compileSdk 35
    defaultConfig {
        applicationId 'com.zlcontrol.android'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '1.2.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        if (canSignRelease) {
            stableRelease {
                storeFile file(stableStore)
                storePassword stableStorePass
                keyAlias stableAlias
                keyPassword stableKeyPass
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (canSignRelease) signingConfig signingConfigs.stableRelease
        }
    }
}
