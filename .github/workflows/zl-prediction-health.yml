name: Inspect Alibaba prediction runtime health
on:
  push:
    branches: [feature/zl-futures-bot-v1]
    paths:
      - '.github/workflows/zl-prediction-health.yml'
      - 'prediction-bot-v1/aliyun_live_health.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Read-only service health and sanitized error types
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python prediction-bot-v1/aliyun_live_health.py

      - name: Verify authenticated prediction page without old PIN
        env:
          ZL_PANEL_PASSWORD: ${{ secrets.ZL_PANEL_PASSWORD }}
        run: |
          python - <<'PY'
          import base64,os,time,urllib.request,urllib.error
          host="https://prediction.47-237-188-69.sslip.io"
          pw=os.environ["ZL_PANEL_PASSWORD"]
          header="Basic "+base64.b64encode(("zl:"+pw).encode()).decode()
          def get(path,auth):
            req=urllib.request.Request(host+path,headers={"Authorization":header} if auth else {})
            try:
              with urllib.request.urlopen(req,timeout=12) as r:
                return r.status,r.read(300000)
            except urllib.error.HTTPError as err:return err.code,b""
          for n in range(6):
            try:
              anon,_=get("/",False)
              status,html=get("/",True)
              if anon==401 and status==200:break
            except Exception:pass
            time.sleep(5)
          print("PREDICTION_PUBLIC_UNAUTH_STATUS",anon)
          print("PREDICTION_PUBLIC_AUTH_STATUS",status)
          print("PREDICTION_HAS_LEGACY_PIN_INPUT",b'id="pin" type="password"' in html)
          print("PREDICTION_UI_AUTH_PASS",anon==401 and status==200 and b'id="pin" type="hidden"' in html)
          assert anon==401 and status==200 and b'id="pin" type="hidden"' in html
          PY

      - name: Verify protected API settings entry and CSRF rejection
        env:
          ZL_PANEL_PASSWORD: ${{ secrets.ZL_PANEL_PASSWORD }}
        run: |
          python - <<'PY'
          import base64,os,json,urllib.request,urllib.error
          base="https://prediction.47-237-188-69.sslip.io"
          pw=os.environ["ZL_PANEL_PASSWORD"]
          auth="Basic "+base64.b64encode(("zl:"+pw).encode()).decode()
          def call(path,login=True,method="GET",payload=None,origin=None):
            head={"Authorization":auth} if login else {}
            if payload is not None:head["Content-Type"]="application/json"
            if origin:head["Origin"]=origin
            req=urllib.request.Request(base+path,headers=head,data=payload,method=method)
            try:
              with urllib.request.urlopen(req,timeout=14) as resp:return resp.status,resp.read(100000)
            except urllib.error.HTTPError as err:return err.code,err.read(100000)
          anonymous,_=call("/settings/",False)
          authorized,body=call("/settings/")
          status,response=call("/settings/status")
          forbidden,_=call("/settings/credentials",method="POST",payload=b"{}",origin="https://untrusted.invalid")
          j=json.loads(response) if status==200 else {}
          print("API_SETTINGS_UNAUTH_STATUS",anonymous)
          print("API_SETTINGS_AUTH_STATUS",authorized)
          print("API_SETTINGS_STATUS_CODE",status)
          print("API_SETTINGS_CONFIGURATION_EXISTS",bool(j.get("configured")))
          print("API_SETTINGS_CSRF_REJECT_STATUS",forbidden)
          assert anonymous==401 and authorized==200 and b'id="apiKey"' in body
          assert status==200 and j.get("autoTradingEnabled")==False and forbidden==403
          PY
