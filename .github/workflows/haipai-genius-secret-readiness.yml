name: Haipai Genius DeepSeek secret readiness (names only)
on:
  push:
    branches: [feature/zl-futures-bot-v1]
    paths: ['.github/workflows/haipai-genius-secret-readiness.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check GitHub secret presence without printing value
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -n "$DEEPSEEK_API_KEY" ];then
            echo HAIPAI_GITHUB_DEEPSEEK_KEY_PRESENT=true
          else
            echo HAIPAI_GITHUB_DEEPSEEK_KEY_PRESENT=false
          fi
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Read names only from existing Alibaba env file
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          python - <<'PY'
          import os,base64,time
          from alibabacloud_swas_open20200601.client import Client
          from alibabacloud_swas_open20200601 import models as sw
          from alibabacloud_tea_openapi import models as api
          cli=Client(api.Config(access_key_id=os.environ['ALIBABA_CLOUD_ACCESS_KEY_ID'],access_key_secret=os.environ['ALIBABA_CLOUD_ACCESS_KEY_SECRET'],region_id='ap-southeast-1',endpoint='swas.ap-southeast-1.aliyuncs.com'))
          script="""#!/bin/bash
          set -e
          for p in /etc/zl-event10/ai-model-flash.env /etc/haipai-genius-paper.env;do
            if [ -f "$p" ];then
              echo HAIPAI_EXISTING_ENV_FILE="$p"
              sed -n 's/^\\([A-Za-z_][A-Za-z0-9_]*\\)=.*/HAIPAI_EXISTING_ENV_NAME=\\1/p' "$p"
            fi
          done
          """
          inv=cli.run_command(sw.RunCommandRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',name='haipai-genius-secret-names-only',type='RunShellScript',working_user='root',command_content=script,timeout=35)).body.invoke_id
          for _ in range(22):
            time.sleep(2)
            r=cli.describe_invocation_result(sw.DescribeInvocationResultRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',invoke_id=inv)).body.invocation_result
            if r and str(r.invocation_status) in ('Success','Failed','Aborted','ExecutionTimeout','ExitCodeNonzero'):
              output=base64.b64decode(r.output or '').decode('utf8','replace')
              for line in output.splitlines():
                if line.startswith('HAIPAI_EXISTING_ENV_'):print(line)
              assert str(r.invocation_status)=='Success'
              break
          else:raise RuntimeError('ENV_METADATA_UNAVAILABLE')
          PY