# retry after preserving intentionally stopped unrelated services
# Deploy request: EVENT10 isolated late-index strategy production rollout (2026-10-30)
name: EVENT10 frequency-optimized six-gate isolated release
on:
  push:
    branches: [feature/zl-futures-bot-v1]
    paths:
      - ".github/workflows/event10-high-selectivity-release.yml"
      - "event10-bot/pure-signal.mjs"
      - "event10-bot/manual-engine.mjs"
      - "event10-bot/panel.html"
      - "event10-bot/high-selectivity.test.mjs"
      - "event10-bot/aliyun_high_selectivity_only.py"
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: zl-event10-high-selectivity-isolated-release
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Validate isolated EVENT10 signal and no real orders
        run: |
          node --check event10-bot/pure-signal.mjs
          node --check event10-bot/manual-engine.mjs
          node --check event10-bot/server.mjs
          node --test event10-bot/high-selectivity.test.mjs
          python3 -m py_compile event10-bot/aliyun_high_selectivity_only.py
          python3 - <<'PY'
          from pathlib import Path
          root=Path("event10-bot")
          v="EVENT10_FREQ_OPTIMIZED_6GATES_V2_20261101"
          assert v in (root/"pure-signal.mjs").read_text()
          assert v in (root/"panel.html").read_text()
          assert 'NO_EVENT_CONTRACT_ORDER_API' in (root/"server.mjs").read_text()
          print("EVENT10_HS_SOURCE_STATIC_OK=true")
          PY
  deploy:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Deploy only EVENT10 from pinned GitHub SHA
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          python - <<'PY'
          import base64,os,re,time
          from alibabacloud_swas_open20200601.client import Client
          from alibabacloud_swas_open20200601 import models as sw
          from alibabacloud_tea_openapi import models as api
          sha=os.environ["GITHUB_SHA"]
          if os.environ["GITHUB_REF_NAME"]!="feature/zl-futures-bot-v1" or not re.fullmatch("[a-f0-9]{40}",sha):
              raise RuntimeError("EVENT10_HS_INVALID_REF")
          ak=os.getenv("ALIBABA_CLOUD_ACCESS_KEY_ID")
          sk=os.getenv("ALIBABA_CLOUD_ACCESS_KEY_SECRET")
          if not ak or not sk:raise RuntimeError("EVENT10_HS_CLOUD_SECRETS_MISSING")
          script=f"""#!/bin/bash
          set -Eeuo pipefail
          temp=$(mktemp -d /tmp/event10-late.XXXXXXXX)
          trap 'rm -rf "$temp"' EXIT
          curl -fsSL --retry 2 --max-time 35 'https://raw.githubusercontent.com/zhoujunejune/pikpakzl/{sha}/event10-bot/aliyun_high_selectivity_only.py' -o "$temp/release.py"
          python3 -m py_compile "$temp/release.py"
          python3 "$temp/release.py" {sha}
          """
          cli=Client(api.Config(access_key_id=ak,access_key_secret=sk,
              region_id="ap-southeast-1",endpoint="swas.ap-southeast-1.aliyuncs.com"))
          instance="b67374069bb3457ba6a3a2ede9305d3f"
          run=cli.run_command(sw.RunCommandRequest(region_id="ap-southeast-1",
              instance_id=instance,name="event10-high-selectivity-only",
              type="RunShellScript",working_user="root",command_content=script,timeout=340))
          invoke=run.body.invoke_id
          if not invoke:raise RuntimeError("EVENT10_HS_NO_INVOKE_ID")
          complete=False
          for _ in range(150):
              time.sleep(2)
              r=cli.describe_invocation_result(sw.DescribeInvocationResultRequest(
                  region_id="ap-southeast-1",instance_id=instance,invoke_id=invoke)).body.invocation_result
              if not r or str(r.invocation_status) not in ("Success","Failed","Aborted",
                  "ExecutionTimeout","ExitCodeNonzero","ClientNotRunning","InstanceNotRunning"):continue
              output=base64.b64decode(r.output or "").decode("utf8","replace")
              for line in output.splitlines():
                  if line.startswith("EVENT10_HS_"):print(line,flush=True)
              complete="EVENT10_HS_DEPLOY_SUCCEEDED=true" in output
              if str(r.invocation_status)!="Success" or int(r.exit_code)!=0 or not complete:
                  raise RuntimeError("EVENT10_HS_REMOTE_DEPLOY_FAILED_"+
                      str(r.invocation_status)+"_"+output[-450:])
              break
          if not complete:raise RuntimeError("EVENT10_HS_DEPLOY_NOT_CONFIRMED")
          PY

  report:
    if: always()
    needs: [test, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Publish EVENT10-only deploy status back to source commit
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          if [ "$TEST_RESULT" = "success" ] && [ "$DEPLOY_RESULT" = "success" ]; then
            status=success
            description="EVENT10 Excel frequency-optimized isolated Aliyun release confirmed"
          else
            status=failure
            description="EVENT10 release not confirmed: test=$TEST_RESULT deploy=$DEPLOY_RESULT"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$status" \
            -f context="event10-high-selectivity-deploy" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="$description" >/dev/null
          echo "EVENT10_HS_CI_RESULT=$status test=$TEST_RESULT deploy=$DEPLOY_RESULT"
