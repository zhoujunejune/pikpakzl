name: Verify and deploy DeepSeek experience proof on existing Alibaba 25s service
# Exact-source guard diagnoses version drift before any executable change.
on:
  push:
    branches: [feat/deepseek-learning-evidence25-20261021]
    paths:
      - prediction-bot-v1/learning_evidence25_launch.py
      - prediction-bot-v1/learning_evidence25_apply.sh
      - .github/workflows/zl-deepseek-learning-evidence25-production.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: zl-alibaba-prediction-singlehost
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify unchanged 25s six-pass prediction and memory-evidence tests
        run: |
          bash -n prediction-bot-v1/learning_evidence25_apply.sh
          python3 -m py_compile prediction-bot-v1/learning_evidence25_launch.py
          node --test prediction-bot-v1/deepseek-learning-evidence25.test.mjs
          node --test prediction-bot-v1/deepseek-free-analysis25.test.mjs
          node --test prediction-bot-v1/deepseek-wait-reconsider25.test.mjs
          node --test prediction-bot-v1/deepseek-5m-episodic-memory.test.mjs
  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Alibaba SWAS SDK on existing GitHub runner
        run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Source-check and safely deploy learning evidence without changing trading
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python prediction-bot-v1/learning_evidence25_launch.py

# Guarded retry: use live-source-preserving patch merge; never relax 25s/6 calls.
