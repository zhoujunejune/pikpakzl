name: WAIT visibility panel checks
on:
  push:
    branches:
      - feat/live-wait-vs-preview-panel-20261010
    paths:
      - 'railway-diagnostic/panel-stats-shell.mjs'
      - 'railway-diagnostic/wait-visibility-panel.test.mjs'
      - 'railway-diagnostic/control-shell.mjs'
      - 'railway-diagnostic/risk-controls-ui.test.mjs'
      - 'railway-diagnostic/index.mjs'
      - 'railway-diagnostic/control-quick-inputs.test.mjs'
      - 'railway-diagnostic/risk-runner.mjs'
      - 'railway-diagnostic/risk-config-storage.mjs'
      - 'railway-diagnostic/risk-persistence-status.test.mjs'
      - 'railway-diagnostic/risk-worker.mjs'
      - 'railway-diagnostic/risk-monitor-client.js'
      - 'railway-diagnostic/real-risk-monitor.test.mjs'
      - 'railway-diagnostic/daily-loss-draft.mjs'
      - 'railway-diagnostic/daily-loss-client.js'
      - 'railway-diagnostic/daily-loss-preview.test.mjs'
      - '.github/workflows/wait-visibility-panel.yml'
  pull_request:
    paths:
      - 'railway-diagnostic/panel-stats-shell.mjs'
      - 'railway-diagnostic/wait-visibility-panel.test.mjs'
      - 'railway-diagnostic/control-shell.mjs'
      - 'railway-diagnostic/risk-controls-ui.test.mjs'
      - 'railway-diagnostic/index.mjs'
      - 'railway-diagnostic/control-quick-inputs.test.mjs'
      - 'railway-diagnostic/risk-runner.mjs'
      - 'railway-diagnostic/risk-config-storage.mjs'
      - 'railway-diagnostic/risk-persistence-status.test.mjs'
      - 'railway-diagnostic/risk-worker.mjs'
      - 'railway-diagnostic/risk-monitor-client.js'
      - 'railway-diagnostic/real-risk-monitor.test.mjs'
      - 'railway-diagnostic/daily-loss-draft.mjs'
      - 'railway-diagnostic/daily-loss-client.js'
      - 'railway-diagnostic/daily-loss-preview.test.mjs'
      - '.github/workflows/wait-visibility-panel.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check railway-diagnostic/panel-stats-shell.mjs
      - run: node --check railway-diagnostic/control-shell.mjs
      - run: node --check railway-diagnostic/index.mjs
      - run: node --check railway-diagnostic/risk-runner.mjs
      - run: node --check railway-diagnostic/risk-config-storage.mjs
      - run: node --check railway-diagnostic/risk-worker.mjs
      - run: node --check railway-diagnostic/risk-monitor-client.js
      - run: node --check railway-diagnostic/daily-loss-draft.mjs
      - run: node --check railway-diagnostic/daily-loss-client.js
      - run: node --test railway-diagnostic/wait-visibility-panel.test.mjs railway-diagnostic/risk-controls-ui.test.mjs railway-diagnostic/control-quick-inputs.test.mjs railway-diagnostic/risk-persistence-status.test.mjs railway-diagnostic/real-risk-monitor.test.mjs railway-diagnostic/daily-loss-preview.test.mjs
