name: EDGE V2 live status read-only verification
on:
  pull_request:
    branches: [cloudflare-edge5m-20261017]
    paths: ['.github/workflows/edge5-v2-live-smoke.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify V1 untouched and V2 shadow fields online
        run: |
          node --input-type=module <<'NODE'
          const base='https://edge-5m-v1.zl528094-3ba.workers.dev';
          const worker=await fetch('https://api.cloudflare.com/client/v4/accounts/3ba148af3f98117d6b299158e20bf687/workers/scripts/edge-5m-v1',{
            headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},
            signal:AbortSignal.timeout(12000)});
          const code=await worker.text();
          console.log('EDGE_V2_DEPLOYED_CODE_MARKERS',JSON.stringify({status:worker.status,
            hasRenderSnapshot:code.includes('/api/edge-v2-market-data'),
            hasOldRestV2:code.includes('V2_BINANCE_TRADES_STALE'),
            hasShadow:code.includes('edge_v2_shadow'),
            codeLength:code.length}));
          try{
            const mr=await fetch('https://zl-signal-v3-migration.onrender.com/api/edge-v2-market-data',{
              signal:AbortSignal.timeout(12000)});
            const m=await mr.json();
            console.log('EDGE_V2_RENDER_SNAPSHOT',JSON.stringify({
              status:mr.status,ok:m.ok,reason:m.reason,venue:m.venue,at:m.at,
              spotAt:m.spotAt,depth:m.bids?.length,trades:m.trades?.length,
              predictionRound:m.signal?.facts?.predictionMarketRound,
              predictionAge:m.signal?.facts?.predictionMarketBookAgeMs,
              predictionReliable:m.signal?.facts?.predictionMarketMappingReliable,
              predictionConnected:m.dataIntegrity?.predictionOrderbookConnected}));
          }catch(e){console.log('EDGE_V2_RENDER_SNAPSHOT_ERROR',String(e.message));}
          let out;
          for(let attempt=0;attempt<9;attempt++){
            const r=await fetch(base+'/status',{cache:'no-store',signal:AbortSignal.timeout(15000)});
            const d=await r.json();
            const c=d.shadowV2;
            out={status:r.status,at:new Date().toISOString(),
              v1:{model:d.model,deadline:d.timed?.deadlineMs,
                observed:d.results?.observedRounds,locked:d.results?.locked,
                official:d.results?.overall,pending:d.results?.pending,
                latest:d.latest,venue:d.health?.venue,
                source:d.health?.marketOrigin},
              v2:c?{name:c.name,productionEffect:c.productionEffect,
                features:c.featureNames,lockTargetMs:c.lockTargetMs,
                results:c.results,latest:c.latest,error:c.error,
                lastGoodAt:c.lastGoodAt}:null};
            if(r.status===200&&d.model==='EDGE_5M_V1'&&d.timed?.deadlineMs===8000&&
               c?.productionEffect==='NONE'&&
               Array.isArray(c.featureNames)&&c.featureNames.length===6){
              const market=await fetch(base+'/market-check',{cache:'no-store',signal:AbortSignal.timeout(13000)});
              out.marketCheck={status:market.status,ok:market.ok};
              console.log('EDGE_V2_LIVE_VERIFIED',JSON.stringify(out));
              process.exit(0);
            }
            await new Promise(resolve=>setTimeout(resolve,5000));
          }
          console.log('EDGE_V2_LIVE_NOT_YET_READY',JSON.stringify(out));
          process.exitCode=1;
          NODE