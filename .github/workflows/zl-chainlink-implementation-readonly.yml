name: Inspect safe Alibaba unit environment setup for official read-only reference
on:
  push:
    branches: [feat/deepseek40-45s-ai-only-prod-20261025]
    paths: [.github/workflows/zl-chainlink-implementation-readonly.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Read systemd unit file paths and health; do not expose environment values
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          python - <<'OUTER'
          import os,time,base64
          from alibabacloud_swas_open20200601.client import Client
          from alibabacloud_swas_open20200601 import models as sw
          from alibabacloud_tea_openapi import models as api
          cmd=r"""#!/bin/bash
          set -eu
          python3 - <<'INNER'
          import subprocess,urllib.request,json,os
          for unit in ['zl-prediction-trade.service','zl-prediction-deepseek5.service','zl-prediction-v2.service','zl-prediction-v3.service']:
           cmd=['systemctl','show',unit,'--property=EnvironmentFiles,User,Group,MainPID,FragmentPath,ExecStart,WorkingDirectory,ActiveState']
           s=subprocess.run(cmd,capture_output=True,text=True,timeout=5).stdout
           print('ENV_INSPECT_UNIT',unit)
           for line in s.splitlines():
            if line.startswith('ExecStart='):continue
            if line.startswith('EnvironmentFiles='):print('ENV_FILES_CONFIGURED',line[len('EnvironmentFiles='):][:200])
            else:print(line[:240])
          try:
           with urllib.request.urlopen('http://127.0.0.1:13001/api/status',timeout=6) as u:d=json.load(u)
           print('ENV_FOLLOW_STATE',d.get('enabled'),'MODEL',d.get('orderSignalModel'))
          except Exception as e:print('ENV_FOLLOW_ERROR',type(e).__name__)
          print('ENV_INSPECT_FINISHED=true')
          INNER
          """
          cli=Client(api.Config(access_key_id=os.environ['ALIBABA_CLOUD_ACCESS_KEY_ID'],access_key_secret=os.environ['ALIBABA_CLOUD_ACCESS_KEY_SECRET'],region_id='ap-southeast-1',endpoint='swas.ap-southeast-1.aliyuncs.com'))
          inv=cli.run_command(sw.RunCommandRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',name='zl-chainlink-unit-safe-readonly',type='RunShellScript',working_user='root',command_content=cmd,timeout=100)).body.invoke_id
          for _ in range(53):
           time.sleep(2)
           r=cli.describe_invocation_result(sw.DescribeInvocationResultRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',invoke_id=inv)).body.invocation_result
           if r and str(r.invocation_status) in ('Success','Failed','Aborted','ExecutionTimeout','ExitCodeNonzero'):
            out=base64.b64decode(r.output or '',validate=True).decode('utf8','replace')
            print('ENV_INSPECT_REMOTE',r.invocation_status,'EXIT',r.exit_code);print(out[-8200:])
            if int(r.exit_code)!=0:raise RuntimeError('ENV_INSPECT_FAILED')
            break
          else:raise RuntimeError('ENV_INSPECT_TIMEOUT')
          OUTER
