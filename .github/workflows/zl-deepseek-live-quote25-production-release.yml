name: Publish DeepSeek live Binance BUY quote reasoning to existing Alibaba production
on:
  push:
    branches: [feat/deepseek-live-quote-reasoning25-20261022]
    paths:
      - .github/workflows/zl-deepseek-live-quote25-production-release.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: zl-alibaba-prediction-singlehost
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Check no extra AI calls, live quote provenance, EV veto, 25s cap
        run: |
          bash -n prediction-bot-v1/apply_live_quote_cognition25.sh
          python3 -m py_compile prediction-bot-v1/patch_deepseek_quote_cognition.py prediction-bot-v1/patch_trade_quote_preview.py prediction-bot-v1/launch_live_quote_cognition25.py
          python3 prediction-bot-v1/patch_deepseek_quote_cognition.py prediction-bot-v1 /tmp/quote-reason-model
          python3 prediction-bot-v1/patch_live_trade_value.py railway-diagnostic/wrapper.mjs /tmp/value-wrapper.mjs
          python3 prediction-bot-v1/patch_trade_quote_preview.py /tmp/value-wrapper.mjs /tmp/full-wrapper.mjs
          for f in /tmp/quote-reason-model/*.mjs /tmp/full-wrapper.mjs; do node --check "$f"; done
          PATCHED_CORE_PATH=/tmp/quote-reason-model/deepseek-adaptive15-core.mjs node --test prediction-bot-v1/live_quote_reasoning.test.mjs
          node --test prediction-bot-v1/live-trade-value-policy.test.mjs
          grep -q 'MAX_AI_CALLS_PER_ROUND=6' /tmp/quote-reason-model/deepseek-adaptive15-runner.mjs
          grep -q 'DEADLINE_MS=25000' /tmp/quote-reason-model/deepseek-adaptive15-core.mjs
          grep -q 'deepseek_live_trade_value' /tmp/full-wrapper.mjs
          grep -q 'getLiveAiQuotePreview' /tmp/full-wrapper.mjs
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install existing Alibaba SWAS SDK
        run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Publish to existing production only when no orders in flight and owner has paused follow
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python prediction-bot-v1/launch_live_quote_cognition25.py
