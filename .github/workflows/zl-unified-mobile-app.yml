name: Release ZL 海派事件合约 v1.4.0 PWA to Alibaba
on:
  push:
    branches: [feature/zl-futures-bot-v1]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/zl-unified-mobile-app.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: zl-unified-mobile-static-release
  cancel-in-progress: false
jobs:
  static-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Validate app JS, service worker, install metadata and deploy shell
        run: |
          node --check mobile-app/app.js
          node --check mobile-app/genius.js
          node --test mobile-app/event10-current-only.test.mjs mobile-app/event10-foreground-recovery.test.mjs mobile-app/ocean-ui-v135.test.mjs mobile-app/manual-real-trade-counter.test.mjs
          node --check mobile-app/sw.js
          python -m py_compile mobile-app/aliyun_deploy.py
          python - <<'PY'
          import ast,json,subprocess
          from pathlib import Path
          root=Path('mobile-app')
          m=json.loads((root/'manifest.webmanifest').read_text())
          assert m['scope']=='/app/' and m['display']=='standalone'
          assert {192,512}=={int(i['sizes'].split('x')[0]) for i in m['icons']}
          assert all('/app/' in i['src'] for i in m['icons'])
          html=(root/'index.html').read_text()
          js=(root/'app.js').read_text()
          assert '/app/manifest.webmanifest' in html
          assert '/app/app.js' in html
          for name in ('panel-event10','panel-more','eRecords'):
            assert name in html
          for url in ('/event10/api/status','/event10/api/signals','/event10/api/start'):
            assert url in js
          assert 'localStorage' not in js and 'sessionStorage' not in js
          assert 'hotUpdateBanner' in html and 'appUpdateState' in html
          assert '__ZL_APP_RELEASE_SHA__' in js and 'checkHotUpdate' in js
          assert 'version.json' in (root/'aliyun_deploy.py').read_text()
          assert '高标准代理命中率' not in html and '普通信号代理命中率' not in html
          assert 'eventTier(' not in js
          assert 'panel-guardian' not in html and 'panel-overview' not in html
          assert 'data-go="guardian"' not in html and 'data-go="overview"' not in html
          assert '/guardian/api/status' not in js and 'guardianOnline' not in js
          assert 'APP_VERSION="1.4.0"' in js
          assert m['name']=='海派合约天才' and m['short_name']=='海派合约天才'
          assert '<title>海派事件合约</title>' in html
          assert m['start_url']=='/app/genius.html'
          assert '海派合约天才' in (root/'genius.html').read_text()
          assert '/genius/api/' in (root/'genius.js').read_text()
          assert 'src="/app/icon-192.png"' in html
          assert 'class="logo">ZL' not in html
          for size in (192,512):
            raw=(root/f'icon-{size}.png').read_bytes()
            assert len(raw)>3000 and raw[:8]==b'\x89PNG\r\n\x1a\n'
            import struct
            assert struct.unpack('>II',raw[16:24])==(size,size)
          assert 'data:image/png;base64,' in (root/'icon.svg').read_text()
          tree=ast.parse((root/'aliyun_deploy.py').read_text())
          remote=next(n.value.value for n in tree.body if isinstance(n,ast.Assign) and
                      any(getattr(t,'id',None)=='REMOTE' for t in n.targets))
          check=subprocess.run(['bash','-n'],input=remote,text=True,capture_output=True)
          assert check.returncode==0,check.stderr
          for key in ('MOBILE_AUTH_CHECK_FAILED_PATH','MOBILE_APP_PWA_RELEASED=true',
                      'MOBILE_APP_TRADING_ENGINES_UNCHANGED=true','MOBILE_APP_ROLLED_BACK=true'):
            assert key in remote
          assert 'systemctl restart zl-prediction-trade' not in remote
          assert 'systemctl restart zl-event10-deepseek' not in remote
          assert 'MOBILE_APP_GUARDIAN_REMAINS_STOPPED=true' in remote
          assert 'MOBILE_APP_RETIRED_GUARDIAN_UNEXPECTEDLY_RUNNING=true' in remote
          print('MOBILE_APP_CI_TESTS_PASS')
          PY
  deploy-static:
    needs: static-verify
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install Alibaba SWAS SDK
        run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Deploy only static app; preserve Caddy authentication and trading PIDs
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python mobile-app/aliyun_deploy.py
      - name: Verify authenticated public page and install assets
        env:
          ZL_PANEL_PASSWORD: ${{ secrets.ZL_PANEL_PASSWORD }}
        run: |
          python - <<'PY'
          import base64,os,urllib.request
          password=os.environ.get('ZL_PANEL_PASSWORD','')
          if not password:
              print('MOBILE_APP_AUTHENTICATED_PUBLIC_TEST_NOT_CONFIGURED')
              raise SystemExit(0)
          basic=base64.b64encode(('zl:'+password).encode()).decode()
          base='https://prediction.47-237-188-69.sslip.io'
          for path,needle in (('/app/','海派事件合约'),('/app/app.js','/event10/api/status'),('/app/genius.html','海派合约天才'),('/app/genius.js','/genius/api/'),
                              ('/app/manifest.webmanifest','"standalone"'),
                              ('/app/icon.svg','data:image/png;base64,'),
                              ('/app/version.json','"updateType":"web"'),
                              ('/app/sw.js','fetch(event.request)')):
              req=urllib.request.Request(base+path,headers={'Authorization':'Basic '+basic,'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=14) as response:
                  body=response.read(240000).decode('utf8','replace')
                  assert response.status==200 and needle in body,(path,response.status)
              print('MOBILE_APP_PUBLIC_ASSET_OK',path)
          print('MOBILE_APP_PUBLIC_AUTHENTICATED_TESTS_PASS')
          PY

  report:
    if: always()
    needs: [static-verify, deploy-static]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report app PWA verification and Alibaba deployment status
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_RESULT: ${{ needs.static-verify.result }}
          DEPLOY_RESULT: ${{ needs.deploy-static.result }}
        run: |
          if [ "$VERIFY_RESULT" = success ] && [ "$DEPLOY_RESULT" = success ]; then
            state=success
            description="Mobile PWA tests and Alibaba static deployment confirmed"
          else
            state=failure
            description="Mobile PWA not confirmed: tests=$VERIFY_RESULT deploy=$DEPLOY_RESULT"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="zl-unified-mobile-app-deploy" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="$description" >/dev/null
          echo "MOBILE_APP_CI_RESULT=$state"
