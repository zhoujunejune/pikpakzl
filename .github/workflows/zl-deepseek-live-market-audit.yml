name: Validate live Alibaba BTC market with DeepSeek (no orders)
on:
  push:
    branches: [feature/zl-futures-bot-v1]
    paths:
      - prediction-bot-v1/deepseek_market_live_probe.py
      - .github/workflows/zl-deepseek-live-market-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile prediction-bot-v1/deepseek_market_live_probe.py
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Verify fresh BTC 5min market data and a real DeepSeek UP/DOWN result
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python prediction-bot-v1/deepseek_market_live_probe.py
