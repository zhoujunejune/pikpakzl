name: Audit Android signing backup presence (read only)
on:
  push:
    branches: [feature/zl-futures-bot-v1]
    paths:
      - .github/workflows/zl-android-signing-backup-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signing-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Alibaba SWAS SDK
        run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Inspect possible keystore backups without exposing or copying private material
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          python - <<'PY'
          import os,time,base64,sys
          ak=os.getenv('ALIBABA_CLOUD_ACCESS_KEY_ID','')
          sk=os.getenv('ALIBABA_CLOUD_ACCESS_KEY_SECRET','')
          if not ak or not sk:
              print('ANDROID_SIGNING_AUDIT_CLOUD_CREDENTIALS_UNAVAILABLE')
              sys.exit(3)
          from alibabacloud_swas_open20200601.client import Client
          from alibabacloud_swas_open20200601 import models as sw
          from alibabacloud_tea_openapi import models as api
          script=r"""#!/bin/bash
          set -eu
          python3 - <<'INNER'
          import os
          roots=['/root','/home','/opt','/srv','/var/lib','/var/backups','/etc','/data','/mnt']
          skip={'.git','.cache','node_modules','site-packages','__pycache__','venv','.venv','proc','sys','dev'}
          debug_count=0
          candidate_count=0
          examined=0
          for root in roots:
              if not os.path.isdir(root):continue
              for d,dirs,files in os.walk(root,followlinks=False):
                  examined+=1
                  depth=d[len(root):].count(os.sep)
                  dirs[:]=[a for a in dirs if a not in skip] if depth<6 else []
                  for f in files:
                      if f.lower().endswith(('.jks','.keystore','.p12','.pfx')):
                          if 'debug' in f.lower() or '.android' in d.lower():
                              debug_count+=1
                          else:candidate_count+=1
                  if examined>15000:break
              if examined>15000:break
          print('ANDROID_SIGNING_AUDIT_SERVER_PROBE_OK=true')
          print('ANDROID_SIGNING_AUDIT_REUSABLE_CANDIDATES='+str(candidate_count))
          print('ANDROID_SIGNING_AUDIT_DEBUG_ONLY_CANDIDATES='+str(debug_count))
          print('ANDROID_SIGNING_AUDIT_SEARCH_LIMIT_REACHED='+str(examined>15000).lower())
          INNER
          """
          cli=Client(api.Config(access_key_id=ak,access_key_secret=sk,
              region_id='ap-southeast-1',endpoint='swas.ap-southeast-1.aliyuncs.com'))
          result=cli.run_command(sw.RunCommandRequest(region_id='ap-southeast-1',
              instance_id='b67374069bb3457ba6a3a2ede9305d3f',
              name='zl-android-signing-readonly-file-presence',type='RunShellScript',
              command_content=script,timeout=80))
          invoke=result.body.invoke_id
          if not invoke:raise RuntimeError('ANDROID_SIGNING_AUDIT_NO_INVOCATION')
          for i in range(25):
              time.sleep(3)
              v=cli.describe_invocation_result(sw.DescribeInvocationResultRequest(
                  region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',
                  invoke_id=invoke)).body.invocation_result
              if v and str(v.invocation_status) in ('Success','Failed','Aborted','ExecutionTimeout','ClientNotRunning','InstanceNotRunning'):
                  out=base64.b64decode(v.output or '').decode('utf8','replace')
                  for line in out.splitlines():
                      if line.strip().startswith('ANDROID_SIGNING_AUDIT_'):print(line.strip())
                  print('ANDROID_SIGNING_AUDIT_REMOTE_STATUS='+str(v.invocation_status))
                  print('ANDROID_SIGNING_AUDIT_REMOTE_EXIT='+str(v.exit_code))
                  sys.exit(0 if str(v.invocation_status)=='Success' and int(v.exit_code)==0 else 4)
          print('ANDROID_SIGNING_AUDIT_TIMED_OUT')
          sys.exit(5)
          PY
