name: GUARDIAN guarded Alibaba bridge staging
on:
  push:
    branches: [feature/zl-futures-bot-v1]
    paths:
      - prediction-bot-v1/aliyun_guardian_guarded_bridge_stage.py
      - .github/workflows/zl-guardian-guarded-bridge-stage.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: zl-guardian-guarded-bridge-stage
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Check script and embedded remote shell syntax without any trade
        run: |
          python -m py_compile prediction-bot-v1/aliyun_guardian_guarded_bridge_stage.py
          python - <<'PY'
          import ast,subprocess
          tree=ast.parse(open('prediction-bot-v1/aliyun_guardian_guarded_bridge_stage.py').read())
          script=next(x.value.value for x in tree.body if isinstance(x,ast.Assign) and any(isinstance(z,ast.Name) and z.id=='SCRIPT' for z in x.targets))
          result=subprocess.run(['bash','-n'],input=script,text=True,capture_output=True)
          print(result.stderr)
          assert result.returncode==0,'REMOTE_SHELL_SYNTAX_INVALID'
          print('GUARDIAN_BRIDGE_REMOTE_SHELL_VALID=true')
          PY
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Stage GUARDIAN adapter on Alibaba with live following OFF
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python prediction-bot-v1/aliyun_guardian_guarded_bridge_stage.py
