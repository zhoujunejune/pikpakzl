name: Independently verify risk TP SL stable rollback on Alibaba
on:
  push:
    branches: [rollback/risk-adaptive-to-stable-20261023]
    paths:
      - .github/workflows/zl-risk-stable-postrollback-audit.yml
      - prediction-bot-v1/verify_rollback_stable_readonly_20261023.py
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit_readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Validate read only shell and Python
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast,subprocess
          script=Path('prediction-bot-v1/verify_rollback_stable_readonly_20261023.py').read_text()
          mod=ast.parse(script)
          sh=next(n.value.value for n in mod.body if isinstance(n,ast.Assign)
             for t in n.targets if isinstance(t,ast.Name) and t.id=='REMOTE')
          assert subprocess.run(['bash','-n'],input=sh,text=True).returncode==0
          a=sh.index("python3 - <<'PY'")+len("python3 - <<'PY'")
          compile(sh[a:sh.index("\nPY",a)],'stable-rollback-readonly','exec')
          assert 'systemctl restart' not in sh
          assert 'place-order-bundle' not in sh
          print('STABLE_ROLLBACK_READONLY_SAFE=true')
          PY
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Read live service source, journal, current TP/SL thresholds and latest errors
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python prediction-bot-v1/verify_rollback_stable_readonly_20261023.py
