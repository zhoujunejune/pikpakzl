name: Restore DeepSeek Flash production provider on Alibaba
on:
  push:
    branches: [feature/zl-futures-bot-v1]
    paths:
      - .github/workflows/zl-deepseek-flash-restore.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zl-alibaba-prediction-singlehost
  cancel-in-progress: false
jobs:
  restore-flash:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Validate rollback-safe Flash restore syntax
        run: python -m py_compile prediction-bot-v1/aliyun_deepseek_flash_restore.py
      - name: Install Alibaba Cloud SDK
        run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Restore existing DeepSeek provider to Flash without order changes
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python prediction-bot-v1/aliyun_deepseek_flash_restore.py
