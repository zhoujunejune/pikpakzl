name: Audit DeepSeek current accuracy and rolling trend read-only
on:
  push:
    branches: [fix/deepseek25-direction-only-normal-orders-20261022]
    paths:
      - .github/workflows/zl-deepseek-accuracy-trend-readonly.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  accuracy:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Read official settled DeepSeek forecast history, rolling window accuracy and diagnostic status
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python prediction-bot-v1/inspect_deepseek_accuracy_trend_readonly.py
