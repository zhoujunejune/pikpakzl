name: Read-only inspect risk journal systemd sandbox
on:
  push:
    branches: [fix/risk-sell-journal-erofs-20261023]
    paths:
      - .github/workflows/zl-risk-journal-probe.yml
      - prediction-bot-v1/risk_journal_sandbox_probe.py
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m py_compile prediction-bot-v1/risk_journal_sandbox_probe.py
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Audit existing service filesystem sandbox without modification
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python prediction-bot-v1/risk_journal_sandbox_probe.py
