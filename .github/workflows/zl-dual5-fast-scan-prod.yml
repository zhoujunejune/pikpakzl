name: Release dual5 fast boundary scan without live activation
on:
  push:
    branches: [feat/deepseek40-45s-ai-only-prod-20261025]
    paths: [.github/workflows/zl-dual5-fast-scan-prod.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: zl-alibaba-prediction-singlehost
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify opening-scan cadence, pair gate and independent risk are preserved
        run: |
          node --check prediction-bot-v1/binance_dual5_pairs.mjs
          node --test prediction-bot-v1/binance_dual5_pairs.test.mjs
          python -m py_compile prediction-bot-v1/aliyun_dual5_fast_scan_release.py
          python - <<'PY'
          from pathlib import Path
          worker=Path('prediction-bot-v1/binance_dual5_pairs.mjs').read_text()
          ui=Path('prediction-bot-v1/binance_dual5_dashboard.html').read_text()
          assert "ROUND_BOUNDARY_FAST_V1" in worker
          assert "nextScanDelayMs" in worker
          assert "MIN_EDGE=0.08" in worker
          assert "UNHEDGED_OR_UNKNOWN_STOPPED" in worker
          assert "DEFAULT_RISK=()=>({takeProfitEnabled:true,takeProfitPct:30,stopLossEnabled:true,stopLossPct:30})" in worker
          assert "if(!estimate.feasible)" in worker
          assert "if(!config.armed)" in worker
          assert "if(t.enabled!==false)" in worker
          assert "config.lastOrderRound=round" in worker
          assert 'id="firstScanLag"' in ui and 'id="pairExecution"' in ui
          print('DUAL5_FAST_SCAN_REGRESSION_OK=true')
          PY
  deploy:
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Deploy idle-only accelerated scanner on Alibaba with automatic rollback
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          python - <<'OUTER'
          import os,time,base64
          from alibabacloud_swas_open20200601.client import Client
          from alibabacloud_swas_open20200601 import models as sw
          from alibabacloud_tea_openapi import models as api
          sha=os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_REF_NAME']=='feat/deepseek40-45s-ai-only-prod-20261025'
          script="""#!/bin/bash
          set -Eeuo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL --retry 2 --max-time 35 "https://raw.githubusercontent.com/zhoujunejune/pikpakzl/COMMIT_SHA/prediction-bot-v1/aliyun_dual5_fast_scan_release.py" -o "$tmp/release.py"
          python3 -m py_compile "$tmp/release.py"
          python3 "$tmp/release.py" COMMIT_SHA
          """.replace('COMMIT_SHA',sha)
          cli=Client(api.Config(access_key_id=os.environ['ALIBABA_CLOUD_ACCESS_KEY_ID'],access_key_secret=os.environ['ALIBABA_CLOUD_ACCESS_KEY_SECRET'],region_id='ap-southeast-1',endpoint='swas.ap-southeast-1.aliyuncs.com'))
          inv=cli.run_command(sw.RunCommandRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',name='zl-dual5-fast-opening-scan',type='RunShellScript',working_user='root',command_content=script,timeout=240)).body.invoke_id
          for _ in range(125):
           time.sleep(2)
           result=cli.describe_invocation_result(sw.DescribeInvocationResultRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',invoke_id=inv)).body.invocation_result
           if result and str(result.invocation_status) in ('Success','Failed','Aborted','ExecutionTimeout','ExitCodeNonzero'):
            print('DUAL5_FAST_SCAN_ALIBABA',result.invocation_status,'EXIT',result.exit_code)
            try:print(base64.b64decode(result.output or '',validate=True).decode('utf8','replace')[-10000:])
            except Exception:print('REMOTE_OUTPUT_NOT_AVAILABLE')
            if str(result.invocation_status)!='Success' or int(result.exit_code)!=0:
             raise RuntimeError('DUAL5_FAST_SCAN_DEPLOY_FAILED')
            break
          else:raise RuntimeError('DUAL5_FAST_SCAN_DEPLOY_TIMEOUT')
          OUTER
  verify:
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify new fast-scan mode live, with both production bots still OFF
        env:
          ZL_PANEL_PASSWORD: ${{ secrets.ZL_PANEL_PASSWORD }}
        run: |
          python - <<'PY'
          import os,json,base64,urllib.request
          origin='https://prediction.47-237-188-69.sslip.io'
          auth='Basic '+base64.b64encode(('zl:'+os.environ['ZL_PANEL_PASSWORD']).encode()).decode()
          def get(path):
           req=urllib.request.Request(origin+path,headers={'Authorization':auth,'Cache-Control':'no-store'})
           with urllib.request.urlopen(req,timeout=18) as resp:return resp.status,resp.read(1000000)
          status,raw=get('/api/dual5-status')
          d=json.loads(raw)
          assert status==200 and d.get('model')=='BINANCE_DUAL5_PAIR_V1'
          assert d.get('scanMode')=='ROUND_BOUNDARY_FAST_V1'
          assert d.get('active') is False and d.get('blocked') is False
          assert d.get('dailySpendMax','missing') is None
          assert isinstance(d.get('amounts',{}).get('UP'),(int,float))
          assert isinstance(d.get('amounts',{}).get('DOWN'),(int,float))
          assert 'UP' in d.get('risk',{}) and 'DOWN' in d.get('risk',{})
          status,raw=get('/dual5')
          assert status==200 and 'id="firstScanLag"' in raw.decode()
          assert 'id="pairExecution"' in raw.decode()
          status,raw=get('/api/status')
          base=json.loads(raw)
          assert status==200 and base.get('enabled') is False
          print('DUAL5_FAST_SCAN_LIVE_VERIFIED=true')
          print('DUAL5_BOTH_BOTS_OFF=true')
          print('DUAL5_AMOUNT_SETTINGS='+json.dumps(d['amounts']))
          print('DUAL5_TP_SL_UNMODIFIED_BY_DEPLOY=true')
          PY
