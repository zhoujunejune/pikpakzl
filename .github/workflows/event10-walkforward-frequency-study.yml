# 2026-11-06 fixed V15 signal timestamps. Direction alternatives only. Strictly read-only.
# Latest 2026-11-05 readonly study: frequency/accuracy tradeoffs, predeclared reversal alternatives. Never trades.
# 2026-11-05: verify actual deployed standard-tier implementation versus previous historical candidates.
name: EVENT10 same-frequency direction outcome research
on:
  push:
    branches: [feature/zl-futures-bot-v1]
    paths: ['.github/workflows/event10-walkforward-frequency-study.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Readonly comparison of live and predeclared momentum candidates on archived closed candles
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          python - <<'PY'
          import os,time,base64
          from alibabacloud_swas_open20200601.client import Client
          from alibabacloud_swas_open20200601 import models as sw
          from alibabacloud_tea_openapi import models as api
          ak=os.getenv('ALIBABA_CLOUD_ACCESS_KEY_ID');sk=os.getenv('ALIBABA_CLOUD_ACCESS_KEY_SECRET')
          if not ak or not sk:raise RuntimeError('MISSING_ALIYUN_CREDS')
          script=r"""#!/bin/bash
          set -eu
          cd /opt/zl-event10
          /opt/zl-prediction-node/bin/node --input-type=module <<'NODE'
          // The existing operator sees V15 signal TIMES. Change only direction and
          // never suppress/increase signals: fixed count, no notification change.
          const get=async url=>{const q=await fetch(url,{signal:AbortSignal.timeout(8000)});if(!q.ok)throw Error("FETCH_"+q.status);return q.json()};
          const [feed,ledger]=await Promise.all([
            get('http://127.0.0.1:13003/api/shadow-market-data'),
            get('http://127.0.0.1:13020/api/signals?limit=100&offset=0')
          ]);
          if(!feed.ok||!ledger.ok||ledger.version!=="EVENT10_PACED_MOMENTUM_V15_20261106")
            throw Error('V15_LIVE_LEDGER_OR_FEED_UNVERIFIED');
          const rows=k=>(Array.isArray(feed.candles?.[k])?feed.candles[k]:feed.candles?.[k]?.rows||[])
            .filter(x=>x&&x.closed===true).sort((a,b)=>a.startMs-b.startMs);
          const one=rows('1m'),five=rows('5m');
          const settled=ledger.records.filter(x=>typeof x.proxyHit==="boolean"&&
              ['UP','DOWN'].includes(x.direction)&&Number.isFinite(x.openedAt))
            .sort((a,b)=>a.openedAt-b.openedAt);
          const e=(arr,n)=>{let x=arr.slice(0,n).reduce((a,b)=>a+b,0)/n;for(const q of arr.slice(n))x+=(2/(n+1))*(q-x);return x};
          const rsi=p=>{let up=0,down=0;for(let i=p.length-14;i<p.length;i++){const x=p[i]-p[i-1];up+=Math.max(0,x);down+=Math.max(0,-x)}return down===0?100:100-100/(1+up/down)};
          const sign=n=>n>0?'UP':n<0?'DOWN':null;
          const opposite=d=>d==='UP'?'DOWN':'UP';
          const pct=(a,b)=>100*(a/b-1);
          const names=['baseline','opposite','ema5','ret10','ret15','ret30',
            'ema5_ret15_vote','rsi65_35_flip','rsi60_40_flip',
            'impulse_exhaustion','ret15_reversal','regime_flip'];
          const results=[],skipped=[];
          for(const s of settled){
            const a=one.filter(x=>x.startMs+60000<=s.openedAt).slice(-65);
            const b=five.filter(x=>x.startMs+300000<=s.openedAt).slice(-45);
            if(a.length<60||b.length<40){skipped.push(s.id);continue}
            const p=a.map(x=>Number(x.close)),q=b.map(x=>Number(x.close));
            const rsi14=rsi(p),v3=pct(p.at(-1),p.at(-4)),v10=pct(p.at(-1),p.at(-11)),
                  v15=pct(p.at(-1),p.at(-16)),v30=pct(p.at(-1),p.at(-31));
            const ema5=e(q,9)-e(q,21),ema1=e(p,9)-e(p,21);
            const d=s.direction;const truth=s.proxyHit?d:opposite(d);
            const sign5=sign(ema5),s15=sign(v15),s10=sign(v10),s30=sign(v30);
            const vote=[sign5,s15,s10].reduce((n,x)=>n+(x==='UP'?1:x==='DOWN'?-1:0),0);
            const regime=Math.abs(v15)>=0.09&&Math.abs(v3)>=0.04;
            const pred={
              baseline:d,opposite:opposite(d),ema5:sign5||d,ret10:s10||d,ret15:s15||d,ret30:s30||d,
              ema5_ret15_vote:sign(vote)||d,
              rsi65_35_flip:(d==='UP'&&rsi14>=65)||(d==='DOWN'&&rsi14<=35)?opposite(d):d,
              rsi60_40_flip:(d==='UP'&&rsi14>=60)||(d==='DOWN'&&rsi14<=40)?opposite(d):d,
              impulse_exhaustion:(d==='UP'&&rsi14>=60&&v3>=0.09)||(d==='DOWN'&&rsi14<=40&&v3<=-0.09)?opposite(d):d,
              ret15_reversal:((d==='UP'&&v15>=0.10)||(d==='DOWN'&&v15<=-0.10))?opposite(d):d,
              regime_flip:regime&&s15===d?opposite(d):d
            };
            results.push({t:s.openedAt,truth,original:d,tier:s.signalQuality,v3,v10,v15,v30,rsi14,
               ema1,ema5,pred});
          }
          const summary=(subset,key)=>{let n=subset.length,good=0,up=0,down=0,reverse=0;
             for(const s of subset){const dir=s.pred[key];if(dir===s.truth)good++;if(dir==='UP')up++;else down++;if(dir!==s.original)reverse++}
             return {n,hit:good,pct:n?Number((100*good/n).toFixed(2)):null,flipped:reverse,up,down}};
          const split=Math.floor(results.length*0.6);
          const measures=Object.fromEntries(names.map(k=>[k,{train:summary(results.slice(0,split),k),
             test:summary(results.slice(split),k),all:summary(results,k)}]));
          console.log('EVENT10_DIRECTION_STUDY',JSON.stringify({source:'V15_OFFICIAL_SIGNAL_TIMES_AND_PROXY_RESULTS_WITH_CLOSED_SPOT_FEATURES',
            version:ledger.version,feed1m:one.length,feed5m:five.length,settled: settled.length,
            analyzed:results.length,skipped:skipped.length,
            trainRange:[results[0]?.t,results[split-1]?.t],testRange:[results[split]?.t,results.at(-1)?.t],
            candidates:measures,
            note:'Same 10-minute signal timestamps and same count; past index proxy outcomes, not official event settlements; historical alternatives may overfit.'}));
          console.log('EVENT10_DIRECTION_ROWS',JSON.stringify(results.map(x=>({
            t:x.t,d:x.original,truth:x.truth,rsi:Number(x.rsi14.toFixed(1)),
            v3:Number(x.v3.toFixed(3)),v15:Number(x.v15.toFixed(3)),v30:Number(x.v30.toFixed(3)),
            ema1:Math.sign(x.ema1),ema5:Math.sign(x.ema5)}))));
          NODE
          """
          cli=Client(api.Config(access_key_id=ak,access_key_secret=sk,region_id='ap-southeast-1',endpoint='swas.ap-southeast-1.aliyuncs.com'))
          resp=cli.run_command(sw.RunCommandRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',name='event10-walkforward-proxy-study',
            type='RunShellScript',working_user='root',command_content=script,timeout=160))
          id=resp.body.invoke_id
          if not id:raise RuntimeError('NO_INVOKE_ID')
          for _ in range(90):
              time.sleep(2)
              result=cli.describe_invocation_result(sw.DescribeInvocationResultRequest(region_id='ap-southeast-1',
                  instance_id='b67374069bb3457ba6a3a2ede9305d3f',invoke_id=id)).body.invocation_result
              if not result:continue
              status=str(result.invocation_status)
              if status not in ('Success','Failed','Aborted','ExecutionTimeout','ExitCodeNonzero','ClientNotRunning','InstanceNotRunning'):continue
              output=base64.b64decode(result.output or '').decode('utf-8','replace')
              for line in output.splitlines():
                  if line.startswith(('EVENT10_WALKFORWARD','EVENT10_DIRECTION_')):print(line,flush=True)
              if status!='Success' or int(result.exit_code)!=0:raise RuntimeError('RESEARCH_FAILED_'+status+':'+output[-400:])
              break
          else:raise RuntimeError('RESEARCH_TIMEOUT')
          PY
