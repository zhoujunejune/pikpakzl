name: Inspect FAST5 live direction routing read-only
on:
  push:
    branches: [feat/deepseek40-45s-ai-only-prod-20261025]
    paths: [.github/workflows/zl-fast5-direction-inspect.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Read production direction mode and source mapping without changes
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          python - <<'OUTER'
          import os,time,base64
          from alibabacloud_swas_open20200601.client import Client
          from alibabacloud_swas_open20200601 import models as sw
          from alibabacloud_tea_openapi import models as api
          script=r"""#!/bin/bash
          set -eu
          python3 - <<'INNER'
          import pathlib,urllib.request,json
          root=pathlib.Path('/opt/zl-prediction-live/src/railway-diagnostic')
          for file in ['index.mjs','order-direction-policy.mjs','wrapper.mjs','panel-stats-shell.mjs']:
           p=root/file
           if not p.is_file():continue
           src=p.read_text()
           markers=(['FAST5_MODEL','FAST5_LOCAL_URL','choice.model===FAST5','FAST5_SPOT_MOMENTUM_V1','source:','/api/direction-mode','mapping=mappedOrderSignal','refreshDirectionSettings'] if file=='index.mjs' else ['ORDER_SOURCES','PRIMARY_SOURCE','orderDirectionForProduction','mappedOrderSignal','setDirectionMode'] if file=='order-direction-policy.mjs' else ['FAST5','pendingOrderMatchesProduction','refreshDirectionSettings'] if file=='wrapper.mjs' else ['injectFast5Dashboard','fast5-dashboard-inject'])
           for marker in markers:
            i=src.find(marker)
            if i<0:continue
            print('FAST5_LIVE_SOURCE',json.dumps({'file':file,'marker':marker,'len':len(src),'at':i,
               'context':src[max(0,i-240):i+1150]},ensure_ascii=False)[:2500])
          for port,route in [(13001,'/api/status'),(13001,'/api/direction-mode'),(13001,'/api/order-signal-model')]:
           try:
            with urllib.request.urlopen('http://127.0.0.1:%d%s'%(port,route),timeout=6) as r:a=json.load(r)
            d={k:a.get(k) for k in ['ok','enabled','signal','productionSignal','orderSignal','orderMappingMode','orderProductionSource','directionModes','directionModeReady','orderSignalModel','model','revision','policy','modes','effectiveAfterRound']}
            print('FAST5_LIVE_CONFIG',json.dumps({'route':route,'result':d},ensure_ascii=False)[:6000])
           except Exception as e:print('FAST5_LIVE_CONFIG_ERROR',route,str(e)[:150])
          INNER
          """
          cli=Client(api.Config(access_key_id=os.environ['ALIBABA_CLOUD_ACCESS_KEY_ID'],access_key_secret=os.environ['ALIBABA_CLOUD_ACCESS_KEY_SECRET'],region_id='ap-southeast-1',endpoint='swas.ap-southeast-1.aliyuncs.com'))
          inv=cli.run_command(sw.RunCommandRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',name='zl-fast5-direction-source-readonly',type='RunShellScript',working_user='root',command_content=script,timeout=90)).body.invoke_id
          for _ in range(55):
           time.sleep(2)
           a=cli.describe_invocation_result(sw.DescribeInvocationResultRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',invoke_id=inv)).body.invocation_result
           if a and str(a.invocation_status) in ('Success','Failed','Aborted','ExecutionTimeout','ExitCodeNonzero'):
            print('FAST5_LIVE_INSPECT',a.invocation_status,'EXIT',a.exit_code)
            print(base64.b64decode(a.output or '',validate=True).decode('utf8','replace')[-20500:])
            if int(a.exit_code)!=0:raise RuntimeError('FAILED_READONLY_INSPECT')
            break
          else:raise RuntimeError('INSPECT_TIMEOUT')
          OUTER
