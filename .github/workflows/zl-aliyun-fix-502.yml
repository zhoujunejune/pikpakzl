name: Hotfix Alibaba prediction intermittent 502 (invalid URL guard)
on:
  push:
    branches: [feature/zl-futures-bot-v1]
    paths:
      - 'prediction-bot-v1/aliyun_fix_502.py'
      - '.github/workflows/zl-aliyun-fix-502.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zl-alibaba-prediction-invalid-url-fix
  cancel-in-progress: false
jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check targeted hotfix script syntax
        run: python -m py_compile prediction-bot-v1/aliyun_fix_502.py
      - name: Install Alibaba Cloud API SDK
        run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Patch deployed prediction panel and restart only prediction service
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python prediction-bot-v1/aliyun_fix_502.py
      - name: Verify prediction HTTPS dashboard repeatedly
        env:
          ZL_PANEL_PASSWORD: ${{ secrets.ZL_PANEL_PASSWORD }}
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,base64,os,time
          pw=os.environ["ZL_PANEL_PASSWORD"]
          auth="Basic "+base64.b64encode(("zl:"+pw).encode()).decode()
          host="https://prediction.47-237-188-69.sslip.io"
          failures=[]
          for i in range(12):
            req=urllib.request.Request(host+"/api/status",headers={"Authorization":auth,"Cache-Control":"no-cache"})
            try:
              with urllib.request.urlopen(req,timeout=12) as resp:
                status=resp.status
            except urllib.error.HTTPError as e:
              status=e.code
            except Exception:
              status=0
            print("PREDICTION_API_STATUS_PROBE",i+1,status)
            if status!=200: failures.append({"attempt":i+1,"status":status})
            if i<11:time.sleep(2)
          assert not failures,"PREDICTION_STILL_UNSTABLE "+str(failures)
          print("PREDICTION_HTTPS_12_REQUESTS_OK=true")
          PY
