name: Cut over Alibaba production signal to DeepSeek only
on:
  push:
    branches: [feature/zl-futures-bot-v1]
    paths: [.github/workflows/zl-deepseek-production-cutover.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zl-alibaba-prediction-singlehost
  cancel-in-progress: false
jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Validate cutover source syntax
        run: python -m py_compile prediction-bot-v1/aliyun_deepseek_prod_cutover.py prediction-bot-v1/aliyun_deepseek_cutover_launch.py
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Back up, cut over source selector to DeepSeek and verify local services
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          DEEPSEEK_CUTOVER_DRY_RUN: '0'
        run: python prediction-bot-v1/aliyun_deepseek_cutover_launch.py
      - name: Verify external production selection without placing an order
        env:
          ZL_PANEL_PASSWORD: ${{ secrets.ZL_PANEL_PASSWORD }}
        run: |
          python - <<'PY'
          import os,json,base64,urllib.request
          base='https://prediction.47-237-188-69.sslip.io'
          pwd=os.environ['ZL_PANEL_PASSWORD']
          auth='Basic '+base64.b64encode(('zl:'+pwd).encode()).decode()
          def get(path):
              req=urllib.request.Request(base+path,headers={'Authorization':auth,'Cache-Control':'no-store'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  assert r.status==200
                  return json.load(r)
          choice=get('/api/order-signal-model')
          directions=get('/api/direction-mode')
          main=get('/api/status')
          llm=get('/deepseek/api/status')
          assert choice['model']=='DEEPSEEK_5M_V1'
          assert [x['id'] for x in choice['models']]==['DEEPSEEK_5M_V1']
          assert list(directions['modes'])==['DEEPSEEK_5M_V1']
          assert main['orderSignalModel']=='DEEPSEEK_5M_V1'
          assert llm['model']=='DEEPSEEK_5M_V1' and llm['configured'] is True
          assert llm['realOrderEnabled'] is False and llm['tradeIntegration'] is False
          print('DEEPSEEK_PUBLIC_PRODUCTION_MODEL_EXCLUSIVE=true')
          print('DEEPSEEK_PUBLIC_DIRECTION_SOURCE_EXCLUSIVE=true')
          print('DEEPSEEK_PUBLIC_UP_MODE',directions['modes']['DEEPSEEK_5M_V1']['UP'])
          print('DEEPSEEK_PUBLIC_DOWN_MODE',directions['modes']['DEEPSEEK_5M_V1']['DOWN'])
          print('DEEPSEEK_PUBLIC_AUTO_FOLLOW_ENABLED',main.get('enabled'))
          print('DEEPSEEK_PUBLIC_TRADING_ISOLATED_FROM_PROVIDER=true')
          PY
