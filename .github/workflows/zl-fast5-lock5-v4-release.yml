name: FAST5 V4 five-second lock or WAIT production update
on:
  push:
    branches: [feat/deepseek40-45s-ai-only-prod-20261025]
    paths: [.github/workflows/zl-fast5-lock5-v4-release.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: zl-alibaba-prediction-singlehost
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify 5-second lock/WAIT, V4 source checks, clock, UI and guarded rollback
        run: |
          node --check prediction-bot-v1/fast5-real-market-calculator.mjs
          node --check prediction-bot-v1/fast5-real-market-service.mjs
          node --check prediction-bot-v1/fast5-dashboard-inject.mjs
          python -m py_compile prediction-bot-v1/fast5_prewarmlive_v4_deploy.py
          node --test prediction-bot-v1/fast5-prewarm-open1-v2.test.mjs prediction-bot-v1/fast5-prewarm-only-v3.test.mjs prediction-bot-v1/fast5-deadline5-v4.test.mjs prediction-bot-v1/fast5-dashboard-inject.test.mjs
  release:
    needs: [regression]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Guarded Alibaba production change (no orders, follow remains off)
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          python - <<'OUTER'
          import os,time,base64
          from alibabacloud_swas_open20200601.client import Client
          from alibabacloud_swas_open20200601 import models as sw
          from alibabacloud_tea_openapi import models as api
          sha=os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_REF_NAME']=='feat/deepseek40-45s-ai-only-prod-20261025'
          sh="""#!/bin/bash
          set -Eeuo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL --retry 2 --max-time 35 "https://raw.githubusercontent.com/zhoujunejune/pikpakzl/COMMIT_SHA/prediction-bot-v1/fast5_prewarmlive_v4_deploy.py" -o "$tmp/release.py"
          python3 -m py_compile "$tmp/release.py"
          python3 "$tmp/release.py" COMMIT_SHA
          """.replace('COMMIT_SHA',sha)
          c=Client(api.Config(access_key_id=os.environ['ALIBABA_CLOUD_ACCESS_KEY_ID'],access_key_secret=os.environ['ALIBABA_CLOUD_ACCESS_KEY_SECRET'],region_id='ap-southeast-1',endpoint='swas.ap-southeast-1.aliyuncs.com'))
          ident=c.run_command(sw.RunCommandRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',name='zl-fast5-prewarm120-5s-lock-v4',type='RunShellScript',working_user='root',command_content=sh,timeout=235)).body.invoke_id
          for _ in range(118):
           time.sleep(2)
           x=c.describe_invocation_result(sw.DescribeInvocationResultRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',invoke_id=ident)).body.invocation_result
           if x and str(x.invocation_status) in ('Success','Failed','Aborted','ExecutionTimeout','ExitCodeNonzero'):
            print('FAST5_V4_CLOUD_STATUS',x.invocation_status,'EXIT',x.exit_code)
            try:print(base64.b64decode(x.output or '',validate=True).decode('utf8','replace')[-13000:])
            except Exception:print('REMOTE_OUTPUT_UNAVAILABLE')
            if x.invocation_status!='Success' or int(x.exit_code)!=0:
             raise RuntimeError('FAST5_V4_REMOTE_DEPLOY_FAILED')
            break
          else:raise RuntimeError('FAST5_V4_REMOTE_TIMEOUT')
          OUTER
  verification:
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify live model, public page and user-controlled trading switch
        env:
          ZL_PANEL_PASSWORD: ${{ secrets.ZL_PANEL_PASSWORD }}
        run: |
          python - <<'PY'
          import os,base64,urllib.request,json
          origin='https://prediction.47-237-188-69.sslip.io'
          auth='Basic '+base64.b64encode(('zl:'+os.environ['ZL_PANEL_PASSWORD']).encode()).decode()
          def get(p):
           req=urllib.request.Request(origin+p,headers={'Authorization':auth,'Cache-Control':'no-store'})
           with urllib.request.urlopen(req,timeout=17) as resp:return resp.status,resp.read(300000)
          status,buf=get('/api/fast5-live-status')
          s=json.loads(buf);assert status==200 and s.get('ok')
          assert s.get('model')=='FAST5_SPOT_MOMENTUM_V1'
          assert s.get('strategyVersion')=='FAST5_PREWARM120_5S_V4'
          status,buf=get('/api/status');t=json.loads(buf)
          assert status==200 and t.get('orderSignalModel')=='FAST5_SPOT_MOMENTUM_V1'
          assert t.get('enabled') is False
          status,buf=get('/');page=buf.decode()
          assert status==200 and '本轮0.1～5秒锁定' in page
          assert 'id="zlFast5Card"' in page
          print('FAST5_V4_PUBLIC_UI_AND_SIGNAL_OK=true')
          print('FAST5_V4_PREWARM_ONLY_LABEL_PRESENT=true')
          print('FAST5_V4_AUTOFOLLOW_OFF_PRESERVED=true')
          PY
