name: Audit live TP SL failures and reattempts read only
on:
  push:
    branches: [audit/risk-failures-retries-20261023]
    paths:
      - .github/workflows/zl-risk-failure-retry-audit.yml
      - prediction-bot-v1/audit_live_risk_sell_retries_20261023.py
  workflow_dispatch:
permissions: {contents: read}
jobs:
  read_only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify Python, shell and audit-only behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast,subprocess
          p=Path('prediction-bot-v1/audit_live_risk_sell_retries_20261023.py')
          m=ast.parse(p.read_text())
          r=next(x.value.value for x in m.body if isinstance(x,ast.Assign)
             for v in x.targets if isinstance(v,ast.Name) and v.id=='REMOTE')
          assert subprocess.run(['bash','-n'],input=r,text=True,capture_output=True).returncode==0
          start=r.index("python3 - <<'PY'")+len("python3 - <<'PY'")
          end=r.index("\nPY",start)
          compile(r[start:end],'<read-only risk log audit>','exec')
          assert 'systemctl restart ' not in r
          assert 'place-order-bundle' not in r
          assert 'signedPost(' not in r
          print('RETRY_AUDIT_SAFETY_CHECK_OK=true')
          PY
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Read latest TP SL failures and actual retry timeline from Alibaba
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python prediction-bot-v1/audit_live_risk_sell_retries_20261023.py
