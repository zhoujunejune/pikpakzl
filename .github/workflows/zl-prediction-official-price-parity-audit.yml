name: Audit official prediction price provider vs live spot candles (read-only)
on:
  push:
    branches: [feat/deepseek40-45s-ai-only-prod-20261025]
    paths:
      - .github/workflows/zl-prediction-official-price-parity-audit.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Analyze market metadata and matching official versus spot prices without any production write
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          python - <<'OUTER'
          import os,base64,time
          from alibabacloud_swas_open20200601.client import Client
          from alibabacloud_swas_open20200601 import models as sw
          from alibabacloud_tea_openapi import models as api
          script=r"""#!/bin/bash
          set -eu
          python3 - <<'INNER'
          import json,urllib.request,urllib.parse,hmac,hashlib,statistics,subprocess,collections,os,time,math,re
          def get(port,path):
           try:
            with urllib.request.urlopen(f'http://127.0.0.1:{port}{path}',timeout=8) as r:return json.load(r)
           except Exception as e:return {'error':type(e).__name__}
          market=get(13003,'/api/shadow-market-data')
          off=get(13002,'/api/round-stats')
          st=get(13001,'/api/status')
          assert market.get('ok')==True and off.get('ok')==True
          records=[x for x in off.get('records',[]) if isinstance(x,dict)]
          vals=[]
          for x in records:
           audit=x.get('officialSettlementAudit') or {}
           try:
            r=int(x.get('roundStartMs'));a=float(audit.get('variantStartPrice'));b=float(audit.get('variantEndPrice'))
           except (ValueError,TypeError):continue
           if a>0 and b>0:
            vals.append({'r':r,'start':a,'end':b,'official':x.get('productionActual'),
             'topicId':x.get('predictionMarketTopicId') or audit.get('marketTopicId'),'actualSource':x.get('actualSource')})
          vals.sort(key=lambda z:z['r'])
          print('PARITY_OFFICIAL_ROWS',len(records),'OFFICIAL_PRICE_PAIRS',len(vals),'RANGE',([vals[0]['r'],vals[-1]['r']] if vals else []))
          print('PARITY_MARKET_CANDLE_KEYS',json.dumps({k:len(v) if isinstance(v,list) else type(v).__name__ for k,v in (market.get('candles') or {}).items()}))
          c5=(market.get('candles') or {}).get('5m') or []
          c1=(market.get('candles') or {}).get('1m') or []
          def cround(c):
           if not isinstance(c,dict):return None
           try:return int(c.get('startMs') or c.get('openTime') or 0)
           except:return None
          cindex={cround(x):x for x in c5 if isinstance(x,dict)}
          comparison=[]
          for a in vals:
           k=cindex.get(a['r'])
           if not k:continue
           try:
            ospt=float(k['open']);cspt=float(k['close'])
           except (ValueError,KeyError,TypeError):continue
           if ospt<=0 or cspt<=0:continue
           o=(ospt/a['start']-1)*10000;cl=(cspt/a['end']-1)*10000
           spotDir='UP' if cspt>ospt else 'DOWN' if cspt<ospt else 'FLAT'
           oracleDir='UP' if a['end']>a['start'] else 'DOWN' if a['end']<a['start'] else 'FLAT'
           comparison.append({'round':a['r'],'spotOpen':ospt,'officialStart':a['start'],
            'spotClose':cspt,'officialEnd':a['end'],'openGapBps':round(o,3),
            'closeGapBps':round(cl,3),'spotDirection':spotDir,
            'officialDirection':oracleDir,'directionMismatch':spotDir!=oracleDir,'closed':k.get('closed')})
          print('PARITY_MATCHED_ROUNDS',len(comparison),'DIRECTION_DISAGREE',sum(x['directionMismatch'] for x in comparison))
          print('PARITY_SAMPLES',json.dumps(comparison[-15:],ensure_ascii=False)[:8200])
          if comparison:
           print('PARITY_AGGREGATE',json.dumps({'medianOpenGapAbsBps':round(statistics.median(abs(x['openGapBps']) for x in comparison),3),
            'maxOpenGapAbsBps':round(max(abs(x['openGapBps']) for x in comparison),3),
            'medianCloseGapAbsBps':round(statistics.median(abs(x['closeGapBps']) for x in comparison),3),
            'maxCloseGapAbsBps':round(max(abs(x['closeGapBps']) for x in comparison),3),
            'mismatches':sum(x['directionMismatch'] for x in comparison)}))
          print('PARITY_LATEST_RECORD_IDS',json.dumps([{'round':v['r'],'topic':v['topicId']} for v in vals[-8:]],ensure_ascii=False))
          print('PARITY_LATEST_SPOT_SOURCE',(market.get('latest') or {}).get('source'))
          # Inspect the official settlement data path's deployed code for use of oracle provider, without logging credentials or entire source.
          roots=['/opt/zl-prediction-live']
          matches=[]
          from pathlib import Path
          for root in roots:
           for p in Path(root).rglob('*'):
            if len(matches)>45:break
            if not p.is_file() or p.suffix not in ('.mjs','.js','.py','.ts') or 'node_modules' in str(p):continue
            try:
             if p.stat().st_size>250000:continue
             s=p.read_text(encoding='utf-8',errors='replace')
            except:continue
            for no,l in enumerate(s.splitlines(),1):
             if any(k in l.lower() for k in ['pricefeedprovider','prediction/market/detail','variantstartprice','variantendprice']):
              if any(k in l.lower() for k in ['api_key','secret','authorization','token','private_key']):continue
              matches.append({'path':str(p).replace(root,'~'),'line':no,'snippet':l.strip()[:190]})
              if len(matches)>45:break
          print('PARITY_SOURCE_REFERENCES',json.dumps(matches[:45],ensure_ascii=False)[:9000])
          # Read configured Binance API client secrets ONLY inside the host; never print credentials.
          env={}
          for unit in ['zl-prediction-v2.service','zl-prediction-v3.service','zl-prediction-trade.service']:
           try:
            pid=int(subprocess.check_output(['systemctl','show','-p','MainPID','--value',unit],text=True,timeout=5).strip())
            if pid<=1:continue
            for row in open(f'/proc/{pid}/environ','rb').read().split(b'\0'):
             if b'=' not in row:continue
             k,v=row.split(b'=',1)
             name=k.decode('utf8','replace')
             if ('BINANCE' in name or 'PREDICTION' in name) and any(q in name for q in ['KEY','SECRET','BASE_URL']):
              env.setdefault(name,v.decode('utf8','replace'))
           except Exception:pass
          print('PARITY_BINANCE_ENV_KEYS_AVAILABLE',sorted(env.keys()))
          apiKey=next((env.get(n) for n in ['BINANCE_API_KEY','BINANCE_PREDICTION_API_KEY','PREDICTION_API_KEY','BINANCE_KEY'] if env.get(n)),None)
          secret=next((env.get(n) for n in ['BINANCE_API_SECRET','BINANCE_SECRET_KEY','BINANCE_API_SECRET_KEY','BINANCE_PREDICTION_API_SECRET','PREDICTION_API_SECRET'] if env.get(n)),None)
          # Only signed GET detail and only a recent known genuine topic; never mutate balances/orders.
          topic=next((str(x['topicId']) for x in reversed(vals) if str(x['topicId'] or '').isdigit()),None)
          if topic and apiKey and secret:
           q=urllib.parse.urlencode({'marketTopicId':topic,'timestamp':str(int(time.time()*1000)),'recvWindow':'5000'})
           sig=hmac.new(secret.encode(),q.encode(),hashlib.sha256).hexdigest()
           url='https://api.binance.com/sapi/v1/w3w/wallet/prediction/market/detail?'+q+'&signature='+sig
           req=urllib.request.Request(url,headers={'X-MBX-APIKEY':apiKey,'Accept':'application/json'})
           try:
            with urllib.request.urlopen(req,timeout=8) as resp:data=json.load(resp)
            if isinstance(data,dict) and isinstance(data.get('data'),dict):data=data['data']
            variant=(data.get('variantData') or {}) if isinstance(data,dict) else {}
            print('PARITY_SIGNED_MARKET_DETAIL',json.dumps({'marketTopicId':topic,
             'provider':variant.get('priceFeedProvider'),'feedId':variant.get('priceFeedId'),
             'feedSymbol':variant.get('priceFeedSymbol'),'startPrice':variant.get('startPrice'),
             'endPrice':variant.get('endPrice'),'status':data.get('status') if isinstance(data,dict) else None,
             'topKeys':sorted(data.keys()) if isinstance(data,dict) else []},ensure_ascii=False)[:1900])
           except Exception as e:
            msg=type(e).__name__
            if isinstance(e,urllib.error.HTTPError):msg+='_'+str(e.code)
            print('PARITY_SIGNED_MARKET_DETAIL_ERROR',msg)
          else:print('PARITY_SIGNED_MARKET_DETAIL_SKIPPED',json.dumps({'hasTopicId':bool(topic),'hasKey':bool(apiKey),'hasSecret':bool(secret)}))
          print('PARITY_AUDIT_READ_ONLY_COMPLETE=true')
          INNER
          """
          cli=Client(api.Config(access_key_id=os.environ['ALIBABA_CLOUD_ACCESS_KEY_ID'],access_key_secret=os.environ['ALIBABA_CLOUD_ACCESS_KEY_SECRET'],region_id='ap-southeast-1',endpoint='swas.ap-southeast-1.aliyuncs.com'))
          inv=cli.run_command(sw.RunCommandRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',name='zl-prediction-price-parity-only',type='RunShellScript',working_user='root',command_content=script,timeout=180)).body.invoke_id
          for _ in range(93):
           time.sleep(2)
           r=cli.describe_invocation_result(sw.DescribeInvocationResultRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',invoke_id=inv)).body.invocation_result
           if r and str(r.invocation_status) in ('Success','Failed','Aborted','ExecutionTimeout','ExitCodeNonzero'):
            out=base64.b64decode(r.output or '',validate=True).decode('utf8','replace')
            print('PARITY_REMOTE_STATUS',r.invocation_status,'EXIT',r.exit_code)
            print(out[-25000:])
            if int(r.exit_code)!=0:raise RuntimeError('PARITY_AUDIT_REMOTE_FAILED')
            break
          else:raise RuntimeError('PARITY_AUDIT_REMOTE_TIMED_OUT')
          OUTER
