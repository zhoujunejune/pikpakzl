name: Fix DeepSeek15 crossround AI locking Alibaba live
on:
  push:
    branches: [fix/deepseek15-crossround-20261022]
    paths: [.github/workflows/zl-deepseek15-crossround-production.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: zl-alibaba-ai15-crossround-singlehost
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check prediction-bot-v1/deepseek-single5-production.mjs
      - run: node --test prediction-bot-v1/deepseek-only15.test.mjs
      - run: python -m py_compile prediction-bot-v1/deploy_deepseek15_crossround.py
  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Fix next round after prior successful AI prediction (AI service only)
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python prediction-bot-v1/deploy_deepseek15_crossround.py
