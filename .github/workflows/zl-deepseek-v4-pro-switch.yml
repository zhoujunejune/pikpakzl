name: Switch DeepSeek production provider to V4 Pro safely
on:
  push:
    branches: [feature/zl-futures-bot-v1]
    paths:
      - .github/workflows/zl-deepseek-v4-pro-switch.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zl-alibaba-prediction-singlehost
  cancel-in-progress: false
jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify deployment script syntax
        run: python -m py_compile prediction-bot-v1/aliyun_deepseek_v4_pro_switch.py
      - name: Install Alibaba Cloud SDK
        run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Switch provider in existing Alibaba DeepSeek service
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python prediction-bot-v1/aliyun_deepseek_v4_pro_switch.py
