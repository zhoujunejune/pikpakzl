name: Guarded Alibaba DeepSeek AI-only 40s / submit 45s production release
on:
  push:
    branches: [feat/deepseek40-45s-ai-only-prod-20261025]
    paths:
      - .github/workflows/zl-deepseek40-ai-only-release.yml
      - prediction-bot-v1/aliyun_deepseek40_ai_only_deploy.py
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: zl-alibaba-prediction-singlehost
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify source scripts and hard AI causality test before deploy
        run: |
          python -m py_compile prediction-bot-v1/aliyun_deepseek40_ai_only_deploy.py
          node --check prediction-bot-v1/deepseek-adaptive15-core.mjs
          node --check prediction-bot-v1/deepseek-adaptive15-runner.mjs
          node --check prediction-bot-v1/deepseek-adaptive15-production-adapter.mjs
          node --test prediction-bot-v1/deepseek-ai-only40.test.mjs
  deploy:
    needs: [regression]
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install Alibaba SDK
        run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Guarded release only when current live 5-second source and follow OFF are verified
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python prediction-bot-v1/aliyun_deepseek40_ai_only_deploy.py
