name: Check FAST5 real production signals and order readiness read-only
on:
  push:
    branches: [feat/deepseek40-45s-ai-only-prod-20261025]
    paths: [.github/workflows/zl-fast5-order-readiness-audit-20261026.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Inspect signal, order, follow, mode, and served frontend state without placing orders
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          python - <<'OUTER'
          import os,time,base64
          from alibabacloud_swas_open20200601.client import Client
          from alibabacloud_swas_open20200601 import models as sw
          from alibabacloud_tea_openapi import models as api
          script=r"""#!/bin/bash
          set -eu
          python3 - <<'INNER'
          import json,time,urllib.request,subprocess
          now=int(time.time()*1000);round_=now//300000*300000
          print('ORDER_DIAG_CLOCK',json.dumps({'nowMs':now,'roundMs':round_,'elapsedSeconds':(now-round_)/1000}))
          def req(port,p):
           try:
            with urllib.request.urlopen('http://127.0.0.1:'+str(port)+p,timeout=6) as r:return r.status,json.loads(r.read(900000))
           except Exception as e:return getattr(e,'code',0),{'error':type(e).__name__+':'+str(e)[:90]}
          q=[
           (13001,'/api/status'),(13001,'/api/direction-mode'),
           (13001,'/api/order-signal-model'),(13001,'/api/fast5-live-status'),
           (13001,'/api/fast5-round-stats'),(13001,'/api/round-stats'),
           (13046,'/api/status'),(13047,'/api/round-stats'),
           (13001,'/healthz')]
          for port,p in q:
           code,j=req(port,p)
           if p=='/api/status' and port==13001:
            keys=['ok','enabled','autoConfirmEnabled','autoConfirmHalted','signal',
                  'productionSignal','orderSignal','orderMappingMode','orderProductionSource',
                  'directionModeReady','orderSignalModel','orderSignalModelReady',
                  'orderSignalModelEffectiveAfterRound','startAfterRound','orderDirectionPolicy',
                  'signalTransport','mode','quoteMode','autoConfirmEnabled']
            d={k:j.get(k) for k in keys if k in j}
            d['pendingState']=(j.get('pendingAction') or {}).get('state')
            d['pendingRound']=(j.get('pendingAction') or {}).get('round')
            d['pendingError']=(j.get('pendingAction') or {}).get('error')
            d['lastOrder']={k:(j.get('lastOrder') or {}).get(k) for k in ['status','round','signal','productionSignal','orderSignal','state','error','code','at','createdAt','updatedAt','submittedAt','exchangeStatus']}
           elif p=='/api/fast5-live-status' or port==13046:
            d={k:j.get(k) for k in ['ok','model','strategyVersion','round','locked','latestError',
                'lastError','lastRequestMs','lastFetchAt','fetchAttempts','prewarmReady','prewarmTickCount',
                'observedSamples','provisionalDirection']}
            d['latest']={k:(j.get('latest') or {}).get(k) for k in ['round','direction','status','lockedAt',
                'marketAt','prewarmOnly','signalReason','strategyVersion']}
           elif p=='/api/fast5-round-stats' or port==13047:
            d={k:j.get(k) for k in ['ok','schema','model','summary','health']}
            d['lastRows']=[{k:x.get(k) for k in ['round','decision','locked_at','official_result',
               'settled_at','decision_reason']} for x in (j.get('rows') or [])[:10]]
           elif p=='/api/round-stats':
            d={'ok':j.get('ok'),'recordCount':len(j.get('records') or []),'lastRecords':
               [{k:x.get(k) for k in ['roundStartMs','productionActual','settledAt',
                  'productionModel']} for x in (j.get('records') or [])[:3]]}
           elif p=='/api/direction-mode':d={k:j.get(k) for k in ['ok','ready','modes','effectiveAfterRound','updatedAt']}
           else:d={k:j.get(k) for k in ['ok','status','model','ready','error','service']}
           print('ORDER_DIAG_ENDPOINT',json.dumps({'port':port,'route':p,'code':code,'result':d},ensure_ascii=False,default=str)[:7000])
          for service in ['zl-prediction-trade','zl-prediction-fast5','zl-prediction-fast5-stats','zl-prediction-v2','zl-prediction-v3']:
           o=subprocess.run(['systemctl','is-active',service],capture_output=True,text=True,timeout=4)
           print('ORDER_DIAG_SERVICE',service,o.stdout.strip())
          # Inspect served JavaScript and DOM identifiers without credentials
          for route in ['/','/panel-client.js?v=8']:
           try:
            with urllib.request.urlopen('http://127.0.0.1:13001'+route,timeout=8) as r:
             body=r.read(1200000).decode('utf8','replace');status=r.status
            words=['panel-client.js','currentRound','productionSignal','orderSignal','Score',
                   'score','function refresh','setInterval(refresh','api/status','id="round"',
                   'id="signal"','refresh()','AUTO_CONFIRM']
            print('ORDER_DIAG_UI',json.dumps({'route':route,'code':status,'length':len(body),
              'tokens':{word:body.find(word) for word in words}},ensure_ascii=False))
           except Exception as e:print('ORDER_DIAG_UI_ERROR',route,type(e).__name__,str(e)[:80])
          INNER
          """
          cli=Client(api.Config(access_key_id=os.environ['ALIBABA_CLOUD_ACCESS_KEY_ID'],access_key_secret=os.environ['ALIBABA_CLOUD_ACCESS_KEY_SECRET'],region_id='ap-southeast-1',endpoint='swas.ap-southeast-1.aliyuncs.com'))
          inv=cli.run_command(sw.RunCommandRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',name='zl-fast5-order-readiness-readonly',type='RunShellScript',working_user='root',command_content=script,timeout=90)).body.invoke_id
          for _ in range(55):
           time.sleep(2)
           a=cli.describe_invocation_result(sw.DescribeInvocationResultRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',invoke_id=inv)).body.invocation_result
           if a and str(a.invocation_status) in ('Success','Failed','Aborted','ExecutionTimeout','ExitCodeNonzero'):
            print('FAST5_ORDER_READONLY_AUDIT',a.invocation_status,'EXIT',a.exit_code)
            print(base64.b64decode(a.output or '',validate=True).decode('utf8','replace')[-20500:])
            if int(a.exit_code)!=0:raise RuntimeError('FAILED_READONLY_INSPECT')
            break
          else:raise RuntimeError('INSPECT_TIMEOUT')
          OUTER
