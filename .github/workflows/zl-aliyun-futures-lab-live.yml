name: ZL Futures Lab - Live Public Market Shadow Deploy
on:
  push:
    branches: [feature/zl-futures-bot-v1]
    paths:
      - ".github/workflows/zl-aliyun-futures-lab-live.yml"
      - "futures-research-panel/live_shadow.py"
      - "futures-research-panel/test_live_shadow.py"
      - "futures-research-panel/install_live_shadow.sh"
      - "futures-research-panel/aliyun_live_deploy.py"
permissions:
  contents: read
concurrency:
  group: zl-research-live-standalone
  cancel-in-progress: false
jobs:
  isolated-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Verify public-only forward model and browser without exchange keys
        run: |
          bash -n futures-research-panel/install_live_shadow.sh
          python -m py_compile futures-research-panel/live_shadow.py futures-research-panel/aliyun_live_deploy.py
          python -m unittest discover -s futures-research-panel -p test_live_shadow.py -v
          python - <<'PY'
          import pathlib
          s=pathlib.Path('futures-research-panel/live_shadow.py').read_text()
          assert "/fapi/v1/order" not in s and 'BINANCE_API_SECRET' not in s
          assert 'urllib.request.Request' in s
          assert 'def do_POST' in s and 'self.send_error(405)' in s
          i=pathlib.Path('futures-research-panel/install_live_shadow.sh').read_text()
          assert 'systemctl restart zl-futures-bot-paper' not in i
          assert 'systemctl restart zl-prediction-trade' not in i
          assert 'MainPID' in i
          html=pathlib.Path('futures-research-panel/index.html').read_text()
          assert '/futures-lab/live.json' in html
          print('LIVE_PUBLIC_MARKET_READ_ONLY_CHECKS=PASS')
          PY
      - name: Install Alibaba SWAS SDK on GitHub runner only
        run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Deploy isolated public-data shadow process (never restarts production)
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: \${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: \${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python futures-research-panel/aliyun_live_deploy.py
      - name: Verify authenticated forward-paper data and actual source freshness
        env:
          ZL_PANEL_PASSWORD: \${{ secrets.ZL_PANEL_PASSWORD }}
        run: |
          python - <<'PY'
          import os,urllib.request,urllib.error,json,base64,time
          base='https://47-237-188-69.sslip.io'
          try:
           urllib.request.urlopen(base+'/futures-lab/live.json',timeout=15)
           raise AssertionError('Anonymous shadow status must not be exposed')
          except urllib.error.HTTPError as e:
           assert e.code==401
          pwd=os.environ['ZL_PANEL_PASSWORD']
          auth='Basic '+base64.b64encode(('zl:'+pwd).encode()).decode()
          def get(path):
           req=urllib.request.Request(base+path,headers={'Authorization':auth})
           with urllib.request.urlopen(req,timeout=20) as r:return json.load(r)
          latest={}
          for attempt in range(5):
           latest=get('/futures-lab/live.json')
           assert latest.get('kind')=='live_paper_forward_test'
           assert latest.get('realOrders') is False
           assert len(latest.get('streams',[]))==9
           if latest.get('fresh') and len(latest.get('market',{}))==3:break
           time.sleep(12)
          print('LIVE_SHADOW_REAL_ORDERS',latest.get('realOrders'))
          print('LIVE_SHADOW_STREAM_COUNT',len(latest.get('streams',[])))
          print('LIVE_SHADOW_MARKET_FRESH',latest.get('fresh'))
          print('LIVE_SHADOW_MARKETS',sorted(latest.get('market',{})))
          print('LIVE_SHADOW_ERROR_CLASS',(latest.get('error') or '').split(':')[0][:50])
          assert latest.get('fresh') is True,'LIVE_FEED_NOT_YET_VERIFIED'
          prod=get('/status')
          assert prod.get('mode')=='live'
          print('PRODUCTION_ENGINE_STILL_LIVE_MODE=true')
          print('READ_ONLY_3PAIR_SIMULATION_VALIDATED=true')
          PY
