name: FAST10 fix bounded real round-open revisions (follow OFF only)
on:
  push:
    branches: [feat/deepseek-prewarm-fast10-20261021]
    paths: [.github/workflows/zl-deepseek-fast10-open-revision-hotfix.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zl-alibaba-prediction-singlehost
  cancel-in-progress: false
jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify corrected current-round open semantics and regression suite
        run: |
          python -m py_compile prediction-bot-v1/aliyun_fast10_open_revision_hotfix.py
          node --test prediction-bot-v1/deepseek-fast10-shadow-core.test.mjs
          node --test prediction-bot-v1/deepseek-fast10-shadow-runner.test.mjs
          node --test prediction-bot-v1/deepseek-fast10-production-adapter.test.mjs
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Hotfix existing FAST10 provider only; preserve follow OFF and rollback on error
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python prediction-bot-v1/aliyun_fast10_open_revision_hotfix.py
