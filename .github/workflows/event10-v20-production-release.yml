name: EVENT10 V20 production signal-only release
on:
  push:
    branches: [feature/zl-futures-bot-v1]
    paths: ['.github/workflows/event10-v20-production-release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check event10-bot/pure-signal.mjs
          node --check event10-bot/manual-engine.mjs
          node --test event10-bot/v20-entry-position.test.mjs event10-bot/alert-watch.test.mjs
  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Guarded signal-only Alibaba Cloud deployment
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          python - <<'PY'
          import base64,os,re,time
          from alibabacloud_swas_open20200601.client import Client
          from alibabacloud_swas_open20200601 import models as sw
          from alibabacloud_tea_openapi import models as api
          sha=os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_REF_NAME']=='feature/zl-futures-bot-v1'
          assert re.fullmatch(r'[0-9a-f]{40}',sha)
          client=Client(api.Config(access_key_id=os.environ['ALIBABA_CLOUD_ACCESS_KEY_ID'],
              access_key_secret=os.environ['ALIBABA_CLOUD_ACCESS_KEY_SECRET'],
              region_id='ap-southeast-1',endpoint='swas.ap-southeast-1.aliyuncs.com'))
          remote=f"""#!/bin/bash
          set -Eeuo pipefail
          stage=$(mktemp -d /tmp/event10-v20-XXXXXXXX)
          trap 'rm -rf "$stage"' EXIT
          curl -fsSL --max-time 35 "https://raw.githubusercontent.com/zhoujunejune/pikpakzl/{sha}/event10-bot/aliyun_high_selectivity_only.py" -o "$stage/deploy.py"
          python3 -m py_compile "$stage/deploy.py"
          python3 "$stage/deploy.py" {sha}
          """
          res=client.run_command(sw.RunCommandRequest(region_id='ap-southeast-1',
              instance_id='b67374069bb3457ba6a3a2ede9305d3f',
              name='event10-v20-entry-signal-only',
              type='RunShellScript',working_user='root',command_content=remote,timeout=370))
          for _ in range(160):
              time.sleep(2)
              result=client.describe_invocation_result(sw.DescribeInvocationResultRequest(
                  region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',
                  invoke_id=res.body.invoke_id)).body.invocation_result
              if result and str(result.invocation_status) in ('Success','Failed','Aborted','ExecutionTimeout','ExitCodeNonzero'):
                  output=base64.b64decode(result.output or '').decode('utf-8','replace')
                  for line in output.splitlines():
                      if line.startswith('EVENT10_HS_'):print(line,flush=True)
                  assert str(result.invocation_status)=='Success' and int(result.exit_code)==0
                  assert 'EVENT10_HS_DEPLOY_SUCCEEDED=true' in output
                  break
          else:raise RuntimeError('DEPLOY_RESULT_UNCONFIRMED')
          PY
      - name: Verify service version and safety gates
        env:
          ZL_PANEL_PASSWORD: ${{ secrets.ZL_PANEL_PASSWORD }}
        run: |
          python - <<'PY'
          import base64,os,json,urllib.request
          pw=os.environ['ZL_PANEL_PASSWORD']
          auth='Basic '+base64.b64encode(('zl:'+pw).encode()).decode()
          def get(route):
              req=urllib.request.Request('https://prediction.47-237-188-69.sslip.io'+route,
                  headers={'Authorization':auth,'Cache-Control':'no-store'})
              with urllib.request.urlopen(req,timeout=20) as r:return json.load(r)
          s=get('/event10/api/status')
          l=get('/event10/api/signals?limit=1&offset=0')
          assert s['decisionReviewVersion']=='EVENT10_ENTRY_POSITION_V20_20261111'
          assert l['version']==s['decisionReviewVersion']
          assert s['providerModel']=='PURE_SIGNAL_V20_ENTRY_POSITION'
          assert s['autoTradingEnabled'] is False and s['modelCalls']==0
          assert s['minSignalGapMs']==600000
          print('V20_PRODUCTION_VERIFIED=true',flush=True)
          PY
