name: Restore prediction frontend availability from original backup
on:
  push:
    branches: [feature/zl-futures-bot-v1]
    paths: [.github/workflows/zl-restore-prediction-panel.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m py_compile prediction-bot-v1/aliyun_restore_prediction_panel.py
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Restore original UI while preserving active DeepSeek production model
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python prediction-bot-v1/aliyun_restore_prediction_panel.py
