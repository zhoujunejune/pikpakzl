name: Audit real DeepSeek lock-time accuracy across 15-40s and conflict conditions
on:
  push:
    branches: [feat/deepseek40-45s-ai-only-prod-20261025]
    paths: [.github/workflows/zl-deepseek40-real-accuracy-quality-audit.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Read-only settled predictor accuracy including 25-40s late locks
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          python - <<'OUTER'
          import os,base64,time
          from alibabacloud_swas_open20200601.client import Client
          from alibabacloud_swas_open20200601 import models as sw
          from alibabacloud_tea_openapi import models as api
          sh=r"""#!/bin/bash
          set -eu
          python3 - <<'INNER'
          from pathlib import Path
          import json,collections,statistics,urllib.request
          root=Path('/var/lib/zl-prediction/deepseek5')
          def read(name):
           p=root/name
           return json.loads(p.read_text()) if p.exists() else {}
          learner=read('learning.json')
          quality=read('quality-v1.json')
          preds=learner.get('predictions') or []
          records=quality.get('records') or []
          done=[r for r in preds if r.get('direction') in ('UP','DOWN') and r.get('actual') in ('UP','DOWN')
            and r.get('settledAt') is not None]
          print('ACCURACY_SOURCE_ROWS',json.dumps({'learnerTotal':len(preds),'officialSettledAll':len(done),'qualityRecords':len(records),
            'qualitySettled':sum(r.get('actual') in ('UP','DOWN') for r in records)}))
          def aggregate(xs):
           n=len(xs);correct=sum(r['direction']==r['actual'] for r in xs)
           return {'rounds':n,'hit':correct,'miss':n-correct,'rate':round(correct/n,4) if n else None}
          print('ACCURACY_ALL_SETTLED',json.dumps(aggregate(done)))
          for days in [1,2,3]:
           if not done:continue
           end=max(int(p['round']) for p in done)
           subset=[p for p in done if p['round']>end-days*86400000]
           print('ACCURACY_LAST_DAYS',days,json.dumps(aggregate(subset)))
          bins=[(15000,25000),(25000,30000),(30000,35000),(35000,40000)]
          for a,b in bins:
           items=[p for p in done if a<=int(p.get('signalLatencyMs') or -1)<b]
           print('ACCURACY_LOCK_BIN',json.dumps({'startMs':a,'endMs':b,**aggregate(items)}))
          for direction in ['UP','DOWN']:
           print('ACCURACY_DIRECTION',direction,json.dumps(aggregate([p for p in done if p['direction']==direction])))
          for regime in ['TREND_UP','TREND_DOWN','MIXED','UNKNOWN']:
           print('ACCURACY_REGIME',regime,json.dumps(aggregate([p for p in done if p.get('featureRegime')==regime])))
          qmap={r['round']:r for r in records if r.get('actual') in ('UP','DOWN')}
          subset=[(p,qmap[p['round']]) for p in done if p['round'] in qmap]
          for relation in ['AGREES_EARLY','CONFLICTS_EARLY','EARLY_UNKNOWN']:
           items=[]
           for p,q in subset:
            bs=(q.get('decisionContext') or {}).get('fromOpenBps')
            if not isinstance(bs,(int,float)) or bs==0:key='EARLY_UNKNOWN'
            else:key='AGREES_EARLY' if (bs>0)==(p['direction']=='UP') else 'CONFLICTS_EARLY'
            if key==relation:items.append(p)
           print('ACCURACY_EARLY_RELATION',relation,json.dumps(aggregate(items)))
          by_calls=collections.Counter()
          for p in done:by_calls[str(p.get('attemptCount'))]+=1
          print('ACCURACY_MODEL_CALL_COUNTS',dict(by_calls))
          api={}
          try:
           with urllib.request.urlopen('http://127.0.0.1:13029/api/status',timeout=7) as z:api=json.load(z)
          except Exception as e:print('ACCURACY_API_ERROR',type(e).__name__)
          print('ACCURACY_PRODUCTION_RUNTIME',json.dumps({'model':api.get('providerModel'),'configured':api.get('configured'),
           'decisionRule':api.get('decisionRule'),'analysisCalls':api.get('analysisModelCalls'),
           'liveError':api.get('error'),'lastApiLatencyMs':api.get('lastApiLatencyMs'),
           'featureReady':api.get('featureReady')}))
          print('ACCURACY_AUDIT_READONLY_COMPLETE=true')
          INNER
          """
          cli=Client(api.Config(access_key_id=os.environ['ALIBABA_CLOUD_ACCESS_KEY_ID'],access_key_secret=os.environ['ALIBABA_CLOUD_ACCESS_KEY_SECRET'],region_id='ap-southeast-1',endpoint='swas.ap-southeast-1.aliyuncs.com'))
          inv=cli.run_command(sw.RunCommandRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',name='zl-deepseek-full-accuracy-readonly',type='RunShellScript',working_user='root',command_content=sh,timeout=115)).body.invoke_id
          for _ in range(65):
           time.sleep(2)
           r=cli.describe_invocation_result(sw.DescribeInvocationResultRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',invoke_id=inv)).body.invocation_result
           if r and str(r.invocation_status) in ('Success','Failed','Aborted','ExecutionTimeout','ExitCodeNonzero'):
            out=base64.b64decode(r.output or '',validate=True).decode('utf8','replace')
            print('ACCURACY_REMOTE',r.invocation_status,r.exit_code);print(out[-16000:])
            if int(r.exit_code)!=0:raise RuntimeError('ACCURACY_AUDIT_FAILED')
            break
          else:raise RuntimeError('ACCURACY_AUDIT_TIMEOUT')
          OUTER
