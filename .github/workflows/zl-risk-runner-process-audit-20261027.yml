name: Inspect live risk worker process and exact TP eligibility (read-only)
on:
  push:
    branches: [feat/deepseek40-45s-ai-only-prod-20261025]
    paths: [.github/workflows/zl-risk-runner-process-audit-20261027.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Only inspect risk runner location, no order endpoints
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          python - <<'OUTER'
          import os,time,base64
          from alibabacloud_swas_open20200601.client import Client
          from alibabacloud_swas_open20200601 import models as sw
          from alibabacloud_tea_openapi import models as api
          sh=r"""#!/bin/bash
          set -eu
          python3 - <<'INNER'
          import pathlib,subprocess,json,urllib.request
          def pr(label,x):print(label,json.dumps(x,ensure_ascii=False,default=str)[:9500])
          for command in [
           ['systemctl','show','zl-prediction-trade.service','--property=ExecStart,WorkingDirectory,MainPID,FragmentPath'],
           ['docker','ps','--format','{{.Names}} | {{.Status}} | {{.Image}}'],
           ['ps','-eo','pid,comm,args']
          ]:
           try:
            r=subprocess.run(command,capture_output=True,text=True,timeout=8)
            if command[0]=='ps':
             entries=[{'pid':line.split(None,2)[0], 'comm':line.split(None,2)[1]} for line in r.stdout.splitlines()[1:] if len(line.split(None,2))>=3 and any(v in line.lower() for v in ('risk-worker','risk-runner','tp50-worker','tp50-runner'))]
             pr('RISK_PROCESS',entries)
            elif command[0]=='docker':
             pr('RISK_DOCKER_PS',{'available':r.returncode==0,'containers':r.stdout.splitlines()[:18]})
            else:
             # Keep only unit metadata (may include paths, not environment secrets).
             pr('RISK_TRADE_UNIT',{'raw':r.stdout[:900]})
           except Exception as e:pr('RISK_INSPECT_ERR',{'cmd':command[0],'error':type(e).__name__})
          # Read high-level worker status from deployed risk API if any.
          for route in ('/api/risk-control','/api/take-profit-control'):
           try:
            with urllib.request.urlopen('http://127.0.0.1:13001'+route,timeout=6) as res:d=json.load(res)
            pr('RISK_API_CONFIRM',{'route':route,'tpEnabled':d.get('takeProfitEnabled',d.get('enabled')),
                 'tpPercent':d.get('takeProfitPercent',d.get('percent')),
                 'slEnabled':d.get('stopLossEnabled'),
                 'persistenceHealthy':d.get('persistenceHealthy'),
                 'updatedAt':d.get('updatedAt')})
           except Exception as e:pr('RISK_API_ERROR',{'route':route,'error':type(e).__name__})
          INNER
          """
          cli=Client(api.Config(access_key_id=os.environ['ALIBABA_CLOUD_ACCESS_KEY_ID'],access_key_secret=os.environ['ALIBABA_CLOUD_ACCESS_KEY_SECRET'],region_id='ap-southeast-1',endpoint='swas.ap-southeast-1.aliyuncs.com'))
          inv=cli.run_command(sw.RunCommandRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',name='zl-risk-worker-process-readonly',type='RunShellScript',working_user='root',command_content=sh,timeout=115)).body.invoke_id
          for _ in range(64):
           time.sleep(2)
           x=cli.describe_invocation_result(sw.DescribeInvocationResultRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',invoke_id=inv)).body.invocation_result
           if x and str(x.invocation_status) in ('Success','Failed','Aborted','ExecutionTimeout','ExitCodeNonzero'):
            print('RISK_RUNTIME_AUDIT_REMOTE',x.invocation_status,x.exit_code)
            print(base64.b64decode(x.output or '',validate=True).decode('utf8','replace')[-10000:])
            if int(x.exit_code)!=0:raise RuntimeError('RISK_WORKER_AUDIT_FAILED')
            break
          else:raise RuntimeError('RISK_WORKER_AUDIT_TIMEOUT')
          OUTER
