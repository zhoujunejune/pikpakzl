name: FAST5 PREWARM120 opening-second upgrade (guarded)
on:
  push:
    branches: [feat/deepseek40-45s-ai-only-prod-20261025]
    paths:
      - .github/workflows/zl-fast5-prewarm120-v2-release.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: zl-alibaba-prediction-singlehost
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Check source syntax and fast first-second market regression
        run: |
          node --check prediction-bot-v1/fast5-real-market-calculator.mjs
          node --check prediction-bot-v1/fast5-real-market-service.mjs
          node --check prediction-bot-v1/fast5-dashboard-inject.mjs
          python -m py_compile prediction-bot-v1/fast5_prewarmlive_v2_deploy.py
          node --test prediction-bot-v1/fast5-prewarm-open1-v2.test.mjs prediction-bot-v1/fast5-dashboard-inject.test.mjs
  deploy:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Install guarded FAST5 V2 through Alibaba Cloud Assistant, follow remains OFF
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          python - <<'OUTER'
          import base64,os,time
          from alibabacloud_swas_open20200601.client import Client
          from alibabacloud_swas_open20200601 import models as sw
          from alibabacloud_tea_openapi import models as api
          sha=os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_REF_NAME']=='feat/deepseek40-45s-ai-only-prod-20261025'
          sh="""#!/bin/bash
          set -Eeuo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL --retry 2 --max-time 35 "https://raw.githubusercontent.com/zhoujunejune/pikpakzl/COMMIT_SHA/prediction-bot-v1/fast5_prewarmlive_v2_deploy.py" -o "$tmp/release.py"
          python3 -m py_compile "$tmp/release.py"
          python3 "$tmp/release.py" COMMIT_SHA
          """.replace('COMMIT_SHA',sha)
          c=Client(api.Config(access_key_id=os.environ['ALIBABA_CLOUD_ACCESS_KEY_ID'],access_key_secret=os.environ['ALIBABA_CLOUD_ACCESS_KEY_SECRET'],region_id='ap-southeast-1',endpoint='swas.ap-southeast-1.aliyuncs.com'))
          ident=c.run_command(sw.RunCommandRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',name='zl-fast5-prewarm120-opening-second-v2',type='RunShellScript',working_user='root',command_content=sh,timeout=230)).body.invoke_id
          for _ in range(115):
           time.sleep(2)
           x=c.describe_invocation_result(sw.DescribeInvocationResultRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',invoke_id=ident)).body.invocation_result
           if x and str(x.invocation_status) in ('Success','Failed','Aborted','ExecutionTimeout','ExitCodeNonzero'):
            try:out=base64.b64decode(x.output or '',validate=True).decode('utf8','replace')
            except Exception:out='REMOTE_OUTPUT_DECODE_FAILED'
            print('FAST5_V2_CLOUD_REMOTE_STATUS',x.invocation_status,'EXIT',x.exit_code)
            print(out[-12000:])
            if x.invocation_status!='Success' or int(x.exit_code)!=0:raise RuntimeError('FAST5_PREWARM_V2_RELEASE_FAILED')
            break
          else:raise RuntimeError('FAST5_PREWARM_V2_RELEASE_TIMEOUT')
          OUTER
  verify:
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify authenticated public FAST5 V2 and unchanged order controls
        env:
          ZL_PANEL_PASSWORD: ${{ secrets.ZL_PANEL_PASSWORD }}
        run: |
          python - <<'PY'
          import os,base64,urllib.request,json
          origin='https://prediction.47-237-188-69.sslip.io'
          auth='Basic '+base64.b64encode(('zl:'+os.environ['ZL_PANEL_PASSWORD']).encode()).decode()
          def get(path):
           req=urllib.request.Request(origin+path,headers={'Authorization':auth,'Cache-Control':'no-store'})
           with urllib.request.urlopen(req,timeout=16) as r:return r.status,r.read(600000)
          status,body=get('/api/fast5-live-status')
          s=json.loads(body)
          assert status==200 and s.get('ok') and s.get('model')=='FAST5_SPOT_MOMENTUM_V1'
          assert s.get('strategyVersion')=='FAST5_PREWARM120_OPEN1_V2'
          assert s.get('requiresDeepSeek') is False and s.get('orders') is False
          status,body=get('/api/status')
          t=json.loads(body)
          assert status==200 and t.get('enabled') is False
          assert t.get('orderSignalModel')=='FAST5_SPOT_MOMENTUM_V1'
          status,body=get('/')
          html=body.decode('utf8','replace')
          assert status==200 and '上一轮倒数120秒预分析' in html
          assert 'id="zlFast5Card"' in html and 'id="zlDeepSeek40Card"' not in html
          print('FAST5_PREWARM_V2_PUBLIC_VERIFIED=true')
          print('FAST5_PREWARM_V2_NO_DEEPSEEK=true')
          print('FAST5_PREWARM_V2_AUTOFOLLOW_OFF=true')
          print('FAST5_PREWARM_V2_POLL_LAST_REQUEST_MS',s.get('lastRequestMs'))
          PY
