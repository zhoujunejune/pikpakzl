name: EVENT10 V21 live-index triple-signal preproduction CI
on:
  push:
    branches: [feature/zl-futures-bot-v1]
    paths: ['.github/workflows/event10-v20-entry-ci.yml','event10-bot/v20-entry-position.test.mjs','event10-bot/pure-signal.mjs','event10-bot/pure-signal-v19.mjs','event10-bot/manual-engine.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Static and executable V20 tests
        run: |
          node --check event10-bot/pure-signal.mjs
          node --check event10-bot/pure-signal-v19.mjs
          node --check event10-bot/manual-engine.mjs
          node --check event10-bot/server.mjs
          node --test event10-bot/v21-live-index-triple.test.mjs event10-bot/alert-watch.test.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path("event10-bot/pure-signal.mjs").read_text()
          e=Path("event10-bot/manual-engine.mjs").read_text()
          assert "EVENT10_LIVE_INDEX_3_PER_10M_V21_20261112" in p
          assert "AUTO_SLOT_MS=12_000" in p
          assert "currentPriceUsedForDirection:true" in p
          assert "MAX_SIGNALS_PER_10M = 3" in e
          assert 'V21_ROLLING_10M_CAP' in e
          assert 'auto-12s-' in e
          assert "OPENAI_API_KEY" not in p and "api.deepseek.com" not in p
          assert "autoTradingEnabled:false" in e
          assert 'h.decisionReviewVersion==="EVENT10_PURE_RULE_V19_20261107"' in e
          assert "scoreProxy(h.openPrice,price,h.direction)" in e
          print("V21_TRIPLE_SIGNAL_PREPRODUCTION_PASS=true")
          PY
