name: Deploy TP SL final-order confirmation and safe recovery guarded
on:
  push:
    branches: [fix/risk-sell-postsubmit-recovery-20261023]
    paths:
      - .github/workflows/zl-risk-postsubmit-production.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: zl-alibaba-risk-exits
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check railway-diagnostic/risk-worker.mjs
      - run: node --check railway-diagnostic/risk-sell-finality.mjs
      - run: node --test railway-diagnostic/risk-sell-finality.test.mjs railway-diagnostic/risk-sell-postsubmit-recovery.test.mjs railway-diagnostic/risk-sell-safe-retry.test.mjs railway-diagnostic/risk-sell-retry.test.mjs railway-diagnostic/risk-worker-speed.test.mjs railway-diagnostic/real-risk-monitor.test.mjs
      - name: Verify restart guard, persistence and rollback shell
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast,subprocess
          s=Path('prediction-bot-v1/deploy_risk_postsubmit_confirmation_20261023.py').read_text()
          m=ast.parse(s)
          sh=next(x.value.value for x in m.body if isinstance(x,ast.Assign)
            for t in x.targets if isinstance(t,ast.Name) and t.id=='REMOTE')
          p=subprocess.run(['bash','-n'],input=sh,text=True,capture_output=True)
          assert p.returncode==0,p.stderr
          for invariant in [
            'POSTSELL_SAFE_30S_IDLE_WINDOW=true',
            'UNEXPECTED_LIVE_RISK_WORKER_SOURCE_DRIFT',
            'POSTSELL_ROLLBACK_BLOCKED_PENDING_REAL_ORDER',
            'POSTSELL_LIVE_DURABLE_PENDING_FENCE=true',
            'USER_RISK_CONTROLS_CHANGED',
            "test ! -e \"$STATEDIR\""]:
            assert invariant in sh,invariant
          assert 'systemctl restart zl-prediction-trade.service' not in sh
          assert 'systemctl restart zl-futures-bot-paper.service' not in sh
          print('POSTSELL_DEPLOY_SAFETY_GUARDS_VALID=true')
          PY
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Update only Binance prediction risk-worker during safe no-position window
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python prediction-bot-v1/deploy_risk_postsubmit_confirmation_20261023.py
