name: Guardian 5M isolated safety regression
on:
  pull_request:
    paths:
      - 'railway-diagnostic/guardian-*.mjs'
      - 'railway-diagnostic/risk-*.mjs'
      - 'railway-diagnostic/control-shell.mjs'
      - 'railway-diagnostic/wrapper.mjs'
      - 'prediction-bot-v1/guardian5-*.mjs'
      - 'prediction-bot-v1/aliyun_guardian_runtime_diff_audit.py'
      - '.github/workflows/guardian5-live-regression.yml'
  workflow_dispatch:
jobs:
  guardian5-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check prediction-bot-v1/guardian5-live-bridge.mjs
          node --check railway-diagnostic/guardian-live-bridge.mjs
          node --check railway-diagnostic/control-shell.mjs
          node --check railway-diagnostic/wrapper.mjs
          node --check railway-diagnostic/risk-runner.mjs
          node --check railway-diagnostic/risk-worker.mjs
      - run: node --test railway-diagnostic/guardian-live-bridge.test.mjs railway-diagnostic/guardian-risk-integration.test.mjs railway-diagnostic/guardian-live-risk-readiness.test.mjs

  aliyun-readonly-preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Read-only Alibaba GUARDIAN preflight (no order submission or deployment)
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          test -n "$ALIBABA_CLOUD_ACCESS_KEY_ID"
          test -n "$ALIBABA_CLOUD_ACCESS_KEY_SECRET"
          python prediction-bot-v1/aliyun_guardian_preflight.py
          python prediction-bot-v1/aliyun_guardian_runtime_diff_audit.py
