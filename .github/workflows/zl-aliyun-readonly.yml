name: Alibaba SWAS READ-ONLY API check
on:
  push:
    branches: [feature/zl-futures-bot-v1]
    paths:
      - '.github/workflows/zl-aliyun-readonly.yml'
      - 'futures-bot-v1/aliyun_readonly.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  swas-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Alibaba Cloud SWAS API SDK
        run: python -m pip install --disable-pip-version-check alibabacloud_swas_open20200601==4.0.0
      - name: Read-only server lookup (no commands)
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python futures-bot-v1/aliyun_readonly.py
