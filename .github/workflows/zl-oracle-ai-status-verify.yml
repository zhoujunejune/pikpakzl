name: Verify official start reached DeepSeek read-only production status
on:
  push:
    branches: [feat/deepseek40-45s-ai-only-prod-20261025]
    paths: [.github/workflows/zl-oracle-ai-status-verify.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: zl-alibaba-prediction-singlehost
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Deploy only one read-only DeepSeek status field, with rollback
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          python - <<'OUTER'
          import os,base64,time
          from alibabacloud_swas_open20200601.client import Client
          from alibabacloud_swas_open20200601 import models as sw
          from alibabacloud_tea_openapi import models as api
          script=r"""#!/bin/bash
          set -Eeuo pipefail
          app=/opt/zl-prediction-live/deepseek5
          adapter="$app/deepseek-adaptive15-production-adapter.mjs"
          backup=/var/lib/zl-prediction/archive/source-backups/official-ref-status-DEPLOY_SHA
          test -f "$adapter"
          test "$(systemctl is-active zl-prediction-official-reference.service)" = active
          for unit in zl-prediction-deepseek5 zl-prediction-trade zl-prediction-v2 zl-prediction-v3 zl-futures-bot-paper;do
           test "$(systemctl is-active "$unit")" = active
          done
          python3 - <<'PY'
          import json,urllib.request
          def get(port,r):
           with urllib.request.urlopen(f'http://127.0.0.1:{port}{r}',timeout=8) as z:return json.load(z)
          a=get(13001,'/api/status')
          b=get(13029,'/api/status')
          assert a.get('enabled') is False, 'FOLLOW_ON_ABORT'
          assert a.get('orderSignalModel')=='DEEPSEEK_5M_V1'
          assert b.get('decisionRule')=='PREWARM120_NEW_ROUND15_LIVE_DEEPSEEK_ONLY40S'
          assert 'officialReference' not in b,'STATUS_ALREADY_UPDATED'
          print('ORACLE_STATUS_FOLLOW_OFF=true')
          PY
          tmp=$(mktemp -d /tmp/zl-refstatus-XXXXXX)
          trap 'rm -rf "$tmp"' EXIT
          curl --fail --silent --show-error --retry 2 --max-time 30 "https://raw.githubusercontent.com/zhoujunejune/pikpakzl/DEPLOY_SHA/prediction-bot-v1/deepseek-adaptive15-production-adapter.mjs" -o "$tmp/adapter.mjs"
          /opt/zl-prediction-node/bin/node --check "$tmp/adapter.mjs"
          python3 - "$adapter" "$tmp/adapter.mjs" <<'PY'
          from pathlib import Path
          import sys
          old,new=map(lambda x:Path(x).read_text(),sys.argv[1:])
          marker='analysisCurrentDirection:shadow.window?.currentAnalysis??null,'
          replacement=marker+'\n     officialReference:shadow.officialReference??{available:false},'
          assert old.count(marker)==1
          assert 'officialReference:shadow.officialReference' in new,'REPOSITORY_EXPECTED_FIELD_MISSING'
          Path(sys.argv[2]).write_text(old.replace(marker,replacement,1))
          assert Path(sys.argv[2]).read_text()==old.replace(marker,replacement,1),'PATCH_VERIFICATION_FAILED'
          assert 'officialReference:shadow.officialReference' in new
          print('ORACLE_STATUS_ONLY_ONE_READONLY_FIELD_CHANGED=true')
          PY
          mkdir -p "$backup"
          cp -p "$adapter" "$backup/deepseek-adaptive15-production-adapter.mjs"
          rollback(){
           cp -p "$backup/deepseek-adaptive15-production-adapter.mjs" "$adapter"
           systemctl restart zl-prediction-deepseek5.service || true
           echo 'ORACLE_STATUS_ROLLBACK_ATTEMPTED=true'
          }
          trap rollback ERR
          python3 - "$adapter" "$tmp/adapter.mjs" <<'PY'
          import os,sys,tempfile
          from pathlib import Path
          dest,src=map(Path,sys.argv[1:]);st=dest.stat()
          fd,tmp=tempfile.mkstemp(prefix='.oracle-readonly-',dir=str(dest.parent))
          try:
           with os.fdopen(fd,'wb') as out:out.write(src.read_bytes())
           os.chmod(tmp,st.st_mode&0o777);os.chown(tmp,st.st_uid,st.st_gid)
           os.replace(tmp,dest)
          finally:
           if os.path.exists(tmp):os.unlink(tmp)
          PY
          python3 - <<'PY'
          import urllib.request,json
          with urllib.request.urlopen('http://127.0.0.1:13001/api/status',timeout=6) as u:t=json.load(u)
          assert t.get('enabled') is False, 'FOLLOW_CHANGED_ABORT'
          PY
          systemctl restart zl-prediction-deepseek5.service
          for i in $(seq 1 20);do
           if curl -fsS --max-time 4 http://127.0.0.1:13029/api/status -o "$tmp/status.json" 2>/dev/null;then break;fi
           sleep 2
          done
          python3 - "$tmp/status.json" <<'PY'
          import sys,json
          o=json.load(open(sys.argv[1]))
          assert o.get('ok') and o.get('model')=='DEEPSEEK_5M_V1'
          assert o.get('aiDirectionalRequired') is True and o.get('maxCallsPerRound')==5
          assert o.get('decisionRule')=='PREWARM120_NEW_ROUND15_LIVE_DEEPSEEK_ONLY40S'
          assert isinstance(o.get('officialReference'),dict)
          print('ORACLE_STATUS_VISIBLE_IN_LIVE_DEEPSEEK_API=true')
          print('ORACLE_STATUS_REFERENCE_CURRENT',json.dumps(o['officialReference'],ensure_ascii=False)[:400])
          PY
          for unit in zl-prediction-official-reference zl-prediction-deepseek5 zl-prediction-trade zl-prediction-v2 zl-prediction-v3 zl-futures-bot-paper;do
           test "$(systemctl is-active "$unit")" = active || exit 22
          done
          echo 'ORACLE_STATUS_ALL_SERVICES_OK=true'
          trap - ERR
          """
          cfg=api.Config(access_key_id=os.environ['ALIBABA_CLOUD_ACCESS_KEY_ID'],access_key_secret=os.environ['ALIBABA_CLOUD_ACCESS_KEY_SECRET'],region_id='ap-southeast-1',endpoint='swas.ap-southeast-1.aliyuncs.com')
          cli=Client(cfg)
          inv=cli.run_command(sw.RunCommandRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',name='zl-chainlink-readonly-status',type='RunShellScript',working_user='root',command_content=script.replace('DEPLOY_SHA',os.environ['GITHUB_SHA']),timeout=165)).body.invoke_id
          for _ in range(90):
           time.sleep(2)
           z=cli.describe_invocation_result(sw.DescribeInvocationResultRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',invoke_id=inv)).body.invocation_result
           if z and str(z.invocation_status) in ('Success','Failed','Aborted','ExecutionTimeout','ExitCodeNonzero'):
            out=base64.b64decode(z.output or '',validate=True).decode('utf8','replace')
            print('ORACLE_STATUS_REMOTE',z.invocation_status,z.exit_code);print(out[-8000:])
            if int(z.exit_code)!=0:raise RuntimeError('ORACLE_STATUS_REMOTE_FAILED')
            break
          else:raise RuntimeError('ORACLE_STATUS_REMOTE_TIMEOUT')
          OUTER
