name: FAST5 V7 ultra-fast 2-second bull bear signal to production
on:
  push:
    branches: [feat/deepseek40-45s-ai-only-prod-20261025]
    paths: [.github/workflows/zl-fast5-trend-v7-production-release.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: zl-alibaba-prediction-singlehost
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Regression - 2s real trend sign, missing-market WAIT, frontend and independent stats
        run: |
          node --check prediction-bot-v1/fast5-real-market-calculator.mjs
          node --check prediction-bot-v1/fast5-real-market-service.mjs
          node --check prediction-bot-v1/fast5-dashboard-inject.mjs
          node --test prediction-bot-v1/fast5-trend-fast2-v7.test.mjs prediction-bot-v1/fast5-dashboard-inject.test.mjs prediction-bot-v1/fast5-direction-ui.test.mjs prediction-bot-v1/fast5-compact-stable-ui.test.mjs
          python -m py_compile prediction-bot-v1/fast5_trend_v7_guarded_deploy.py prediction-bot-v1/fast5_independent_stats_service.py
          python prediction-bot-v1/fast5_independent_stats_service_test.py
  deploy:
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Atomic guarded Alibaba Cloud signal, validator and pickup update
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          python - <<'OUTER'
          import os,time,base64
          from alibabacloud_swas_open20200601.client import Client
          from alibabacloud_swas_open20200601 import models as sw
          from alibabacloud_tea_openapi import models as api
          sha=os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_REF_NAME']=='feat/deepseek40-45s-ai-only-prod-20261025'
          sh="""#!/bin/bash
          set -Eeuo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL --retry 2 --max-time 35 "https://raw.githubusercontent.com/zhoujunejune/pikpakzl/COMMIT_SHA/prediction-bot-v1/fast5_trend_v7_guarded_deploy.py" -o "$tmp/release.py"
          python3 -m py_compile "$tmp/release.py"
          python3 "$tmp/release.py" COMMIT_SHA
          """.replace('COMMIT_SHA',sha)
          cli=Client(api.Config(access_key_id=os.environ['ALIBABA_CLOUD_ACCESS_KEY_ID'],access_key_secret=os.environ['ALIBABA_CLOUD_ACCESS_KEY_SECRET'],region_id='ap-southeast-1',endpoint='swas.ap-southeast-1.aliyuncs.com'))
          inv=cli.run_command(sw.RunCommandRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',name='zl-fast5-2s-trend-real-market-v7',type='RunShellScript',working_user='root',command_content=sh,timeout=265)).body.invoke_id
          for _ in range(133):
           time.sleep(2)
           r=cli.describe_invocation_result(sw.DescribeInvocationResultRequest(region_id='ap-southeast-1',instance_id='b67374069bb3457ba6a3a2ede9305d3f',invoke_id=inv)).body.invocation_result
           if r and str(r.invocation_status) in ('Success','Failed','Aborted','ExecutionTimeout','ExitCodeNonzero'):
            print('TREND7_CLOUD_STATUS',r.invocation_status,'EXIT',r.exit_code)
            try:print(base64.b64decode(r.output or '',validate=True).decode('utf8','replace')[-17000:])
            except Exception:print('TREND7_REMOTE_OUTPUT_MISSING')
            if r.invocation_status!='Success' or int(r.exit_code)!=0:
             raise RuntimeError('TREND7_ALIBABA_CUTOVER_FAILED')
            break
          else:raise RuntimeError('TREND7_ALIBABA_TIMEOUT')
          OUTER
  verify:
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Public V7 status, original direction modes, new independent ledger
        env:
          ZL_PANEL_PASSWORD: ${{ secrets.ZL_PANEL_PASSWORD }}
        run: |
          python - <<'PY'
          import urllib.request,base64,os,json
          url='https://prediction.47-237-188-69.sslip.io'
          auth='Basic '+base64.b64encode(('zl:'+os.environ['ZL_PANEL_PASSWORD']).encode()).decode()
          def get(route):
           req=urllib.request.Request(url+route,headers={'Authorization':auth,'Cache-Control':'no-store'})
           with urllib.request.urlopen(req,timeout=18) as resp:
            return resp.status,resp.read(1300000)
          status,b=get('/api/fast5-live-status');s=json.loads(b)
          assert status==200 and s.get('ok') is True and s.get('strategyVersion')=='FAST5_BULL_BEAR_TREND_2S_V7'
          assert s.get('model')=='FAST5_SPOT_MOMENTUM_V1'
          status,b=get('/api/status');trade=json.loads(b)
          assert status==200 and trade.get('orderSignalModel')=='FAST5_SPOT_MOMENTUM_V1'
          assert trade.get('enabled') is False
          status,b=get('/api/fast5-round-stats');stats=json.loads(b)
          assert status==200 and stats.get('schema')=='FAST5_INDEPENDENT_OFFICIAL_ROUND_LEDGER_V1'
          assert stats.get('strategyVersion')=='FAST5_BULL_BEAR_TREND_2S_V7'
          assert stats.get('persisted') is True
          assert stats.get('health',{}).get('signalError') is None
          status,b=get('/');page=b.decode('utf8','replace')
          assert status==200 and '实时多空趋势（2秒锁定）' in page
          assert 'id="zlF5Forward"' in page and 'id="zlF5Inverse"' in page
          assert '/api/fast5-round-stats' in page and 'id="zlF5HistoryScroll"' in page
          print('FAST5_V7_PUBLIC_VERIFIED=true')
          print('FAST5_V7_HARD_2S_WINDOW=true')
          print('FAST5_V7_DIRECTION_SWITCHES_PRESERVED=true')
          print('FAST5_V7_OFFICIAL_STATS_ISOLATED=true')
          print('FAST5_V7_LIVE_FOLLOW_UNCHANGED_OFF=true')
          print('FAST5_V7_FEED_REQUEST_LAST_MS',s.get('lastRequestMs'))
          print('FAST5_V7_FIRST_CURRENT_LOCK',json.dumps({
           'round':s.get('round'),'locked':s.get('locked'),
           'direction':(s.get('latest') or {}).get('direction'),
           'lockElapsedMs':(s.get('latest') or {}).get('lockedAt',0)-s.get('round',0) if s.get('latest') else None
          }))
          PY
