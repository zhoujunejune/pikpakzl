name: EDGE5 V2 read-only source probe
on:
  pull_request:
    branches: [cloudflare-edge5m-20261017]
    paths: ['.github/workflows/edge5-v2-source-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check real Binance spot, futures, prediction book schemas
        run: |
          node --input-type=module <<'NODE'
          const checks={
            v3:'https://zl-signal-v3-migration.onrender.com/api/signal',
            spot:'https://data-api.binance.vision/api/v3/ticker/price?symbol=BTCUSDT',
            agg:'https://data-api.binance.vision/api/v3/aggTrades?symbol=BTCUSDT&limit=4',
            depth:'https://data-api.binance.vision/api/v3/depth?symbol=BTCUSDT&limit=5',
            perp:'https://fapi.binance.com/fapi/v1/ticker/bookTicker?symbol=BTCUSDT'
          };
          await Promise.all(Object.entries(checks).map(async([k,url])=>{
           try{
            const r=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(9000)});
            const d=await r.json();
            const o={name:k,http:r.status};
            if(k==='v3'){
             const f=d?.signal?.facts??{};
             o.round=d?.signal?.roundStartMs;o.generatedAt=d?.signal?.generatedAt;
             o.integrity={wsConnected:d?.dataIntegrity?.wsConnected,
               predictionOrderbookConnected:d?.dataIntegrity?.predictionOrderbookConnected,
               predictionOrderbookFresh:d?.dataIntegrity?.predictionOrderbookFresh,
               predictionOrderbookAgeMs:d?.dataIntegrity?.predictionOrderbookAgeMs,
               lastMessageAgeMs:d?.dataIntegrity?.lastMessageAgeMs};
             o.facts={predictionMarketRound:f.predictionMarketRound,
               predictionMarketRoundAligned:f.predictionMarketRoundAligned,
               predictionMarketId:f.predictionMarketId,
               predictionMarketBookAgeMs:f.predictionMarketBookAgeMs,
               predictionMarketYesDirection:f.predictionMarketYesDirection,
               predictionMarketMappingReliable:f.predictionMarketMappingReliable,
               predictionMarketUpBid:f.predictionMarketUpBid,
               predictionMarketUpAsk:f.predictionMarketUpAsk,
               predictionMarketUpMid:f.predictionMarketUpMid,
               predictionMarketDepthImbalance5:f.predictionMarketDepthImbalance5};
            }else if(k==='agg'){
             o.count=Array.isArray(d)?d.length:null;
             o.lastAt=Array.isArray(d)?d.at(-1)?.T:null;
            }else if(k==='depth'){
             o.bids=d?.bids?.length;o.asks=d?.asks?.length;
            }else{
             o.keys=Object.keys(d||{});o.quote=d?.price??d?.bidPrice??null;
            }
            console.log('EDGE_V2_SOURCE_CHECK',JSON.stringify(o));
           }catch(e){console.log('EDGE_V2_SOURCE_CHECK',JSON.stringify({name:k,error:String(e.message).slice(0,110)}))}
          }));
          NODE