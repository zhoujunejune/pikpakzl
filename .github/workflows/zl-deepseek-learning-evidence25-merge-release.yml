name: DeepSeek official-learning evidence guarded merge deploy 25s six calls
on:
  push:
    branches: [feat/deepseek-learning-evidence25-20261021]
    paths:
      - .github/workflows/zl-deepseek-learning-evidence25-merge-release.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: zl-alibaba-prediction-singlehost
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Learning telemetry and unchanged trading model tests
        run: |
          bash -n prediction-bot-v1/learning_evidence25_apply.sh
          node --test prediction-bot-v1/deepseek-learning-evidence25.test.mjs
          node --test prediction-bot-v1/deepseek-wait-reconsider25.test.mjs
          node --test prediction-bot-v1/deepseek-free-analysis25.test.mjs
          node --test prediction-bot-v1/deepseek-5m-episodic-memory.test.mjs
  deploy:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install existing Alibaba Cloud SWAS SDK
        run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Guarded source-preserving merge and live validation, follow switch remains OFF
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python prediction-bot-v1/learning_evidence25_launch.py
