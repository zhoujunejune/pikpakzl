name: Training Status Probe
on:
  push:
    paths:
      - '.github/workflows/training-status-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fetch training status
        shell: bash
        run: |
          set -euo pipefail
          echo "===TRAINING_STATUS_BEGIN==="
          curl -fsS --max-time 20 'https://trade-control-panel-production.up.railway.app/api/training-status'
          echo
          echo "===TRAINING_STATUS_END==="
          echo "===BASE_DIRECTION_RESCUE_V2_BEGIN==="
          curl -fsS --max-time 20 'https://trade-control-panel-production.up.railway.app/api/training-status' | jq -c '.models.baseDirectionRescueV2'
          echo "===BASE_DIRECTION_RESCUE_V2_END==="
          curl -fsS --max-time 20 'https://trade-control-panel-production.up.railway.app/api/round-stats' -o /tmp/round-stats.json
          echo "===RECENT20_DECISIONS_BEGIN==="
          jq -c '[.records[] | select((.productionActual=="UP" or .productionActual=="DOWN") and (.productionPrediction=="UP" or .productionPrediction=="DOWN"))][0:20] | .[] | {roundStartMs,productionSource,productionPrediction,productionActual,productionResult,productionConfidence,productionDelayMs}' /tmp/round-stats.json
          echo "===RECENT20_DECISIONS_END==="
          echo "===RECENT20_BREAKDOWN_BEGIN==="
          jq -c '
            [.records[] | select((.productionActual=="UP" or .productionActual=="DOWN") and (.productionPrediction=="UP" or .productionPrediction=="DOWN"))][0:20]
            | {
                total:length,
                hits:map(select(.productionResult=="HIT"))|length,
                misses:map(select(.productionResult=="MISS"))|length,
                up:{n:map(select(.productionPrediction=="UP"))|length,hits:map(select(.productionPrediction=="UP" and .productionResult=="HIT"))|length},
                down:{n:map(select(.productionPrediction=="DOWN"))|length,hits:map(select(.productionPrediction=="DOWN" and .productionResult=="HIT"))|length},
                bySource:(group_by(.productionSource)|map({source:.[0].productionSource,n:length,hits:map(select(.productionResult=="HIT"))|length,misses:map(select(.productionResult=="MISS"))|length}))
              }' /tmp/round-stats.json
          echo "===RECENT20_BREAKDOWN_END==="
          echo "===RECENT_DIRECTION_AUDIT_BEGIN==="
          jq -c '
            def decided: [.records[] | select((.productionActual=="UP" or .productionActual=="DOWN") and (.productionPrediction=="UP" or .productionPrediction=="DOWN"))];
            def stat(xs):
              {n:(xs|length),hits:(xs|map(select(.productionResult=="HIT"))|length),misses:(xs|map(select(.productionResult=="MISS"))|length),
               accuracy:(if (xs|length)>0 then ((xs|map(select(.productionResult=="HIT"))|length)/(xs|length)) else null end)};
            decided as $d |
            {
              all:{
                up:stat([$d[]|select(.productionPrediction=="UP")]),
                down:stat([$d[]|select(.productionPrediction=="DOWN")])
              },
              recent10:{
                up:stat([($d[0:10])[]|select(.productionPrediction=="UP")]),
                down:stat([($d[0:10])[]|select(.productionPrediction=="DOWN")])
              },
              recent20:{
                up:stat([($d[0:20])[]|select(.productionPrediction=="UP")]),
                down:stat([($d[0:20])[]|select(.productionPrediction=="DOWN")])
              },
              recent50:{
                up:stat([($d[0:50])[]|select(.productionPrediction=="UP")]),
                down:stat([($d[0:50])[]|select(.productionPrediction=="DOWN")])
              },
              bySource:{
                selectiveV2:{
                  up:stat([$d[]|select((.productionSource|tostring|startswith("LOCK_QUALITY_SELECTIVE_V2")) and .productionPrediction=="UP")]),
                  down:stat([$d[]|select((.productionSource|tostring|startswith("LOCK_QUALITY_SELECTIVE_V2")) and .productionPrediction=="DOWN")])
                },
                edgeRescue:{
                  up:stat([$d[]|select(.productionSource=="SELECTIVE_V2_EDGE_RESCUE_PRIMARY" and .productionPrediction=="UP")]),
                  down:stat([$d[]|select(.productionSource=="SELECTIVE_V2_EDGE_RESCUE_PRIMARY" and .productionPrediction=="DOWN")])
                }
              }
            }' /tmp/round-stats.json
          echo "===RECENT_DIRECTION_AUDIT_END==="
          echo "===UP_TIGHTEN_REPLAY_BEGIN==="
          jq -c '
            [.records[]
              | select(.productionSource=="LOCK_QUALITY_SELECTIVE_V2_PRIMARY" and .productionPrediction=="UP" and (.productionResult=="HIT" or .productionResult=="MISS"))
              | {r:.productionResult,s:(.lockQualitySelectiveV2.predictionSupport // null),c:(.lockQualitySelectiveV2.currentScoreAbs // null),d:(.productionDelayMs // .lockQualitySelectiveV2.lockDelayMs // null)}
            ] as $u |
            def stat($xs): {n:($xs|length),hits:($xs|map(select(.r=="HIT"))|length),accuracy:(if ($xs|length)>0 then (($xs|map(select(.r=="HIT"))|length)/($xs|length)) else null end)};
            {
              base:stat($u),
              s15_c65_d20:stat([$u[]|select(.s!=null and .c!=null and .d!=null and .s>=0.15 and .c>=0.65 and .d<20000)]),
              s16_c67_d19:stat([$u[]|select(.s!=null and .c!=null and .d!=null and .s>=0.16 and .c>=0.67 and .d<19000)]),
              s18_c70_d18:stat([$u[]|select(.s!=null and .c!=null and .d!=null and .s>=0.18 and .c>=0.70 and .d<18000)]),
              s18_c65_d18:stat([$u[]|select(.s!=null and .c!=null and .d!=null and .s>=0.18 and .c>=0.65 and .d<18000)]),
              rows:$u
            }' /tmp/round-stats.json
          echo "===UP_TIGHTEN_REPLAY_END==="
