name: Read-only production prediction Quote failure reasons
on:
  push:
    branches: [audit/aliyun-speed-path-20261022]
    paths:
      - .github/workflows/zl-aliyun-quote-failure-audit.yml
      - prediction-bot-v1/aliyun_quote_failures_readonly_20261023.py
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Validate read-only diagnostic
        run: |
          python - <<'PY'
          import ast,subprocess
          from pathlib import Path
          mod=ast.parse(Path('prediction-bot-v1/aliyun_quote_failures_readonly_20261023.py').read_text())
          remote=next(n.value.value for n in mod.body if isinstance(n,ast.Assign) for t in n.targets if isinstance(t,ast.Name) and t.id=='REMOTE')
          assert subprocess.run(['bash','-n'],input=remote,text=True,capture_output=True).returncode==0
          assert 'systemctl restart' not in remote and 'place-order-bundle' not in remote
          inner=remote.split("python3 - <<'PY'",1)[1].split('\nPY',1)[0]
          compile(inner,'quote failure audit','exec')
          print('QUOTE_FAILURE_READONLY_AUDIT_VALID=true')
          PY
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Audit sanitized quote failure reasons
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python prediction-bot-v1/aliyun_quote_failures_readonly_20261023.py
