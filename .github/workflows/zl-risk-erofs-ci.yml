name: Test EROFS repair and startup journal write before live release
on:
  push:
    branches: [fix/risk-sell-journal-erofs-20261023]
    paths:
      - .github/workflows/zl-risk-erofs-ci.yml
      - railway-diagnostic/risk-worker.mjs
      - railway-diagnostic/risk-prepost-journal-erofs.test.mjs
      - railway-diagnostic/risk-sell-finality.mjs
  workflow_dispatch:
permissions: {contents: read}
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check railway-diagnostic/risk-worker.mjs
      - run: node --test railway-diagnostic/risk-prepost-journal-erofs.test.mjs railway-diagnostic/risk-sell-finality.test.mjs railway-diagnostic/risk-sell-postsubmit-recovery.test.mjs railway-diagnostic/risk-sell-safe-retry.test.mjs railway-diagnostic/risk-sell-retry.test.mjs railway-diagnostic/risk-worker-speed.test.mjs railway-diagnostic/real-risk-monitor.test.mjs
      - name: Assert real Binance SELL never follows failed local journal write
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('railway-diagnostic/risk-worker.mjs').read_text()
          assert s.index('persistPendingSellState(); // must succeed BEFORE sending a real SELL')<s.index('const placed = await placeSell(')
          assert s.index('risk_sell_not_submitted_journal_unavailable')<s.index('const placed = await placeSell(')
          assert "log('risk_sell_journal_ready'" in s
          assert "process.exit(75)" in s
          assert "const POLL_MS = Math.max(300" in s
          print('EROFS_BEFORE_POST_RETRY_REGRESSION_PASSED=true')
          PY
