name: GUARDIAN5 Alibaba FIXED-only guarded production deployment
on:
  push:
    branches:
      - fix/guardian5-fixed-only-readiness-20261029
    paths:
      - prediction-bot-v1/aliyun_guardian5_repair_deploy.py
      - .github/workflows/guardian5-alibaba-fixed-repair-deploy.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: guardian5-fixed-repair-alibaba-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate repair before accessing production
        run: |
          python -m py_compile prediction-bot-v1/aliyun_guardian5_repair_deploy.py
          python - <<'PY'
          import ast,subprocess
          p='prediction-bot-v1/aliyun_guardian5_repair_deploy.py'
          t=ast.parse(open(p).read())
          s=next(a.value.value for a in t.body if isinstance(a,ast.Assign) and any(getattr(n,'id',None)=='REMOTE' for n in a.targets))
          r=subprocess.run(['bash','-n'],input=s,text=True,capture_output=True)
          print(r.stderr)
          assert r.returncode==0,'REMOTE_SCRIPT_SYNTAX_INVALID'
          PY
          for f in index wrapper guardian-fixed-readiness guardian-live-bridge risk-runner risk-worker risk-config-storage control-shell guardian-main-dashboard; do
            node --check "railway-diagnostic/$f.mjs"
          done
          node --test railway-diagnostic/guardian-fixed-readiness.test.mjs railway-diagnostic/guardian-live-risk-readiness.test.mjs
      - name: Install Alibaba SWAS SDK
        run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Backup, staged generator verification, risk-first guarded cutover
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          test -n "$ALIBABA_CLOUD_ACCESS_KEY_ID"
          test -n "$ALIBABA_CLOUD_ACCESS_KEY_SECRET"
          python prediction-bot-v1/aliyun_guardian5_repair_deploy.py
