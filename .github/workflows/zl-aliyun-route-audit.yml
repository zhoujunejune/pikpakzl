name: Diagnose Alibaba prediction menu route and exact click navigation
on:
  push:
    branches: [feature/zl-futures-bot-v1]
    paths:
      - 'prediction-bot-v1/aliyun_route_audit.py'
      - '.github/workflows/zl-aliyun-route-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile prediction-bot-v1/aliyun_route_audit.py
      - run: python -m pip install -q alibabacloud_swas_open20200601==4.0.0
      - name: Inspect Alibaba Caddy route and upstream requests
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python prediction-bot-v1/aliyun_route_audit.py
      - name: Verify exact menu links with authenticated requests
        env:
          ZL_PANEL_PASSWORD: ${{ secrets.ZL_PANEL_PASSWORD }}
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,base64,os
          basic="Basic "+base64.b64encode(("zl:"+os.environ["ZL_PANEL_PASSWORD"]).encode()).decode()
          hosts=["47-237-188-69.sslip.io","prediction.47-237-188-69.sslip.io"]
          paths=["/dashboard/","/prediction/","/prediction/healthz","/api/status","/"]
          for host in hosts:
            for path in paths:
              url="https://"+host+path
              req=urllib.request.Request(url,headers={"Authorization":basic,"Cache-Control":"no-cache"})
              try:
                with urllib.request.urlopen(req,timeout=12) as r:
                  body=r.read(200000);code=r.status
              except urllib.error.HTTPError as e:
                code=e.code;body=e.read(2000)
              except Exception as e:
                code=0;body=type(e).__name__.encode()
              print("ROUTE_AUTH_PROBE",host,path,code,"body_kind",("Bad Request" if b"Bad Request" in body else "HTML" if b"<html" in body.lower() else "OTHER"),"bytes",len(body))
          PY
